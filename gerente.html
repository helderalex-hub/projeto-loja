<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerente Pro - Beleza & Cia</title>
    <style>
        :root {
            --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #d63384;
            --text-main: #f8fafc; --text-dim: #94a3b8; --money: #22c55e;
            --danger: #ef4444; --info: #3b82f6;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        
        h1, h2 { color: var(--accent); margin-top: 0; }
        header { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; }

        /* ÁREA 1: DASHBOARDS */
        .area-dash { grid-column: span 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background: var(--card-dark); padding: 20px; border-radius: 12px; border-bottom: 4px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .stat-card h3 { margin: 0; font-size: 13px; color: var(--text-dim); text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; }

        /* ÁREA 2: RELATÓRIOS */
        .area-reports { background: var(--card-dark); padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        .report-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; border-left: 3px solid var(--info); }

        /* ÁREA 3: CADASTRO */
        .area-form { background: var(--card-dark); padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .photo-zone { grid-column: span 2; height: 100px; border: 2px dashed #475569; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .photo-zone img { height: 100%; object-fit: cover; }
        input { background: #334155; border: 1px solid #475569; color: white; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: white; padding: 12px; width: 100%; margin-top: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* ÁREA 4: LISTA DE PRODUTOS */
        .area-list { grid-column: span 2; background: var(--card-dark); padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        .product-row { display: flex; align-items: center; gap: 15px; padding: 12px; border-bottom: 1px solid #334155; transition: 0.2s; }
        .product-row:hover { background: rgba(255,255,255,0.03); }
        .img-table { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; cursor: pointer; background: #0f172a; }
        .product-info { flex-grow: 1; }
        .actions { display: flex; gap: 8px; }
        .btn-icon { background: #334155; border: none; color: white; padding: 8px; border-radius: 6px; cursor: pointer; }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .area-dash { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>👑 Gestão Centralizada</h1>
        <button onclick="carregarTudo()" style="background:none; border:none; color:var(--accent); font-size:24px; cursor:pointer;">🔄</button>
    </header>

    <section class="area-dash">
        <div class="stat-card"><h3>Investimento (Custo)</h3><p id="dash-custo">€ 0.00</p></div>
        <div class="stat-card"><h3>Faturamento (Venda)</h3><p id="dash-venda">€ 0.00</p></div>
        <div class="stat-card"><h3>Lucro Projetado</h3><p id="dash-lucro" style="color:var(--money)">€ 0.00</p></div>
    </section>

    <section class="area-reports">
        <h2>📊 Alertas e Relatórios</h2>
        <div id="relatorios-box">
            <div class="report-item"><span>Stock Crítico</span><b id="rep-critico" style="color:var(--danger)">0</b></div>
            <div class="report-item"><span>Valor Médio Item</span><b id="rep-media">€ 0.00</b></div>
            <div class="report-item"><span>Variedade Mix</span><b id="rep-mix">0</b></div>
        </div>
    </section>

    <section class="area-form">
        <h2 id="form-title">📝 Cadastro / Edição</h2>
        <input type="hidden" id="prod-id">
        <input type="hidden" id="imagem-url">
        
        <div class="photo-zone" onclick="definirFoto()" id="drop-area">
            <img id="preview-form" src="" style="display:none">
            <span id="txt-photo">📷 Clique para Link da Foto</span>
        </div>

        <div class="grid-inputs" style="margin-top:10px">
            <div style="grid-column: span 2;"><input type="text" id="nome" placeholder="Nome do Produto"></div>
            <input type="number" id="preco_entrada" step="0.01" placeholder="Custo (€)">
            <input type="number" id="preco" step="0.01" placeholder="Venda (€)">
            <input type="number" id="estoque" placeholder="Stock">
            <input type="date" id="validade">
        </div>
        <button class="btn-main" onclick="salvar()">GRAVAR DADOS</button>
        <button onclick="limpar()" style="background:none; color:var(--text-dim); border:none; width:100%; margin-top:10px; cursor:pointer">Limpar/Novo</button>
    </section>

    <section class="area-list">
        <h2>📦 Inventário de Produtos</h2>
        <div id="lista-corpo">
            </div>
    </section>
</div>

<script>
    const API_URL = "https://projeto-loja-beleza-cia.onrender.com";

    async function carregarTudo() {
        const res = await fetch(`${API_URL}/produtos`);
        const dados = await res.json();
        
        let custoT = 0, vendaT = 0, criticos = 0;
        const lista = document.getElementById("lista-corpo");
        lista.innerHTML = "";

        dados.forEach(p => {
            custoT += (p.preco_entrada || 0) * p.estoque;
            vendaT += p.preco * p.estoque;
            if(p.estoque <= 5) criticos++;

            lista.innerHTML += `
                <div class="product-row">
                    <img src="${p.imagem || ''}" class="img-table" onclick="updateFoto(${p.id}, '${p.nome}')" onerror="this.src='https://via.placeholder.com/50?text=IMG'">
                    <div class="product-info">
                        <b>${p.nome}</b><br>
                        <small>Custo: €${(p.preco_entrada || 0).toFixed(2)} | Venda: €${p.preco.toFixed(2)} | Stock: ${p.estoque}</small>
                    </div>
                    <div class="actions">
                        <button class="btn-icon" onclick='prepararEdicao(${JSON.stringify(p)})'>✏️</button>
                        <button class="btn-icon" style="color:var(--danger)" onclick="eliminar(${p.id})">🗑️</button>
                    </div>
                </div>
            `;
        });

        // Atualizar Áreas
        document.getElementById("dash-custo").innerText = `€ ${custoT.toFixed(2)}`;
        document.getElementById("dash-venda").innerText = `€ ${vendaT.toFixed(2)}`;
        document.getElementById("dash-lucro").innerText = `€ ${(vendaT - custoT).toFixed(2)}`;
        document.getElementById("rep-critico").innerText = criticos;
        document.getElementById("rep-mix").innerText = dados.length;
        document.getElementById("rep-media").innerText = `€ ${(vendaT / (dados.length || 1)).toFixed(2)}`;
    }

    function definirFoto() {
        const url = prompt("Link da Imagem:");
        if(url) {
            document.getElementById("imagem-url").value = url;
            document.getElementById("preview-form").src = url;
            document.getElementById("preview-form").style.display = "block";
            document.getElementById("txt-photo").style.display = "none";
        }
    }

    async function updateFoto(id, nome) {
        const url = prompt(`Novo link para ${nome}:`);
        if(url) {
            await fetch(`${API_URL}/produtos/${id}`, {
                method: "PUT",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ imagem: url })
            });
            carregarTudo();
        }
    }

    function prepararEdicao(p) {
        document.getElementById("prod-id").value = p.id;
        document.getElementById("nome").value = p.nome;
        document.getElementById("preco").value = p.preco;
        document.getElementById("preco_entrada").value = p.preco_entrada || 0;
        document.getElementById("estoque").value = p.estoque;
        document.getElementById("validade").value = p.validade || "";
        document.getElementById("imagem-url").value = p.imagem || "";
        if(p.imagem) {
            document.getElementById("preview-form").src = p.imagem;
            document.getElementById("preview-form").style.display = "block";
            document.getElementById("txt-photo").style.display = "none";
        }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function salvar() {
        const id = document.getElementById("prod-id").value;
        const obj = {
            nome: document.getElementById("nome").value,
            preco: parseFloat(document.getElementById("preco").value),
            preco_entrada: parseFloat(document.getElementById("preco_entrada").value) || 0,
            estoque: parseInt(document.getElementById("estoque").value),
            validade: document.getElementById("validade").value || null,
            imagem: document.getElementById("imagem-url").value
        };

        const res = await fetch(id ? `${API_URL}/produtos/${id}` : `${API_URL}/produtos`, {
            method: id ? "PUT" : "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(obj)
        });

        if(res.ok) { limpar(); carregarTudo(); }
    }

    async function eliminar(id) {
        if(confirm("Confirmar exclusão?")) {
            await fetch(`${API_URL}/produtos/${id}`, { method: "DELETE" });
            carregarTudo();
        }
    }

    function limpar() {
        document.getElementById("prod-id").value = "";
        document.getElementById("nome").value = "";
        document.getElementById("preco").value = "";
        document.getElementById("preco_entrada").value = "";
        document.getElementById("estoque").value = "";
        document.getElementById("validade").value = "";
        document.getElementById("imagem-url").value = "";
        document.getElementById("preview-form").style.display = "none";
        document.getElementById("txt-photo").style.display = "block";
    }

    carregarTudo();
</script>
</body>
</html>
