<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerente Pro - Beleza & Cia</title>
    <style>
        :root {
            --bg-dark: #0f172a; --card-dark: #1e293b; --accent: #d63384;
            --text-main: #f8fafc; --text-dim: #94a3b8; --money: #22c55e;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }

        /* DASHBOARD FINANCEIRO */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-dark); padding: 20px; border-radius: 12px; border-bottom: 4px solid var(--accent); }
        .stat-card h3 { margin: 0; font-size: 13px; color: var(--text-dim); text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 22px; font-weight: bold; }
        .lucro { color: var(--money); }

        /* FORMULÁRIO */
        .form-card { background: var(--card-dark); padding: 25px; border-radius: 15px; margin-bottom: 40px; border: 1px solid #334155; }
        .grid-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .photo-input-area { grid-row: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #475569; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .photo-input-area:hover { border-color: var(--accent); background: #334155; }
        .photo-input-area img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 5px; }
        
        input { background: #334155; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: white; padding: 15px; width: 100%; margin-top: 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* TABELA DE PRODUTOS */
        .product-item { background: var(--card-dark); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 20px; margin-bottom: 10px; border: 1px solid transparent; }
        .product-item:hover { border-color: var(--accent); }
        .img-table { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; background: #0f172a; }
        .info { flex-grow: 1; }
        .actions { display: flex; gap: 8px; }
        .btn-action { background: #334155; border: none; color: white; padding: 10px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>👑 Gestão Financeira & Stock</h1>
        <button onclick="carregar()" style="background:none; border:none; color:var(--accent); font-size:24px; cursor:pointer;">🔄</button>
    </header>

    <div class="dashboard">
        <div class="stat-card">
            <h3>Custo Total Stock</h3>
            <p id="dash-custo">€ 0.00</p>
        </div>
        <div class="stat-card">
            <h3>Venda Total Esperada</h3>
            <p id="dash-venda">€ 0.00</p>
        </div>
        <div class="stat-card">
            <h3>Lucro Estimado</h3>
            <p id="dash-lucro" class="lucro">€ 0.00</p>
        </div>
    </div>

    <div class="form-card">
        <input type="hidden" id="prod-id">
        <input type="hidden" id="imagem-url">
        
        <div class="grid-inputs">
            <div class="photo-input-area" onclick="alterarFotoManual('formulario')">
                <img id="preview-form" src="https://via.placeholder.com/100?text=FOTO">
                <small id="txt-foto">Clique para Link</small>
            </div>
            
            <div style="grid-column: span 2;">
                <label style="font-size:12px; color:var(--text-dim)">Nome do Produto</label>
                <input type="text" id="nome" placeholder="Nome do Produto">
            </div>
            
            <div>
                <label style="font-size:12px; color:var(--text-dim)">Preço Custo (€)</label>
                <input type="number" id="preco_entrada" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label style="font-size:12px; color:var(--text-dim)">Preço Venda (€)</label>
                <input type="number" id="preco" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label style="font-size:12px; color:var(--text-dim)">Quantidade</label>
                <input type="number" id="estoque" placeholder="0">
            </div>
            <div style="grid-column: span 2;">
                <label style="font-size:12px; color:var(--text-dim)">Validade</label>
                <input type="date" id="validade">
            </div>
        </div>
        
        <button class="btn-main" onclick="salvar()">GRAVAR ALTERAÇÕES</button>
        <button onclick="limpar()" style="background:none; color:var(--text-dim); width:100%; margin-top:10px; border:none; cursor:pointer;">Novo Cadastro</button>
    </div>

    <div id="lista"></div>
</div>

<script>
    const API_URL = "https://projeto-loja-beleza-cia.onrender.com";

    async function carregar() {
        const res = await fetch(`${API_URL}/produtos`);
        const dados = await res.json();
        
        let totalCusto = 0, totalVenda = 0;
        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        dados.forEach(p => {
            const custoItem = (p.preco_entrada || 0) * p.estoque;
            const vendaItem = p.preco * p.estoque;
            totalCusto += custoItem;
            totalVenda += vendaItem;

            lista.innerHTML += `
                <div class="product-item">
                    <img src="${p.imagem || 'https://via.placeholder.com/60'}" 
                         class="img-table" 
                         onclick="alterarFotoNaLinha(${p.id}, '${p.nome}')"
                         title="Clique para mudar a foto">
                    <div class="info">
                        <h4>${p.nome}</h4>
                        <small>Custo: €${(p.preco_entrada || 0).toFixed(2)} | Venda: €${p.preco.toFixed(2)} | Stock: ${p.estoque}</small>
                    </div>
                    <div class="actions">
                        <button class="btn-action" onclick='prepararEdicao(${JSON.stringify(p)})'>✏️</button>
                        <button class="btn-action" style="color:#ef4444" onclick="eliminar(${p.id})">🗑️</button>
                    </div>
                </div>
            `;
        });

        document.getElementById("dash-custo").innerText = `€ ${totalCusto.toFixed(2)}`;
        document.getElementById("dash-venda").innerText = `€ ${totalVenda.toFixed(2)}`;
        document.getElementById("dash-lucro").innerText = `€ ${(totalVenda - totalCusto).toFixed(2)}`;
    }

    function alterarFotoManual(tipo) {
        const url = prompt("Cole o link (URL) da imagem do produto:");
        if (url) {
            document.getElementById("imagem-url").value = url;
            document.getElementById("preview-form").src = url;
        }
    }

    async function alterarFotoNaLinha(id, nome) {
        const url = prompt(`Novo link de imagem para: ${nome}`);
        if (url) {
            await fetch(`${API_URL}/produtos/${id}`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ imagem: url })
            });
            carregar();
        }
    }

    function prepararEdicao(p) {
        document.getElementById("prod-id").value = p.id;
        document.getElementById("nome").value = p.nome;
        document.getElementById("preco").value = p.preco;
        document.getElementById("preco_entrada").value = p.preco_entrada || 0;
        document.getElementById("estoque").value = p.estoque;
        document.getElementById("validade").value = p.validade || "";
        document.getElementById("imagem-url").value = p.imagem || "";
        document.getElementById("preview-form").src = p.imagem || "https://via.placeholder.com/100";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function salvar() {
        const id = document.getElementById("prod-id").value;
        const produto = {
            nome: document.getElementById("nome").value,
            preco: parseFloat(document.getElementById("preco").value),
            preco_entrada: parseFloat(document.getElementById("preco_entrada").value) || 0,
            estoque: parseInt(document.getElementById("estoque").value),
            validade: document.getElementById("validade").value || null,
            imagem: document.getElementById("imagem-url").value
        };

        const metodo = id ? "PUT" : "POST";
        const url = id ? `${API_URL}/produtos/${id}` : `${API_URL}/produtos`;

        await fetch(url, {
            method: metodo,
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(produto)
        });
        limpar();
        carregar();
    }

    async function eliminar(id) {
        if(confirm("Eliminar produto?")) {
            await fetch(`${API_URL}/produtos/${id}`, { method: "DELETE" });
            carregar();
        }
    }

    function limpar() {
        document.getElementById("prod-id").value = "";
        document.getElementById("nome").value = "";
        document.getElementById("preco").value = "";
        document.getElementById("preco_entrada").value = "";
        document.getElementById("estoque").value = "";
        document.getElementById("validade").value = "";
        document.getElementById("imagem-url").value = "";
        document.getElementById("preview-form").src = "https://via.placeholder.com/100?text=FOTO";
    }

    carregar();
</script>
</body>
</html>
