<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Admin | Lust Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (localStorage.getItem('token_gerente') !== 'logado_sucesso_servidor') window.location.href = 'login-adm.html';</script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --dark: #0f172a;       /* Dark Blue (Fundo) */
            --card: #1e293b;       /* Slate (Cartões) */
            --gold: #cca43b;       /* Gold (Cor Principal) */
            --gold-light: #fde047; /* Gold Claro (Texto destaque) */
            --texto: #f8fafc; 
            --borda: #334155; 
            --verde: #22c55e; 
            --erro: #ef4444; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--texto); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding-bottom: 50px; }
        
        .header-top { text-align: center; margin-bottom: 25px; position: relative; }
        h1 { margin: 0; font-size: 24px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        .btn-sair { position: absolute; top: 0; right: 0; background: transparent; border: 1px solid var(--borda); color: #cbd5e1; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .btn-sair:hover { border-color: var(--gold); color: var(--gold); }

        /* DASHBOARD */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card-dash { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--borda); text-align: center; border-left: 4px solid var(--gold); }
        .card-dash h3 { margin: 0; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .card-dash p { margin: 8px 0 0; font-size: 18px; font-weight: bold; color: var(--gold-light); }

        /* GRÁFICO */
        .area-grafico { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--borda); height: 350px; margin-top: 40px; }
        
        /* BOTÕES */
        .area-relatorios { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-pdf { background: #334155; color: white; border: 1px solid var(--borda); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .btn-pdf:hover { background: var(--gold); border-color: var(--gold); color: #000; }
        
        /* CADASTRO */
        .card-cadastro { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--borda); margin-bottom: 25px; display: flex; gap: 20px; flex-wrap: wrap; }
        .area-foto { width: 180px; height: 180px; background: #000; border: 2px dashed var(--gold); border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .area-foto img { width: 100%; height: 100%; object-fit: contain; }
        .area-foto span { color: var(--gold); font-size: 12px; font-weight: bold; }
        
        .campos-texto { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 250px; }
        .grid-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { font-size: 11px; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 4px; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--borda); color: white; border-radius: 8px; }
        input:focus { border-color: var(--gold); outline: none; }
        
        .btn-principal { background: var(--gold); color: #000; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: auto; text-transform: uppercase; letter-spacing: 1px; }
        .btn-principal:hover { background: #b89334; }

        /* LISTAS */
        .produto-item { background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .img-lista { width: 60px; height: 60px; border-radius: 8px; object-fit: contain; background: #000; border: 1px solid #333; }
        .lista-box { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid var(--borda); max-height: 250px; overflow-y: auto; }
        .venda-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; display: flex; justify-content: space-between; }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>💎 Lust Store <span style="font-size:14px; color:#64748b; vertical-align:middle;">ADMIN</span></h1>
            <button class="btn-sair" onclick="sair()">🔒 SAIR</button>
        </div>
        
        <div class="dashboard">
            <div class="card-dash"><h3>Venda Bruta (Estoque)</h3><p id="dash-venda">€ 0.00</p></div>
            <div class="card-dash"><h3>Custo Estoque</h3><p id="dash-custo">€ 0.00</p></div>
            <div class="card-dash"><h3>Lucro Estimado</h3><p id="dash-lucro-est">€ 0.00</p></div>
            <div class="card-dash" style="border-color: var(--verde);"><h3>Vendas (7 Dias)</h3><p id="dash-venda-semana" style="color:var(--verde)">€ 0.00</p></div>
            <div class="card-dash" style="border-color: var(--verde);"><h3>Lucro Real (7 Dias)</h3><p id="dash-lucro-semana" style="color:var(--verde)">€ 0.00</p></div>
        </div>

        <div class="area-relatorios">
            <div style="width:100%; color:var(--gold); font-weight:bold; font-size:13px; margin-bottom:5px; text-transform:uppercase;">📑 Logística & Finanças:</div>
            <button class="btn-pdf" onclick="gerarEtiquetasDoDia()" style="background:var(--gold); color:black;">🏷️ Etiquetas (Hoje)</button>
            <button class="btn-pdf" onclick="gerarRelatorioVendas('mensal')">💰 Rel. Mensal</button>
            <button class="btn-pdf" onclick="gerarRelatorioVendas('semanal')">📈 Rel. Semanal</button>
            <button class="btn-pdf" onclick="gerarPDF('inventario')">📦 Inventário</button>
        </div>

        <div class="card-cadastro">
            <div class="area-foto" onclick="document.getElementById('input-file').click()">
                <img id="img-preview" src="" style="display:none">
                <span id="txt-foto">📷<br>ADICIONAR FOTO</span>
                <input type="file" id="input-file" accept="image/*" style="display:none" onchange="processarFoto(this)">
                <input type="hidden" id="imagem">
            </div>
            <div class="campos-texto">
                <input type="hidden" id="edit-id">
                <div><label>NOME DO PRODUTO</label><input type="text" id="nome" placeholder="Ex: Perfume Exclusive"></div>
                <div class="grid-duplo">
                    <div><label>CUSTO (€)</label><input type="number" id="preco_entrada" step="0.01"></div>
                    <div><label>VENDA (€)</label><input type="number" id="preco" step="0.01"></div>
                </div>
                <div class="grid-duplo">
                    <div><label>ESTOQUE</label><input type="number" id="estoque"></div>
                    <div><label>VALIDADE</label><input type="date" id="validade"></div>
                </div>
                <button class="btn-principal" id="btnSalvar" onclick="salvar()">Gravar Produto</button>
            </div>
        </div>

        <div style="margin-bottom:30px;"><h2 style="font-size:16px; color:var(--gold); text-transform:uppercase;">📦 Últimas Encomendas</h2><div id="lista-vendas" class="lista-box">A carregar...</div></div>
        
        <h2 style="font-size:16px; color:var(--gold); text-transform:uppercase;">📋 Inventário</h2>
        <div id="lista">A carregar...</div>

        <h2 style="font-size:16px; color:var(--gold); margin-top:40px; text-transform:uppercase;">📊 Performance (30 Dias)</h2>
        <div class="area-grafico"><canvas id="graficoVendas"></canvas></div>
    </div>

    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com';
        let dadosGlobais = []; let graficoInstance = null;

        function sair() { if(confirm("Deseja sair?")) { localStorage.removeItem('token_gerente'); window.location.href = 'login-adm.html'; } }
        function processarFoto(input) { if (input.files && input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('imagem').value = e.target.result; const i = document.getElementById('img-preview'); i.src = e.target.result; i.style.display='block'; document.getElementById('txt-foto').style.display='none'; }; r.readAsDataURL(input.files[0]); } }
        
        async function carregar() {
            const div = document.getElementById('lista');
            try {
                const res = await fetch(`${API}/produtos`); dadosGlobais = await res.json(); div.innerHTML = '';
                let v = 0, c = 0; const hoje = new Date();
                dadosGlobais.forEach(p => {
                    const pV = parseFloat(p.preco||0), pC = parseFloat(p.preco_entrada||0), q = parseInt(p.estoque||0);
                    v += (pV * q); c += (pC * q);
                    let validadeInfo = 'N/A';
                    if (p.validade) {
                        const d = new Date(p.validade);
                        validadeInfo = d < hoje ? `<span style="color:var(--erro)">⛔ VENCIDO</span>` : d.toLocaleDateString('pt-PT');
                    }
                    div.innerHTML += `<div class="produto-item"><img src="${p.imagem||''}" class="img-lista"><div style="flex:1"><b>${p.nome}</b><br><small>Estoque: ${q} | Val: ${validadeInfo}</small></div><button class="btn-pdf" onclick='prepararEdicao(${JSON.stringify(p)})'>Editar</button><button class="btn-pdf" style="background:var(--erro); border:none;" onclick="deletar('${p.id}')">X</button></div>`;
                });
                document.getElementById('dash-venda').innerText = `€ ${v.toFixed(2)}`; 
                document.getElementById('dash-custo').innerText = `€ ${c.toFixed(2)}`; 
                document.getElementById('dash-lucro-est').innerText = `€ ${(v-c).toFixed(2)}`;
                carregarVendas();
            } catch(e) { div.innerHTML = "Erro ao carregar."; }
        }

        async function carregarVendas() {
            try {
                const res = await fetch(`${API}/vendas?periodo=mensal`); const vendas = await res.json();
                const div = document.getElementById('lista-vendas'); div.innerHTML = vendas.length ? '' : 'Nenhuma venda.';
                vendas.slice(0, 5).forEach(v => {
                    const totalFrete = v.total_frete ? parseFloat(v.total_frete).toFixed(2) : '0.00';
                    div.innerHTML += `<div class="venda-item"><div><b style="color:var(--gold)">${v.cliente_nome}</b><br><small style="color:#94a3b8">Frete: €${totalFrete}</small></div><div style="text-align:right"><span style="color:var(--verde)">+ €${parseFloat(v.total_venda).toFixed(2)}</span><br><small>${new Date(v.data_venda).toLocaleDateString('pt-PT')}</small></div></div>`;
                });
                const hoje = new Date(); const seteDiasAtras = new Date(); seteDiasAtras.setDate(hoje.getDate() - 7);
                let totalVendasSemana = 0; let lucroRealSemana = 0;
                vendas.forEach(v => {
                    const dataVenda = new Date(v.data_venda);
                    if(dataVenda >= seteDiasAtras) { totalVendasSemana += parseFloat(v.total_venda || 0); lucroRealSemana += parseFloat(v.lucro || 0); }
                });
                document.getElementById('dash-venda-semana').innerText = `€ ${totalVendasSemana.toFixed(2)}`;
                document.getElementById('dash-lucro-semana').innerText = `€ ${lucroRealSemana.toFixed(2)}`;
                renderizarGrafico(vendas);
            } catch(e){}
        }

        function renderizarGrafico(vendas) {
            const ctx = document.getElementById('graficoVendas').getContext('2d');
            const dadosPorDia = {};
            vendas.forEach(v => {
                const dia = new Date(v.data_venda).toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' });
                dadosPorDia[dia] = (dadosPorDia[dia] || 0) + parseFloat(v.total_venda);
            });
            const labels = Object.keys(dadosPorDia).reverse(); const valores = Object.values(dadosPorDia).reverse();
            if(graficoInstance) graficoInstance.destroy();
            graficoInstance = new Chart(ctx, { type: 'bar', data: { labels: labels, datasets: [{ label: 'Vendas (€)', data: valores, backgroundColor: '#cca43b', borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8' }, grid: { display: false } } } } });
        }

        async function salvar() {
            const id = document.getElementById('edit-id').value; const btn = document.getElementById('btnSalvar'); btn.innerText = "..."; btn.disabled = true;
            const p = { nome: document.getElementById('nome').value, preco: parseFloat(document.getElementById('preco').value)||0, preco_entrada: parseFloat(document.getElementById('preco_entrada').value)||0, estoque: parseInt(document.getElementById('estoque').value)||0, validade: document.getElementById('validade').value||null, imagem: document.getElementById('imagem').value };
            await fetch(id ? `${API}/produtos/${id}` : `${API}/produtos`, { method: id?'PUT':'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) });
            resetForm(); carregar(); btn.innerText = "Gravar Produto"; btn.disabled = false;
        }
        function prepararEdicao(p) { document.getElementById('edit-id').value=p.id; document.getElementById('nome').value=p.nome; document.getElementById('preco').value=p.preco; document.getElementById('preco_entrada').value=p.preco_entrada||''; document.getElementById('estoque').value=p.estoque; document.getElementById('validade').value=p.validade||''; document.getElementById('imagem').value=p.imagem||''; const i=document.getElementById('img-preview'); i.src=p.imagem||''; i.style.display=p.imagem?'block':'none'; document.getElementById('txt-foto').style.display=p.imagem?'none':'block'; window.scrollTo({top:0, behavior:'smooth'}); }
        async function deletar(id) { if(confirm("Apagar?")) { await fetch(`${API}/produtos/${id}`, {method:'DELETE'}); carregar(); } }
        function resetForm() { document.getElementById('edit-id').value=''; ['nome','preco','preco_entrada','estoque','validade','imagem','input-file'].forEach(i=>document.getElementById(i).value=''); document.getElementById('img-preview').style.display='none'; document.getElementById('txt-foto').style.display='block'; }
        
        // ETIQUETAS (GOLD EDITION)
        async function gerarEtiquetasDoDia() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: [100, 150] });
            try {
                const res = await fetch(`${API}/vendas`); const vendas = await res.json();
                const hoje = new Date().toLocaleDateString('pt-PT');
                const vendasHoje = vendas.filter(v => new Date(v.data_venda).toLocaleDateString('pt-PT') === hoje);
                if (vendasHoje.length === 0) { alert("Sem vendas hoje."); return; }

                vendasHoje.forEach((venda, index) => {
                    if (index > 0) doc.addPage([100, 150]);
                    doc.setFontSize(8); doc.text("REMETENTE: LUST STORE", 10, 10);
                    doc.setFontSize(10); doc.setFont("helvetica", "bold"); doc.text("DESTINATÁRIO:", 10, 20);
                    doc.setFontSize(14); doc.text(venda.cliente_nome.toUpperCase().substring(0, 25), 10, 27);
                    doc.setFontSize(11); doc.setFont("helvetica", "normal");
                    const moradaSplit = doc.splitTextToSize(venda.cliente_morada, 85); doc.text(moradaSplit, 10, 35);
                    doc.line(5, 70, 95, 70);
                    doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("CONTEÚDO:", 10, 78);
                    doc.setFont("helvetica", "normal");
                    
                    const itensAgrupados = {};
                    if(venda.itens) venda.itens.forEach(i => itensAgrupados[i.nome] = (itensAgrupados[i.nome] || 0) + 1);
                    let yPos = 85;
                    Object.entries(itensAgrupados).forEach(([nome, qtd]) => { doc.text(`[ ] ${qtd}x ${nome}`, 10, yPos); yPos += 6; });
                    doc.setFontSize(8); doc.text(`Lust Store | ID: ${venda.id} | ${hoje}`, 10, 140);
                });
                doc.save(`Etiquetas_LustStore_${hoje.replace(/\//g, '-')}.pdf`);
            } catch(e) { alert("Erro Etiquetas"); }
        }

        // RELATÓRIOS (GOLD EDITION)
        async function gerarRelatorioVendas(per) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            try {
                const res = await fetch(`${API}/vendas?periodo=${per}`); const dados = await res.json();
                
                let tReceita = 0, tLucro = 0, tFrete = 0;
                dados.forEach(v => {
                    tReceita += parseFloat(v.total_venda || 0);
                    tLucro += parseFloat(v.lucro || 0);
                    tFrete += parseFloat(v.total_frete || 0);
                });

                // Cabeçalho GOLD [204, 164, 59] (#cca43b)
                doc.setFontSize(18); doc.setTextColor(204, 164, 59); doc.text(`LUST STORE - Relatório ${per.toUpperCase()}`, 14, 20);
                doc.setFontSize(10); doc.setTextColor(0,0,0);
                doc.text(`RECEITA: €${tReceita.toFixed(2)}  |  FRETE: €${tFrete.toFixed(2)}  |  LUCRO: €${tLucro.toFixed(2)}`, 14, 28);

                const corpo = dados.map(v => {
                    const grp = {}; if(v.itens) v.itens.forEach(i => grp[i.nome] = (grp[i.nome] || 0) + 1);
                    const lista = Object.entries(grp).map(([n, q]) => `${q}x ${n}`).join(", ");
                    const freteItem = v.total_frete ? `€${parseFloat(v.total_frete).toFixed(2)}` : '€0.00';
                    return [new Date(v.data_venda).toLocaleDateString('pt-PT'), v.cliente_nome, lista, freteItem, `€${parseFloat(v.total_venda).toFixed(2)}`, `€${parseFloat(v.lucro).toFixed(2)}`];
                });

                doc.autoTable({
                    startY: 35, head: [['Data', 'Cliente', 'Itens', 'Frete', 'Total Pago', 'Lucro']], body: corpo,
                    foot: [['', '', 'TOTAIS:', `€${tFrete.toFixed(2)}`, `€${tReceita.toFixed(2)}`, `€${tLucro.toFixed(2)}`]],
                    headStyles:{fillColor:[204, 164, 59]}, footStyles:{fillColor:[240,240,240], textColor:[0,0,0], fontStyle:'bold'}, theme:'grid'
                });
                doc.save(`Relatorio_LustStore_${per}.pdf`);
            } catch(e){ console.error(e); alert("Erro PDF"); }
        }
        
        async function gerarPDF() { const { jsPDF } = window.jspdf; const doc = new jsPDF(); doc.text("Inventário Lust Store", 14, 20); const b = dadosGlobais.map(p=>[p.nome, p.estoque, `€${p.preco.toFixed(2)}`, p.validade ? new Date(p.validade).toLocaleDateString():'N/A']); doc.autoTable({startY:30, head:[['Produto','Estoque','Preço','Validade']], body:b}); doc.save("Inventario.pdf"); }
        window.onload = carregar;
    </script>
</body>
</html>
