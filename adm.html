<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo | Beleza & Cia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --rosa: #d63384; --rosa-claro: #fda4af; --texto: #f8fafc; --borda: #334155; --label: #cbd5e1; --verde: #22c55e; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark); color: var(--texto); padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: 0 auto; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card-dash { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--borda); text-align: center; }
        .card-dash h3 { margin: 0; font-size: 12px; color: var(--label); text-transform: uppercase; }
        .card-dash p { margin: 5px 0 0 0; font-size: 18px; font-weight: bold; color: var(--rosa-claro); }

        /* Área de Cadastro Compacta */
        .card-cadastro { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--borda); margin-bottom: 25px; display: flex; gap: 20px; align-items: stretch; }
        
        .area-foto { width: 220px; min-height: 220px; background: rgba(214, 51, 132, 0.05); border: 2px dashed var(--rosa); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: 0.3s; }
        .area-foto:hover { background: rgba(214, 51, 132, 0.1); }
        .area-foto img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .area-foto span { font-size: 13px; color: var(--rosa-claro); text-align: center; padding: 10px; z-index: 1; font-weight: bold; }

        .campos-texto { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .grid-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { font-size: 13px; color: var(--label); font-weight: 500; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--borda); color: white; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        input:focus { border-color: var(--rosa); outline: none; }
        
        .btn-principal { background: var(--rosa); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: auto; transition: 0.3s; font-size: 14px; text-transform: uppercase; }
        .btn-principal:hover { filter: brightness(1.2); }

        /* Lista de Produtos */
        .produto-item { background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.05); gap: 15px; }
        .img-lista { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #0f172a; }
        .info-principal { flex: 1; }
        .nome-produto { font-size: 16px; color: var(--rosa-claro); font-weight: bold; }
        .btn-acao { padding: 6px 12px; border-radius: 6px; border: none; color: white; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center; font-size: 24px;">💎 Painel <span style="color:var(--rosa)">Administrativo</span></h1>
        
        <div class="dashboard">
            <div class="card-dash"><h3>PVP Total</h3><p id="dash-venda">€ 0.00</p></div>
            <div class="card-dash"><h3>Custo Total</h3><p id="dash-custo">€ 0.00</p></div>
            <div class="card-dash"><h3>Lucro</h3><p id="dash-lucro" style="color:var(--verde)">€ 0.00</p></div>
        </div>

        <div class="card-cadastro">
            <div class="area-foto" onclick="pedirURL()">
                <img id="img-preview" src="" style="display:none">
                <span id="txt-foto">📷<br>ÁREA DA FOTO<br><small>Clicar para carregar</small></span>
                <input type="hidden" id="imagem">
            </div>

            <div class="campos-texto">
                <input type="hidden" id="edit-id">
                
                <div>
                    <label>NOME DO PRODUTO</label>
                    <input type="text" id="nome" placeholder="Ex: Batom Matte">
                </div>

                <div class="grid-duplo">
                    <div>
                        <label>CUSTO (€)</label>
                        <input type="number" id="preco_entrada" step="0.01" placeholder="0.00">
                    </div>
                    <div>
                        <label>VENDA (€)</label>
                        <input type="number" id="preco" step="0.01" placeholder="0.00">
                    </div>
                </div>

                <div class="grid-duplo">
                    <div>
                        <label>ESTOQUE</label>
                        <input type="number" id="estoque" placeholder="0">
                    </div>
                    <div>
                        <label>VALIDADE</label>
                        <input type="date" id="validade">
                    </div>
                </div>

                <button class="btn-principal" id="btnSalvar" onclick="salvar()">Gravar no Inventário</button>
            </div>
        </div>

        <div id="lista">A carregar...</div>
    </div>

    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com/produtos';

        function pedirURL() {
            const url = prompt("Cole aqui o link (URL) da imagem do produto:");
            if (url !== null) {
                document.getElementById('imagem').value = url;
                atualizarPreview(url);
            }
        }

        function atualizarPreview(url) {
            const img = document.getElementById('img-preview');
            const txt = document.getElementById('txt-foto');
            if (url) {
                img.src = url;
                img.style.display = 'block';
                txt.style.opacity = '0';
            } else {
                img.style.display = 'none';
                txt.style.opacity = '1';
            }
        }

        async function carregar() {
            const div = document.getElementById('lista');
            try {
                const res = await fetch(API);
                const dados = await res.json();
                div.innerHTML = '';
                let v = 0, c = 0;

                dados.forEach(p => {
                    const pV = parseFloat(p.preco || 0), pC = parseFloat(p.preco_entrada || 0), q = parseInt(p.estoque || 0);
                    v += (pV * q); c += (pC * q);
                    const dVal = p.validade ? new Date(p.validade).toLocaleDateString('pt-PT') : 'N/A';

                    div.innerHTML += `
                        <div class="produto-item">
                            <img src="${p.imagem || ''}" class="img-lista" onerror="this.src='https://via.placeholder.com/60?text=S/F'">
                            <div class="info-principal">
                                <span class="nome-produto">${p.nome}</span><br>
                                <span style="color:var(--rosa)">€ ${pV.toFixed(2)}</span> 
                                <small style="color:#64748b; margin-left:8px">Custo: € ${pC.toFixed(2)}</small><br>
                                <small>Estoque: <b>${q}</b> | Val: ${dVal}</small>
                            </div>
                            <button class="btn-acao" style="background:#3b82f6" onclick='prepararEdicao(${JSON.stringify(p)})'>Editar</button>
                            <button class="btn-acao" style="background:#ef4444" onclick="deletar('${p.id}')">Apagar</button>
                        </div>`;
                });

                document.getElementById('dash-venda').innerText = `€ ${v.toFixed(2)}`;
                document.getElementById('dash-custo').innerText = `€ ${c.toFixed(2)}`;
                document.getElementById('dash-lucro').innerText = `€ ${(v - c).toFixed(2)}`;
            } catch (e) { div.innerHTML = "Erro ao carregar."; }
        }

        async function salvar() {
            const id = document.getElementById('edit-id').value;
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "A GUARDAR..."; btn.disabled = true;

            const produto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value) || 0,
                preco_entrada: parseFloat(document.getElementById('preco_entrada').value) || 0,
                estoque: parseInt(document.getElementById('estoque').value) || 0,
                validade: document.getElementById('validade').value || null,
                imagem: document.getElementById('imagem').value
            };

            try {
                await fetch(id ? `${API}/${id}` : API, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto)
                });
                resetForm();
                carregar();
            } catch (e) { alert("Erro ao guardar!"); }
            btn.innerText = "Gravar no Inventário"; btn.disabled = false;
        }

        function prepararEdicao(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('preco_entrada').value = p.preco_entrada || '';
            document.getElementById('estoque').value = p.estoque;
            document.getElementById('validade').value = p.validade || '';
            document.getElementById('imagem').value = p.imagem || '';
            atualizarPreview(p.imagem);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            ['nome', 'preco', 'preco_entrada', 'estoque', 'validade', 'imagem'].forEach(id => document.getElementById(id).value = '');
            atualizarPreview('');
        }

        async function deletar(id) {
            if (confirm("Apagar produto?")) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                carregar();
            }
        }

        window.onload = carregar;
    </script>
</body>
</html>
