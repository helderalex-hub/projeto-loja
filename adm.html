<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo | Beleza & Cia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        if (localStorage.getItem('token_gerente') !== 'logado_sucesso_servidor') {
            window.location.href = 'login-adm.html';
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { 
            --dark: #0f172a; 
            --card: #1e293b; 
            --rosa: #d63384; 
            --rosa-claro: #fda4af; /* Cor solicitada */
            --texto: #f8fafc; 
            --borda: #334155; 
            --label: #cbd5e1; 
            --verde: #22c55e; 
            --erro: #ef4444; 
            --alerta: #f59e0b; 
        }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark); color: var(--texto); padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Cabeçalho */
        .header-top { text-align: center; margin-bottom: 25px; position: relative; }
        h1 { margin: 0; font-size: 24px; color: var(--rosa-claro); text-transform: uppercase; letter-spacing: 1px; }
        .btn-sair { position: absolute; top: 0; right: 0; background: transparent; border: 1px solid var(--borda); color: #cbd5e1; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .btn-sair:hover { background: var(--erro); border-color: var(--erro); color: white; }

        /* Dashboard Financeiro */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card-dash { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--borda); text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-dash h3 { margin: 0; font-size: 12px; color: var(--label); text-transform: uppercase; }
        .card-dash p { margin: 8px 0 0 0; font-size: 20px; font-weight: bold; color: var(--rosa-claro); }

        /* Área de Relatórios */
        .area-relatorios { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 25px; display: flex; gap: 10px; align-items: center; justify-content: flex-start; flex-wrap: wrap; }
        .titulo-seccao { width: 100%; font-size: 13px; color: var(--rosa-claro); font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .btn-pdf { background: #475569; color: white; border: 1px solid var(--borda); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-pdf:hover { background: var(--rosa); border-color: var(--rosa); }

        /* Formulário de Cadastro */
        .card-cadastro { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--borda); margin-bottom: 25px; display: flex; gap: 20px; align-items: stretch; flex-wrap: wrap; }
        
        /* FOTO: Layout Moderno (Contain + Fundo Preto) */
        .area-foto { 
            width: 180px; height: 180px; 
            background: #000; /* Fundo preto para destaque */
            border: 2px dashed var(--rosa); border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            cursor: pointer; overflow: hidden; position: relative; flex-shrink: 0; 
        }
        .area-foto img { width: 100%; height: 100%; object-fit: contain; position: absolute; top:0; left:0; }
        .area-foto span { font-size: 12px; color: var(--rosa-claro); text-align: center; padding: 10px; z-index: 1; font-weight: bold; }

        .campos-texto { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 250px; }
        .grid-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        label { font-size: 12px; color: var(--label); font-weight: 600; margin-bottom: 4px; display: block; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--borda); color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: var(--rosa); outline: none; }
        
        .btn-principal { background: var(--rosa); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: auto; transition: 0.3s; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-principal:hover { filter: brightness(1.1); }

        /* Lista de Produtos (Inventário) */
        .produto-item { background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.05); gap: 15px; transition: 0.2s; }
        .produto-item:hover { border-color: var(--borda); }
        .img-lista { width: 60px; height: 60px; border-radius: 8px; object-fit: contain; background: #000; border: 1px solid #333; }
        
        .info-principal { flex: 1; }
        .nome-produto { font-size: 16px; color: var(--rosa-claro); font-weight: bold; display: block; margin-bottom: 4px; }
        
        /* Avisos */
        .alerta-estoque { color: var(--erro); font-weight: bold; font-size: 12px; margin-left: 5px; background: rgba(239, 68, 68, 0.1); padding: 2px 6px; border-radius: 4px; }
        
        /* Botões de Ação */
        .btn-acao { padding: 8px 14px; border-radius: 6px; border: none; color: white; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 5px; transition: 0.3s; }
        .btn-editar { background: #3b82f6; }
        .btn-apagar { background: var(--erro); }
        .btn-acao:hover { filter: brightness(1.2); }

        /* Lista de Vendas (Encomendas) */
        .seccao-encomendas { margin-bottom: 30px; }
        .lista-box { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid var(--borda); max-height: 250px; overflow-y: auto; }
        .venda-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }

        @media (max-width: 650px) {
            .card-cadastro { flex-direction: column; }
            .area-foto { width: 100%; height: 200px; }
            .header-top h1 { font-size: 20px; }
            .btn-sair { position: relative; display: block; width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>💎 Painel <span style="color:white">Administrativo</span></h1>
            <button class="btn-sair" onclick="sair()">🔒 SAIR (LOGOUT)</button>
        </div>
        
        <div class="dashboard">
            <div class="card-dash"><h3>Venda Bruta</h3><p id="dash-venda">€ 0.00</p></div>
            <div class="card-dash"><h3>Custo Estoque</h3><p id="dash-custo">€ 0.00</p></div>
            <div class="card-dash"><h3>Lucro Real</h3><p id="dash-lucro" style="color:var(--verde)">€ 0.00</p></div>
        </div>

        <div class="area-relatorios">
            <div class="titulo-seccao">📑 Relatórios & Logística:</div>
            <button class="btn-pdf" onclick="gerarRelatorioVendas('diario')" style="background:var(--rosa); border:none;">🚚 Guia de Envio (Hoje)</button>
            <button class="btn-pdf" onclick="gerarRelatorioVendas('semanal')">📈 Semanal</button>
            <button class="btn-pdf" onclick="gerarRelatorioVendas('mensal')">💰 Mensal</button>
            <button class="btn-pdf" onclick="gerarPDF('inventario')" style="background:#1e293b">📦 Inventário Completo</button>
        </div>

        <div class="card-cadastro">
            <div class="area-foto" onclick="document.getElementById('input-file').click()">
                <img id="img-preview" src="" style="display:none">
                <span id="txt-foto">📷<br>CLIQUE PARA<br>ADICIONAR FOTO</span>
                <input type="file" id="input-file" accept="image/*" style="display:none" onchange="processarFoto(this)">
                <input type="hidden" id="imagem">
            </div>

            <div class="campos-texto">
                <input type="hidden" id="edit-id">
                
                <div>
                    <label>NOME DO PRODUTO</label>
                    <input type="text" id="nome" placeholder="Ex: Batom Matte">
                </div>

                <div class="grid-duplo">
                    <div>
                        <label>CUSTO UNIT. (€)</label>
                        <input type="number" id="preco_entrada" step="0.01" placeholder="0.00">
                    </div>
                    <div>
                        <label>VENDA UNIT. (€)</label>
                        <input type="number" id="preco" step="0.01" placeholder="0.00">
                    </div>
                </div>

                <div class="grid-duplo">
                    <div>
                        <label>ESTOQUE (QTD)</label>
                        <input type="number" id="estoque" placeholder="0">
                    </div>
                    <div>
                        <label>VALIDADE</label>
                        <input type="date" id="validade">
                    </div>
                </div>

                <button class="btn-principal" id="btnSalvar" onclick="salvar()">Gravar no Inventário</button>
            </div>
        </div>

        <div class="seccao-encomendas">
            <h2 class="titulo-seccao" style="font-size:16px;">📦 Últimas Encomendas</h2>
            <div id="lista-vendas" class="lista-box">
                A carregar vendas...
            </div>
        </div>

        <h2 class="titulo-seccao" style="font-size:16px; margin-top:30px;">📋 Gestão de Estoque</h2>
        <div id="lista">A carregar inventário...</div>
    </div>

    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com'; // Confirme se a URL base está correta (sem /produtos)
        let dadosGlobais = []; 

        function sair() {
            if(confirm("Deseja sair do Painel?")) {
                localStorage.removeItem('token_gerente');
                window.location.href = 'login-adm.html';
            }
        }

        // --- IMAGENS ---
        function processarFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    document.getElementById('imagem').value = base64;
                    atualizarPreview(base64);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function atualizarPreview(url) {
            const img = document.getElementById('img-preview');
            const txt = document.getElementById('txt-foto');
            if (url) {
                img.src = url; img.style.display = 'block'; txt.style.opacity = '0';
            } else {
                img.style.display = 'none'; txt.style.opacity = '1';
            }
        }

        // --- CARREGAR DADOS ---
        async function carregar() {
            const div = document.getElementById('lista');
            try {
                // Carrega Produtos
                const res = await fetch(`${API}/produtos`);
                dadosGlobais = await res.json(); 
                div.innerHTML = '';
                let v = 0, c = 0;
                const hoje = new Date();

                dadosGlobais.forEach(p => {
                    const pV = parseFloat(p.preco || 0), pC = parseFloat(p.preco_entrada || 0), q = parseInt(p.estoque || 0);
                    v += (pV * q); c += (pC * q);
                    
                    // Validade
                    let dVal = 'N/A';
                    let estiloValidade = 'color:var(--label)';
                    let avisoValidade = '';

                    if (p.validade) {
                        const dataVal = new Date(p.validade);
                        dVal = dataVal.toLocaleDateString('pt-PT');
                        // Diferença em meses aprox
                        const diffMeses = (dataVal - hoje) / (1000 * 60 * 60 * 24 * 30);
                        
                        if (dataVal < hoje) {
                            estiloValidade = 'color:var(--erro); font-weight:bold';
                            avisoValidade = '⛔ VENCIDO';
                        } else if (diffMeses <= 6) { 
                            estiloValidade = 'color:var(--alerta); font-weight:bold';
                            avisoValidade = '⏳ Vence Breve';
                        }
                    }

                    // Estoque Crítico (< 5 unidades)
                    const isCritico = q < 5;
                    const estiloEstoque = isCritico ? 'color: var(--erro); font-weight: bold;' : '';
                    const msgCritico = isCritico ? '<span class="alerta-estoque">⚠️ BAIXO!</span>' : '';

                    div.innerHTML += `
                        <div class="produto-item">
                            <img src="${p.imagem || ''}" class="img-lista" onerror="this.src='https://via.placeholder.com/60?text=Foto'">
                            <div class="info-principal">
                                <span class="nome-produto">${p.nome}</span>
                                <span style="color:white">€ ${pV.toFixed(2)}</span> 
                                <small style="color:#64748b; margin-left:8px">Custo: € ${pC.toFixed(2)}</small><br>
                                <small>Estoque: <b style="${estiloEstoque}">${q}</b>${msgCritico}</small> | 
                                <small style="${estiloValidade}">Val: ${dVal} ${avisoValidade}</small>
                            </div>
                            <button class="btn-acao btn-editar" onclick='prepararEdicao(${JSON.stringify(p)})'>Editar</button>
                            <button class="btn-acao btn-apagar" onclick="deletar('${p.id}')">Apagar</button>
                        </div>`;
                });

                document.getElementById('dash-venda').innerText = `€ ${v.toFixed(2)}`;
                document.getElementById('dash-custo').innerText = `€ ${c.toFixed(2)}`;
                document.getElementById('dash-lucro').innerText = `€ ${(v - c).toFixed(2)}`;
                
                // Carrega Vendas Recentes
                carregarVendas();

            } catch (e) { 
                console.error(e);
                div.innerHTML = "Erro ao carregar lista (Verifique a API)."; 
            }
        }

        async function carregarVendas() {
            try {
                const res = await fetch(`${API}/vendas`);
                const vendas = await res.json();
                const div = document.getElementById('lista-vendas');
                div.innerHTML = vendas.length ? '' : 'Nenhuma venda registada.';
                
                vendas.slice(0, 10).forEach(v => {
                    div.innerHTML += `
                        <div class="venda-item">
                            <div>
                                <b style="color:var(--rosa-claro)">${v.cliente_nome}</b><br>
                                <small style="color:#94a3b8">📍 ${v.cliente_morada}</small>
                            </div>
                            <div style="text-align:right">
                                <span style="color:var(--verde); font-weight:bold;">+ €${parseFloat(v.total_venda).toFixed(2)}</span><br>
                                <small style="color:#64748b">${new Date(v.data_venda).toLocaleDateString('pt-PT')}</small>
                            </div>
                        </div>`;
                });
            } catch(e) { console.log("Erro vendas", e); }
        }

        // --- SALVAR / EDITAR / DELETAR ---
        async function salvar() {
            const id = document.getElementById('edit-id').value;
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "A GUARDAR..."; btn.disabled = true;

            const produto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value) || 0,
                preco_entrada: parseFloat(document.getElementById('preco_entrada').value) || 0,
                estoque: parseInt(document.getElementById('estoque').value) || 0,
                validade: document.getElementById('validade').value || null,
                imagem: document.getElementById('imagem').value
            };

            try {
                const url = id ? `${API}/produtos/${id}` : `${API}/produtos`;
                const method = id ? 'PUT' : 'POST';
                
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto)
                });
                resetForm();
                carregar();
            } catch (e) { alert("Erro ao guardar!"); }
            btn.innerText = "Gravar no Inventário"; btn.disabled = false;
        }

        function prepararEdicao(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('preco_entrada').value = p.preco_entrada || '';
            document.getElementById('estoque').value = p.estoque;
            document.getElementById('validade').value = p.validade || '';
            document.getElementById('imagem').value = p.imagem || '';
            atualizarPreview(p.imagem);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletar(id) {
            if (confirm("ATENÇÃO: Deseja apagar este produto permanentemente?")) {
                await fetch(`${API}/produtos/${id}`, { method: 'DELETE' });
                carregar();
            }
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            ['nome', 'preco', 'preco_entrada', 'estoque', 'validade', 'imagem', 'input-file'].forEach(id => {
                const el = document.getElementById(id); if(el) el.value = '';
            });
            atualizarPreview('');
        }

        // --- RELATÓRIOS PDF ---
        async function gerarRelatorioVendas(periodo) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            try {
                const res = await fetch(`${API}/vendas?periodo=${periodo}`);
                const dados = await res.json();

                doc.setFontSize(18);
                doc.setTextColor(253, 164, 175); // Rosa Claro (RGB do #fda4af)
                const titulo = periodo === 'diario' ? "Guia de Envios (Hoje)" : `Relatório Financeiro (${periodo})`;
                doc.text(titulo, 14, 20);

                let colunas, linhas;

                if (periodo === 'diario') {
                    colunas = ["Cliente", "Morada", "Itens"];
                    linhas = dados.map(v => [
                        v.cliente_nome,
                        v.cliente_morada,
                        v.itens.map(i => i.nome).join(", ")
                    ]);
                } else {
                    colunas = ["Data", "Cliente", "Total", "Lucro"];
                    linhas = dados.map(v => [
                        new Date(v.data_venda).toLocaleDateString('pt-PT'),
                        v.cliente_nome,
                        `€ ${parseFloat(v.total_venda).toFixed(2)}`,
                        `€ ${parseFloat(v.lucro).toFixed(2)}`
                    ]);
                }

                doc.autoTable({
                    startY: 30,
                    head: [colunas],
                    body: linhas,
                    headStyles: { fillColor: [214, 51, 132] }, // Rosa mais forte para cabeçalho
                    theme: 'grid'
                });

                doc.save(`Relatorio_${periodo}.pdf`);
            } catch (e) { alert("Erro ao gerar PDF."); }
        }

        async function gerarPDF(tipo) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Inventário de Estoque", 14, 20);
            
            const linhas = dadosGlobais.map(p => [
                p.nome, 
                p.estoque, 
                `€${p.preco.toFixed(2)}`, 
                p.validade ? new Date(p.validade).toLocaleDateString() : 'N/A'
            ]);

            doc.autoTable({
                startY: 30,
                head: [['Produto', 'Estoque', 'Preço', 'Validade']],
                body: linhas
            });
            doc.save("Inventario.pdf");
        }

        window.onload = carregar;
    </script>
</body>
</html>
