<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Admin | Lust Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (localStorage.getItem('token_gerente') !== 'logado_sucesso_servidor') window.location.href = 'login-adm.html';</script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --dark: #0f172a; --card: #1e293b; --gold: #cca43b; --texto: #f8fafc; --borda: #334155; 
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: var(--texto); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        
        .header-top { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--borda); padding-bottom: 20px; position: relative; }
        .logo-adm { height: 60px; display: block; margin: 0 auto 10px; }
        h1 { margin: 0; font-family: 'Playfair Display', serif; color: white; text-transform: uppercase; font-weight: 400; font-size: 22px; }
        h1 span { color: var(--gold); }
        .btn-sair { position: absolute; top: 0; right: 0; background: transparent; border: 1px solid var(--borda); color: #94a3b8; padding: 5px 15px; border-radius: 4px; cursor: pointer; }

        /* 5 DASHBOARDS */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-dash { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--borda); text-align: center; border-bottom: 3px solid var(--gold); }
        .card-dash h3 { margin: 0; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .card-dash p { margin: 10px 0 0; font-size: 18px; font-weight: bold; color: white; }

        /* BOTOES RELATORIOS */
        .area-relatorios { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid var(--borda); }
        .btn-acao { background: #334155; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 11px; text-transform: uppercase; margin-right: 5px; font-weight: bold; margin-bottom: 5px; }
        .btn-acao:hover { background: var(--gold); color: var(--dark); }
        .btn-verde { background: #059669; }

        .grafico-box { background: var(--card); padding: 20px; border-radius: 8px; height: 300px; margin-bottom: 30px; border: 1px solid var(--borda); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { text-align: left; padding: 10px; color: var(--gold); border-bottom: 1px solid var(--borda); text-transform: uppercase; font-size: 11px; }
        td { padding: 10px; border-bottom: 1px solid #334155; }
        
        .btn-icon { border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-right: 3px; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header-top">
            <img src="logo.png" alt="Logo" class="logo-adm" onerror="this.style.display='none'">
            <h1>Lust Store - <span>Painel Administrativo</span></h1>
            <button class="btn-sair" onclick="sair()">Sair 🔒</button>
        </div>
        
        <div class="dashboard">
            <div class="card-dash"><h3>Custo Estoque Total</h3><p id="dash-custo">...</p></div>
            <div class="card-dash"><h3>Valor Venda Total</h3><p id="dash-valor">...</p></div>
            <div class="card-dash"><h3>Lucro Est. Total</h3><p id="dash-lucro-est">...</p></div>
            <div class="card-dash"><h3>Vendas do Mês</h3><p id="dash-vendas-mes" style="color:#cca43b">...</p></div>
            <div class="card-dash"><h3>Lucro do Mês</h3><p id="dash-lucro-mes" style="color:#10b981">...</p></div>
        </div>

        <div class="area-relatorios">
            <h4 style="color:var(--gold); margin-top:0">Logística & Financeiro</h4>
            <button onclick="gerarRelatorioFinanceiro('semanal')" class="btn-acao">📅 Financeiro Semana</button>
            <button onclick="gerarRelatorioFinanceiro('mensal')" class="btn-acao">📅 Financeiro Mês</button>
            <button onclick="gerarEtiquetasDia()" class="btn-acao btn-verde">📦 Etiquetas de Hoje (Todas)</button>
        </div>

        <div class="grafico-box">
            <canvas id="graficoVendas"></canvas>
        </div>

        <h3 style="color:var(--gold); font-size:14px; text-transform:uppercase">Últimas Vendas</h3>
        <div style="overflow-x:auto">
            <table>
                <thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Total</th><th>Ações</th></tr></thead>
                <tbody id="lista-vendas"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://projeto-loja-dzqv.onrender.com";
        let vendasCache = [], produtosCache = [];

        async function iniciar() {
            try {
                const [resV, resP] = await Promise.all([fetch(`${API_URL}/vendas`), fetch(`${API_URL}/produtos`)]);
                vendasCache = await resV.json(); produtosCache = await resP.json();
                
                calcularDashboards();
                renderizarGrafico();
                renderizarTabela();
            } catch (e) { console.error(e); }
        }

        function calcularDashboards() {
            // Estoque
            let custoTotal = 0, valorTotal = 0;
            produtosCache.forEach(p => {
                custoTotal += (p.preco_entrada || 0) * p.estoque;
                valorTotal += p.preco * p.estoque;
            });

            // Financeiro Mês
            const hoje = new Date();
            let vendasMes = 0, lucroMes = 0;
            vendasCache.forEach(v => {
                const d = new Date(v.data_venda);
                if(d.getMonth() === hoje.getMonth() && d.getFullYear() === hoje.getFullYear()) {
                    vendasMes += v.total_venda;
                    lucroMes += v.lucro;
                }
            });

            document.getElementById('dash-custo').innerText = `€${custoTotal.toFixed(2)}`;
            document.getElementById('dash-valor').innerText = `€${valorTotal.toFixed(2)}`;
            document.getElementById('dash-lucro-est').innerText = `€${(valorTotal - custoTotal).toFixed(2)}`;
            document.getElementById('dash-vendas-mes').innerText = `€${vendasMes.toFixed(2)}`;
            document.getElementById('dash-lucro-mes').innerText = `€${lucroMes.toFixed(2)}`;
        }

        function renderizarGrafico() {
            const ctx = document.getElementById('graficoVendas').getContext('2d');
            const hoje = new Date();
            const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
            const labels = Array.from({length: diasNoMes}, (_, i) => i + 1);
            const dados = new Array(diasNoMes).fill(0);

            vendasCache.forEach(v => {
                const d = new Date(v.data_venda);
                if(d.getMonth() === hoje.getMonth() && d.getFullYear() === hoje.getFullYear()) {
                    dados[d.getDate() - 1] += v.total_venda;
                }
            });

            new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Vendas Diárias (€)', data: dados, backgroundColor: '#cca43b' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#94a3b8' } }, y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } } } }
            });
        }

        function renderizarTabela() {
            const tb = document.getElementById('lista-vendas'); tb.innerHTML = '';
            vendasCache.forEach(v => {
                tb.innerHTML += `<tr>
                    <td>${new Date(v.data_venda).toLocaleDateString()}</td>
                    <td style="color:#cca43b; font-weight:bold">#${v.codigo_pedido}</td>
                    <td>${v.cliente_nome}</td>
                    <td>€${v.total_venda.toFixed(2)}</td>
                    <td>
                        <button onclick="reenviar('${v.id}')" class="btn-icon" style="background:#3b82f6; color:white" title="Email">📧</button>
                        <button onclick="gerarPDFPedido('${v.codigo_pedido}')" class="btn-icon" style="background:#cca43b; color:#0f172a" title="Recibo">📄</button>
                        <button onclick="gerarEtiqueta('${v.codigo_pedido}')" class="btn-icon" style="background:#10b981; color:white" title="Etiqueta">📦</button>
                    </td>
                </tr>`;
            });
        }

        async function reenviar(id) { if(confirm("Reenviar email?")) await fetch(`${API_URL}/reenviar-email/${id}`, {method:'POST'}); }

        // --- PDFS PODEROSOS ---
        function gerarRelatorioFinanceiro(tipo) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const hoje = new Date();
            let inicio = new Date();
            if(tipo === 'semanal') { const dia = inicio.getDay(); inicio.setDate(inicio.getDate() - dia + (dia == 0 ? -6 : 1)); } 
            else { inicio.setDate(1); }
            inicio.setHours(0,0,0,0);

            const filtradas = vendasCache.filter(v => new Date(v.data_venda) >= inicio);
            
            // Cabeçalho Marca
            doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 35, 'F');
            doc.setTextColor(204, 164, 59); doc.setFontSize(20); doc.text("LUST STORE", 14, 18);
            doc.setTextColor(255, 255, 255); doc.setFontSize(10); doc.text(`Relatório Financeiro: ${tipo.toUpperCase()}`, 14, 25);

            // Tabela Detalhada
            const body = filtradas.map(v => [
                new Date(v.data_venda).toLocaleDateString(),
                v.codigo_pedido,
                `€${(v.total_custo || 0).toFixed(2)}`,
                `€${v.total_frete.toFixed(2)}`,
                `€${v.total_venda.toFixed(2)}`,
                `€${v.lucro.toFixed(2)}`
            ]);

            doc.autoTable({
                startY: 40,
                head: [['Data', 'Pedido', 'Custo', 'Frete', 'Venda Total', 'Lucro Liq.']],
                body: body,
                headStyles: { fillColor: [15, 23, 42], textColor: [204, 164, 59] },
                columnStyles: { 5: { fontStyle: 'bold', textColor: [0, 100, 0] } } // Lucro Verde
            });
            doc.save(`Financeiro_${tipo}.pdf`);
        }

        function gerarPDFPedido(cod) {
            const venda = vendasCache.find(v => v.codigo_pedido === cod);
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(204, 164, 59); doc.setFontSize(22); doc.text("LUST STORE", 14, 20);
            
            doc.setTextColor(0,0,0); doc.setFontSize(12);
            doc.text(`Recibo: #${venda.codigo_pedido}`, 14, 45);
            
            const body = venda.itens.map(i => [i.nome, `€${i.preco}`]);
            body.push(['Frete', `€${venda.total_frete}`]);
            body.push(['TOTAL', `€${venda.total_venda.toFixed(2)}`]);
            
            doc.autoTable({ startY: 55, head:[['Item', 'Valor']], body: body });
            doc.save(`Recibo_${cod}.pdf`);
        }

        // --- ETIQUETAS + PACKING LIST ---
        function gerarEtiqueta(cod) { const v = vendasCache.find(x => x.codigo_pedido === cod); criarPDFEtiqueta([v]); }
        function gerarEtiquetasDia() {
            const hoje = new Date().toLocaleDateString();
            const lista = vendasCache.filter(v => new Date(v.data_venda).toLocaleDateString() === hoje);
            if(!lista.length) return alert("Sem vendas hoje.");
            criarPDFEtiqueta(lista);
        }

        function criarPDFEtiqueta(listaVendas) {
            const { jsPDF } = window.jspdf;
            // Formato 10x15cm (Padrão Zebra/CTT)
            const doc = new jsPDF({ format: [100, 150], unit: 'mm' });
            
            listaVendas.forEach((v, index) => {
                if(index > 0) doc.addPage();
                
                // PAGINA 1: ETIQUETA ENVIO
                doc.setLineWidth(1); doc.rect(2, 2, 96, 146); // Borda
                doc.setFontSize(8); doc.text("REMETENTE:", 5, 10);
                doc.setFontSize(12); doc.setFont("helvetica", "bold"); doc.text("LUST STORE", 5, 15);
                doc.setFontSize(8); doc.setFont("helvetica", "normal"); doc.text("Portugal", 5, 20);
                
                doc.line(2, 35, 98, 35); // Linha divisória

                doc.setFontSize(10); doc.text("DESTINATÁRIO:", 5, 45);
                doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.text(v.cliente_nome, 5, 53);
                
                doc.setFontSize(11); doc.setFont("helvetica", "normal");
                const morada = doc.splitTextToSize(v.cliente_morada, 90);
                doc.text(morada, 5, 62);

                // Codigo Barras Fake (Visual)
                doc.setFillColor(0,0,0); doc.rect(10, 110, 80, 15, 'F');
                doc.setTextColor(255,255,255); doc.text(v.codigo_pedido, 50, 120, {align:'center'});

                // PAGINA 2: PACKING LIST (RESUMO PARA CAIXA)
                doc.addPage();
                doc.setTextColor(0,0,0);
                doc.setFontSize(14); doc.text("RESUMO DO PEDIDO", 50, 15, {align:'center'});
                doc.setFontSize(10); doc.text(`Pedido: #${v.codigo_pedido}`, 5, 25);
                
                let y = 35;
                doc.setFontSize(9);
                doc.text("ITEM", 5, y); doc.text("QTD", 80, y);
                doc.line(5, y+2, 95, y+2);
                
                y += 8;
                // Agrupar itens
                const contagem = {}; v.itens.forEach(i => contagem[i.nome] = (contagem[i.nome]||0)+1);
                
                Object.entries(contagem).forEach(([nome, qtd]) => {
                    doc.text(nome.substring(0, 30), 5, y);
                    doc.text(String(qtd), 85, y);
                    y += 6;
                });
                
                doc.text("Obrigado pela preferência!", 50, 140, {align:'center'});
            });

            doc.save("Etiquetas_e_Resumo.pdf");
        }

        function sair() { localStorage.removeItem('token_gerente'); window.location.href = 'login-adm.html'; }
        iniciar();
    </script>
</body>
</html>
