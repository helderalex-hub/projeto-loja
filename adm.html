<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo | Beleza & Companhia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --rosa: #d63384; --texto: #f8fafc; --verde: #22c55e; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-dash { background: var(--card); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .card-form { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #334155; display: flex; gap: 20px; margin-bottom: 30px; }
        .foto-area { width: 100px; height: 100px; border-radius: 10px; border: 2px dashed #475569; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: #0f172a; }
        .foto-area img { width: 100%; height: 100%; object-fit: cover; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-salvar { background: var(--rosa); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .produto-card { background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; align-items: center; gap: 15px; }
        .img-lista { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 Painel ADM - Beleza & Cia</h1>
        
        <div class="dashboard">
            <div class="card-dash"><h3>Valor Venda</h3><p id="dash-venda">€ 0.00</p></div>
            <div class="card-dash"><h3>Custo Stock</h3><p id="dash-custo">€ 0.00</p></div>
            <div class="card-dash"><h3>Lucro Previsto</h3><p id="dash-lucro" style="color:var(--verde)">€ 0.00</p></div>
        </div>

        <div class="card-form">
            <div class="foto-area" onclick="document.getElementById('foto-input').click()">
                <img id="preview-foto" src="" style="display:none">
                <span id="label-foto">📷 FOTO</span>
            </div>
            <input type="file" id="foto-input" accept="image/*" style="display:none">
            
            <div style="flex:1">
                <input type="hidden" id="edit-id">
                <input type="text" id="nome" placeholder="Nome do Produto">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <input type="number" id="preco_entrada" placeholder="Custo €">
                    <input type="number" id="preco" placeholder="Venda €">
                    <input type="number" id="estoque" placeholder="Stock">
                    <input type="date" id="validade">
                </div>
                <button class="btn-salvar" id="btnSalvar">GRAVAR PRODUTO</button>
            </div>
        </div>

        <div id="lista">A carregar inventário...</div>
    </div>

    <script>
        const API = 'https://projeto-loja-beleza-cia.onrender.com/produtos';
        const S_URL = 'https://sgamfzcgiexoevnyiehn.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnYW1memNnaWV4b2V2bnlpZWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MzIwMDYsImV4cCI6MjA4NDUwODAwNn0.BLdnOWXEpW6w_Ic_0stcOexXXQBWl7Rc5ll0ATjvZVs';
        const sbClient = window.supabase.createClient(S_URL, S_KEY);

        async function carregarDados() {
            try {
                const res = await fetch(`${API}?t=${Date.now()}`);
                const produtos = await res.json();
                const div = document.getElementById('lista');
                div.innerHTML = '';
                let vT = 0, cT = 0;

                produtos.forEach(p => {
                    vT += (p.preco * p.estoque); cT += (p.preco_entrada * p.estoque);
                    div.innerHTML += `
                        <div class="produto-card">
                            <img src="${p.imagem || ''}" class="img-lista" onerror="this.src='https://via.placeholder.com/60'">
                            <div style="flex:1"><b>${p.nome}</b><br><small>Stock: ${p.estoque}</small></div>
                            <button onclick='prepararEdicao(${JSON.stringify(p)})'>✏️</button>
                            <button onclick="deletar('${p.id}')">🗑️</button>
                        </div>`;
                });

                document.getElementById('dash-venda').innerText = '€ ' + vT.toFixed(2);
                document.getElementById('dash-custo').innerText = '€ ' + cT.toFixed(2);
                document.getElementById('dash-lucro').innerText = '€ ' + (vT - cT).toFixed(2);
            } catch (e) { console.error(e); }
        }

        document.getElementById('foto-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const img = document.getElementById('preview-foto');
                img.src = URL.createObjectURL(file); img.style.display = 'block';
                document.getElementById('label-foto').style.display = 'none';
            }
        };

        document.getElementById('btnSalvar').onclick = async () => {
            const id = document.getElementById('edit-id').value;
            let urlFinal = document.getElementById('preview-foto').src;
            
            if (urlFinal.startsWith('blob:')) {
                const file = document.getElementById('foto-input').files[0];
                const path = `img-${Date.now()}.jpg`;
                const { error } = await sbClient.storage.from('fotos-produtos').upload(path, file);
                if (!error) urlFinal = sbClient.storage.from('fotos-produtos').getPublicUrl(path).data.publicUrl;
            }

            const payload = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value) || 0,
                preco_entrada: parseFloat(document.getElementById('preco_entrada').value) || 0,
                estoque: parseInt(document.getElementById('estoque').value) || 0,
                validade: document.getElementById('validade').value || null,
                imagem: urlFinal.includes('blob:') ? '' : urlFinal
            };

            await fetch(id ? `${API}/${id}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            location.reload();
        };

        function prepararEdicao(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('preco_entrada').value = p.preco_entrada;
            document.getElementById('estoque').value = p.estoque;
            document.getElementById('validade').value = p.validade || "";
            if (p.imagem) {
                const img = document.getElementById('preview-foto');
                img.src = p.imagem; img.style.display = 'block';
                document.getElementById('label-foto').style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletar(id) { if(confirm("Apagar?")) { await fetch(`${API}/${id}`, { method: 'DELETE' }); carregarDados(); } }

        window.onload = carregarDados;
    </script>
</body>
</html>
