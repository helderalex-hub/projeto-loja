<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Lust Store | Painel Administrativo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (localStorage.getItem('token_gerente') !== 'logado_sucesso_servidor') window.location.href = 'login-adm.html';</script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --dark: #0f172a; --card: #1e293b; --gold: #cca43b; --texto: #f8fafc; --borda: #334155; 
            --verde: #10b981; --erro: #ef4444; --alerta: #f59e0b;
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding-bottom: 50px; }
        
        /* HEADER & TABS */
        .header-top { text-align: center; margin-bottom: 20px; position: relative; }
        .logo-adm { height: 50px; margin-bottom: 10px; }
        h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 22px; color: white; text-transform: uppercase; font-weight: 400; }
        h1 span { color: var(--gold); }
        
        .tabs { display: flex; justify-content: center; gap: 5px; margin-bottom: 30px; border-bottom: 1px solid var(--borda); }
        .tab-btn { background: none; border: none; color: #94a3b8; padding: 15px 30px; cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: bold; letter-spacing: 1px; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); border-bottom: 3px solid var(--gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        /* DASHBOARD */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-dash { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--borda); text-align: center; border-bottom: 3px solid var(--gold); }
        .card-dash h3 { margin: 0; font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .card-dash p { margin: 8px 0 0; font-size: 18px; font-weight: bold; }

        /* FORMS INVENTÁRIO */
        .card-form { background: var(--card); padding: 25px; border-radius: 8px; border: 1px solid var(--borda); margin-bottom: 30px; }
        .area-upload { border: 2px dashed var(--borda); padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .area-upload img { max-height: 120px; object-fit: contain; display: none; margin: 10px auto; }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 10px; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--borda); color: white; border-radius: 4px; box-sizing: border-box; }
        .btn-principal { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; }

        /* TABELAS & LISTAS */
        .tabela-container { background: var(--card); border-radius: 8px; border: 1px solid var(--borda); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px; color: var(--gold); border-bottom: 1px solid var(--borda); text-transform: uppercase; font-size: 10px; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .produto-item { display: flex; align-items: center; gap: 15px; padding: 10px; border-bottom: 1px solid #334155; }
        .img-mini { width: 50px; height: 50px; background: white; object-fit: contain; border-radius: 4px; padding: 2px; }

        .status-tag { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: bold; text-transform: uppercase; margin-right: 5px; }
        .critico { background: rgba(239, 68, 68, 0.2); color: var(--erro); }
        .alerta { background: rgba(245, 158, 11, 0.2); color: var(--alerta); }

        .grafico-box { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--borda); height: 300px; margin-bottom: 30px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <img src="logo.png" class="logo-adm" onerror="this.style.display='none'">
        <h1>Lust Store - <span>Painel Administrativo</span></h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('financeiro')">📈 Financeiro</button>
        <button class="tab-btn" onclick="openTab('inventario')">📦 Inventário</button>
    </div>

    <div id="financeiro" class="tab-content active">
        <div class="dashboard">
            <div class="card-dash"><h3>Custo Estoque Total</h3><p id="dash-custo">...</p></div>
            <div class="card-dash"><h3>Valor Venda Total</h3><p id="dash-valor">...</p></div>
            <div class="card-dash"><h3>Lucro Est. Total</h3><p id="dash-lucro-est">...</p></div>
            <div class="card-dash"><h3>Vendas do Mês</h3><p id="dash-vendas-mes">...</p></div>
            <div class="card-dash"><h3>Lucro do Mês</h3><p id="dash-lucro-mes" style="color:var(--verde)">...</p></div>
        </div>

        <div style="margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="gerarRelatorioFinanceiro('semanal')" class="tab-btn" style="background:var(--card); border:1px solid var(--borda)">📅 Relatório Semanal</button>
            <button onclick="gerarRelatorioFinanceiro('mensal')" class="tab-btn" style="background:var(--card); border:1px solid var(--borda)">📅 Relatório Mensal</button>
            <button onclick="gerarEtiquetasDia()" class="tab-btn" style="background:var(--verde); color:white">📦 Etiquetas de Hoje</button>
        </div>

        <div class="grafico-box">
            <canvas id="graficoVendas"></canvas>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Total</th><th>Ações</th></tr>
                </thead>
                <tbody id="lista-vendas"></tbody>
            </table>
        </div>
    </div>

    <div id="inventario" class="tab-content">
        <div class="card-form">
            <div class="area-upload" onclick="document.getElementById('file-input').click()">
                <span id="label-upload">📸 Carregar Foto (Ajuste Moderno)</span>
                <img id="preview-img">
                <input type="file" id="file-input" hidden onchange="processarFoto(this)">
            </div>
            <div class="grid-inputs">
                <div style="grid-column: span 2;"><label>Nome do Produto</label><input type="text" id="p-nome"></div>
                <div><label>Validade</label><input type="date" id="p-validade"></div>
            </div>
            <div class="grid-inputs">
                <div><label>Custo (€)</label><input type="number" id="p-custo" step="0.01"></div>
                <div><label>Venda (€)</label><input type="number" id="p-venda" step="0.01"></div>
                <div><label>Stock</label><input type="number" id="p-stock"></div>
            </div>
            <input type="hidden" id="edit-id">
            <button class="btn-principal" onclick="salvarProduto()">Salvar no Sistema</button>
        </div>

        <div id="lista-inventario" class="tabela-container">
            </div>
    </div>
</div>

<script>
    const API = "https://projeto-loja-dzqv.onrender.com";
    let produtos = [], vendas = [], fotoBase64 = "";

    async function iniciar() {
        const [resP, resV] = await Promise.all([fetch(`${API}/produtos`), fetch(`${API}/vendas`)]);
        produtos = await resP.json(); vendas = await resV.json();
        atualizarDash(); renderizarVendas(); renderizarInventario(); renderizarGrafico();
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function atualizarDash() {
        let custoTotal = 0, valorTotal = 0;
        produtos.forEach(p => { custoTotal += (p.preco_entrada || 0) * p.estoque; valorTotal += p.preco * p.estoque; });
        
        const hoje = new Date();
        let vMes = 0, lMes = 0;
        vendas.forEach(v => {
            const dv = new Date(v.data_venda);
            if(dv.getMonth() === hoje.getMonth() && dv.getFullYear() === hoje.getFullYear()) {
                vMes += v.total_venda; lMes += v.lucro;
            }
        });

        document.getElementById('dash-custo').innerText = `€${custoTotal.toFixed(2)}`;
        document.getElementById('dash-valor').innerText = `€${valorTotal.toFixed(2)}`;
        document.getElementById('dash-lucro-est').innerText = `€${(valorTotal - custoTotal).toFixed(2)}`;
        document.getElementById('dash-vendas-mes').innerText = `€${vMes.toFixed(2)}`;
        document.getElementById('dash-lucro-mes').innerText = `€${lMes.toFixed(2)}`;
    }

    function renderizarInventario() {
        const div = document.getElementById('lista-inventario'); div.innerHTML = '';
        produtos.forEach(p => {
            const critico = p.estoque <= 0 ? 'critico' : (p.estoque < 5 ? 'alerta' : '');
            const txtStock = p.estoque <= 0 ? 'ESGOTADO' : `STOCK: ${p.estoque}`;
            
            div.innerHTML += `
                <div class="produto-item">
                    <img src="${p.imagem}" class="img-mini" onerror="this.src='https://placehold.co/50?text=Ls'">
                    <div style="flex:1">
                        <b>${p.nome}</b><br>
                        <span class="status-tag ${critico}">${txtStock}</span>
                        <small style="color:#94a3b8">Custo: €${p.preco_entrada} | Venda: €${p.preco}</small>
                    </div>
                    <button onclick="prepararEdicao(${p.id})" style="background:none; border:none; color:var(--gold); cursor:pointer">✎</button>
                    <button onclick="apagarProduto(${p.id})" style="background:none; border:none; color:var(--erro); cursor:pointer">✕</button>
                </div>`;
        });
    }

    function renderizarVendas() {
        const tb = document.getElementById('lista-vendas'); tb.innerHTML = '';
        vendas.forEach(v => {
            tb.innerHTML += `<tr>
                <td>${new Date(v.data_venda).toLocaleDateString()}</td>
                <td style="color:var(--gold)">#${v.codigo_pedido}</td>
                <td>${v.cliente_nome}</td>
                <td>€${v.total_venda.toFixed(2)}</td>
                <td>
                    <button onclick="gerarEtiqueta('${v.codigo_pedido}')" title="Etiqueta" style="border:none; background:none; cursor:pointer">📦</button>
                    <button onclick="gerarPDFPedido('${v.codigo_pedido}')" title="Recibo" style="border:none; background:none; cursor:pointer">📄</button>
                </td>
            </tr>`;
        });
    }

    function renderizarGrafico() {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        const hoje = new Date();
        const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
        const dados = new Array(diasNoMes).fill(0);
        vendas.forEach(v => {
            const d = new Date(v.data_venda);
            if(d.getMonth() === hoje.getMonth()) dados[d.getDate()-1] += v.total_venda;
        });

        new Chart(ctx, {
            type: 'bar',
            data: { labels: Array.from({length: diasNoMes}, (_,i)=>i+1), datasets:[{ label:'Vendas €', data:dados, backgroundColor:'#cca43b' }] },
            options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#334155'}} } }
        });
    }

    // LOGÍSTICA PDF
    function gerarEtiqueta(cod) {
        const v = vendas.find(x => x.codigo_pedido === cod);
        const { jsPDF } = window.jspdf; const doc = new jsPDF({ format:[100, 150], unit:'mm' });
        
        // Etiqueta Envio
        doc.setFontSize(8); doc.text("REMETENTE: LUST STORE", 5, 10);
        doc.setFontSize(10); doc.text("DESTINATÁRIO:", 5, 40);
        doc.setFontSize(14); doc.setFont("helvetica","bold"); doc.text(v.cliente_nome, 5, 50);
        doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.text(doc.splitTextToSize(v.cliente_morada, 90), 5, 58);
        doc.rect(5, 120, 90, 20); doc.text(v.codigo_pedido, 50, 132, {align:'center'});

        // Packing List (Pag 2)
        doc.addPage(); doc.text("PACKING LIST - #" + v.codigo_pedido, 50, 15, {align:'center'});
        let y = 30; v.itens.forEach(i => { doc.text("- " + i.nome, 10, y); y+=8; });
        doc.save(`Etiqueta_${cod}.pdf`);
    }

    function gerarRelatorioFinanceiro(per) {
        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        doc.setFillColor(15, 23, 42); doc.rect(0,0,210,30,'F');
        doc.setTextColor(204,164,59); doc.setFontSize(20); doc.text("LUST STORE", 14, 20);
        doc.autoTable({
            startY: 40, head:[['Data','Pedido','Custo','Frete','Venda','Lucro']],
            body: vendas.map(v => [new Date(v.data_venda).toLocaleDateString(), v.codigo_pedido, v.total_custo, v.total_frete, v.total_venda, v.lucro]),
            headStyles:{fillColor:[15,23,42], textColor:[204,164,59]}
        });
        doc.save(`Financeiro_${per}.pdf`);
    }

    // OPERACIONAL INVENTÁRIO
    function processarFoto(input) {
        if(input.files && input.files[0]) {
            const r = new FileReader();
            r.onload = e => { fotoBase64 = e.target.result; document.getElementById('preview-img').src = fotoBase64; document.getElementById('preview-img').style.display='block'; document.getElementById('label-upload').style.display='none'; };
            r.readAsDataURL(input.files[0]);
        }
    }

    async function salvarProduto() {
        const id = document.getElementById('edit-id').value;
        const p = { nome: document.getElementById('p-nome').value, validade: document.getElementById('p-validade').value, preco_entrada: parseFloat(document.getElementById('p-custo').value), preco: parseFloat(document.getElementById('p-venda').value), estoque: parseInt(document.getElementById('p-stock').value), imagem: fotoBase64 };
        await fetch(id ? `${API}/produtos/${id}` : `${API}/produtos`, { method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p) });
        location.reload();
    }

    function prepararEdicao(id) {
        const p = produtos.find(x => x.id === id);
        document.getElementById('p-nome').value = p.nome; document.getElementById('p-custo').value = p.preco_entrada;
        document.getElementById('p-venda').value = p.preco; document.getElementById('p-stock').value = p.estoque;
        document.getElementById('p-validade').value = p.validade || '';
        document.getElementById('edit-id').value = p.id; fotoBase64 = p.imagem;
        document.getElementById('preview-img').src = p.imagem; document.getElementById('preview-img').style.display='block';
        openTab('inventario'); window.scrollTo(0,0);
    }

    async function apagarProduto(id) { if(confirm("Apagar produto?")) { await fetch(`${API}/produtos/${id}`, {method:'DELETE'}); iniciar(); } }
    
    iniciar();
</script>
</body>
</html>
