<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo | Beleza & Companhia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --rosa: #d63384; --rosa-claro: #ffb6c1; --texto: #f8fafc; --verde: #22c55e; --azul: #3b82f6; --laranja: #f59e0b; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: var(--rosa); text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card-dash { background: var(--card); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .card-dash h3 { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin: 0; }
        .card-dash p { font-size: 24px; font-weight: bold; margin: 10px 0 0; }

        .grid-meio { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-bottom: 30px; }
        .card-alertas { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        .alerta-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 13px; }

        .card-form { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #334155; display: flex; gap: 20px; }
        .foto-click-area { width: 100px; height: 100px; border-radius: 12px; border: 2px dashed #475569; background: #0f172a; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; flex-shrink: 0; }
        .foto-click-area img { width: 100%; height: 100%; object-fit: cover; }
        
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        button#btnSalvar { background: var(--rosa); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .produto-card { background: var(--card); padding: 15px; margin-bottom: 12px; border-radius: 12px; display: flex; align-items: center; gap: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .img-produto-lista { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .prod-info { flex: 1; }
        .acoes { display: flex; gap: 8px; }
        .btn-edit { background: rgba(59, 130, 246, 0.2); color: var(--azul); border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 Administração VIP</h1>
        
        <div class="dashboard">
            <div class="card-dash"><h3>Valor Venda (Stock)</h3><p id="dash-fatura">€ 0.00</p></div>
            <div class="card-dash"><h3>Custo Stock</h3><p id="dash-custo">€ 0.00</p></div>
            <div class="card-dash"><h3>Margem Prevista</h3><p id="dash-margem">€ 0.00</p></div>
        </div>

        <div class="grid-meio">
            <div class="card-alertas">
                <h2 style="font-size: 15px; margin-bottom: 15px; color: var(--rosa);">📊 Vendas Reais</h2>
                <div class="alerta-item"><span>Vendas Hoje:</span><b id="v-hoje" style="color:var(--verde)">€ 0.00</b></div>
                <div class="alerta-item"><span>Vendas Mês:</span><b id="v-mes" style="color:var(--verde)">€ 0.00</b></div>
                <div class="alerta-item"><span>Lucro Real Acumulado:</span><b id="l-total" style="color:var(--azul)">€ 0.00</b></div>
                <button onclick="exportarCSV()" style="width:100%; margin-top:10px; background:#22c55e; border:none; border-radius:5px; padding:5px; cursor:pointer; font-weight:bold;">📥 Exportar Inventário</button>
            </div>

            <div class="card-form">
                <div class="foto-click-area" onclick="document.getElementById('foto-input').click()">
                    <img id="preview-foto-form" src="" style="display:none">
                    <span id="label-foto">📷 + FOTO</span>
                </div>
                <input type="file" id="foto-input" accept="image/*" style="display:none">
                <div style="flex:1">
                    <input type="hidden" id="edit-id">
                    <input type="text" id="nome" placeholder="Nome do Produto">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <input type="number" id="preco_entrada" step="0.01" placeholder="Custo €">
                        <input type="number" id="preco" step="0.01" placeholder="Venda €">
                        <input type="number" id="estoque" placeholder="Stock">
                        <input type="date" id="validade">
                    </div>
                    <button id="btnSalvar">GRAVAR PRODUTO</button>
                    <button onclick="limpar()" style="background:none; border:none; color:gray; width:100%; cursor:pointer; font-size:10px;">LIMPAR / NOVO</button>
                </div>
            </div>
        </div>
        <div id="lista">A carregar...</div>
    </div>

    <script>
        const API = 'https://projeto-loja-beleza-cia.onrender.com/produtos';
        const S_URL = 'https://sgamfzcgiexoevnyiehn.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnYW1memNnaWV4b2V2bnlpZWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MzIwMDYsImV4cCI6MjA4NDUwODAwNn0.BLdnOWXEpW6w_Ic_0stcOexXXQBWl7Rc5ll0ATjvZVs';
        const sbClient = window.supabase.createClient(S_URL, S_KEY);
        let produtosGlobais = [];

        async function carregarDados() {
            try {
                const res = await fetch(`${API}?t=${Date.now()}`);
                produtosGlobais = await res.json();
                const div = document.getElementById('lista');
                div.innerHTML = '';
                let fT = 0, cT = 0;

                produtosGlobais.forEach(p => {
                    fT += (p.preco * p.estoque); cT += (p.preco_entrada * p.estoque);
                    div.innerHTML += `
                        <div class="produto-card">
                            <img src="${p.imagem || ''}" class="img-produto-lista" onerror="this.src='https://via.placeholder.com/60'">
                            <div class="prod-info"><strong>${p.nome}</strong><br><small>Venda: €${p.preco.toFixed(2)} | Stock: ${p.estoque}</small></div>
                            <div class="acoes">
                                <button class="btn-edit" onclick='prepararEdicao(${JSON.stringify(p)})'>✏️</button>
                                <button class="btn-del" onclick="deletar('${p.id}')">🗑️</button>
                            </div>
                        </div>`;
                });
                document.getElementById('dash-fatura').innerText = '€ ' + fT.toFixed(2);
                document.getElementById('dash-custo').innerText = '€ ' + cT.toFixed(2);
                document.getElementById('dash-margem').innerText = '€ ' + (fT - cT).toFixed(2);
            } catch (e) { document.getElementById('lista').innerHTML = "Erro ao ligar ao servidor."; }
        }

        async function carregarVendas() {
            const { data: vendas } = await sbClient.from('vendas').select('*');
            if (vendas) {
                const hoje = new Date().toLocaleDateString();
                const vHoje = vendas.filter(v => new Date(v.created_at).toLocaleDateString() === hoje);
                document.getElementById('v-hoje').innerText = '€ ' + vHoje.reduce((a, b) => a + b.valor_pago, 0).toFixed(2);
                document.getElementById('v-mes').innerText = '€ ' + vendas.reduce((a, b) => a + b.valor_pago, 0).toFixed(2);
                document.getElementById('l-total').innerText = '€ ' + vendas.reduce((a, b) => a + (b.lucro_real || 0), 0).toFixed(2);
            }
        }

        document.getElementById('foto-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const img = document.getElementById('preview-foto-form');
                img.src = URL.createObjectURL(file);
                img.style.display = 'block';
                document.getElementById('label-foto').style.display = 'none';
            }
        };

        document.getElementById('btnSalvar').onclick = async () => {
            const id = document.getElementById('edit-id').value;
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true; btn.innerText = "A GUARDAR...";

            let urlFinal = document.getElementById('preview-foto-form').src;
            if (urlFinal.startsWith('blob:')) {
                const file = document.getElementById('foto-input').files[0];
                const path = `img-${Date.now()}.jpg`;
                const { error } = await sbClient.storage.from('fotos-produtos').upload(path, file);
                if (!error) urlFinal = sbClient.storage.from('fotos-produtos').getPublicUrl(path).data.publicUrl;
            }

            const payload = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value) || 0,
                preco_entrada: parseFloat(document.getElementById('preco_entrada').value) || 0,
                estoque: parseInt(document.getElementById('estoque').value) || 0,
                validade: document.getElementById('validade').value || null,
                imagem: urlFinal.includes('blob:') ? '' : urlFinal
            };

            await fetch(id ? `${API}/${id}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            limpar(); carregarDados(); btn.disabled = false;
        };

        function prepararEdicao(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('preco_entrada').value = p.preco_entrada;
            document.getElementById('estoque').value = p.estoque;
            document.getElementById('validade').value = p.validade || "";
            if (p.imagem) {
                const img = document.getElementById('preview-foto-form');
                img.src = p.imagem; img.style.display = 'block';
                document.getElementById('label-foto').style.display = 'none';
            }
            document.getElementById('btnSalvar').innerText = "ATUALIZAR PRODUTO";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limpar() {
            document.getElementById('edit-id').value = "";
            document.getElementById('nome').value = "";
            document.getElementById('preco').value = "";
            document.getElementById('preco_entrada').value = "";
            document.getElementById('estoque').value = "";
            document.getElementById('validade').value = "";
            document.getElementById('preview-foto-form').style.display = 'none';
            document.getElementById('label-foto').style.display = 'block';
            document.getElementById('btnSalvar').innerText = "GRAVAR PRODUTO";
        }

        async function deletar(id) { if(confirm("Apagar?")) { await fetch(`${API}/${id}`, { method: 'DELETE' }); carregarDados(); } }
        
        function exportarCSV() {
            let csv = "Nome;Custo;Venda;Stock;Total\n";
            produtosGlobais.forEach(p => csv += `${p.nome};${p.preco_entrada};${p.preco};${p.estoque};${(p.preco*p.estoque).toFixed(2)}\n`);
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Inventario.csv`; link.click();
        }

        window.onload = () => { carregarDados(); carregarVendas(); };
    </script>
</body>
</html>
