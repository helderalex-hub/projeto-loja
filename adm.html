<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Admin | Lust Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (localStorage.getItem('token_gerente') !== 'logado_sucesso_servidor') window.location.href = 'login-adm.html';</script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --dark: #0f172a; --card: #1e293b; 
            --gold: #cca43b; --texto: #f8fafc; --borda: #334155; 
            --verde: #10b981; --erro: #ef4444; 
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: var(--texto); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        
        /* HEADER */
        .header-top { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--borda); padding-bottom: 20px; position: relative; }
        .logo-adm { height: 60px; display: block; margin: 0 auto 10px; }
        h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 24px; color: white; letter-spacing: 1px; font-weight: 400; text-transform: uppercase; }
        h1 span { color: var(--gold); }
        .btn-sair { position: absolute; top: 0; right: 0; background: transparent; border: 1px solid var(--borda); color: #94a3b8; padding: 5px 15px; border-radius: 4px; cursor: pointer; }

        /* CARDS */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-dash { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--borda); text-align: center; border-bottom: 3px solid var(--gold); }
        .card-dash h3 { margin: 0; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .card-dash p { margin: 10px 0 0; font-size: 20px; font-weight: bold; color: white; font-family: 'Playfair Display', serif; }

        /* BOTÕES & FORMS */
        .btn-pdf { background: #334155; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-right: 10px; }
        .btn-pdf:hover { background: var(--gold); color: var(--dark); }

        .card-cadastro { background: var(--card); padding: 25px; border-radius: 8px; border: 1px solid var(--borda); margin: 30px 0; display: flex; gap: 25px; }
        .area-foto { width: 120px; height: 120px; background: #0f172a; border: 2px dashed var(--borda); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .area-foto img { width: 100%; height: 100%; object-fit: contain; }
        
        .campos-texto { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--borda); color: white; border-radius: 4px; box-sizing: border-box; }
        .btn-salvar { background: var(--gold); color: var(--dark); border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 10px; }

        /* LISTAS */
        .produto-item { background: var(--card); padding: 10px; margin-bottom: 10px; border-radius: 4px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--borda); }
        .img-lista { width: 40px; height: 40px; object-fit: contain; background: white; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 10px; font-size: 11px; color: var(--gold); border-bottom: 1px solid var(--borda); text-transform: uppercase; }
        td { padding: 10px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header-top">
            <img src="logo.png" alt="Logo" class="logo-adm" onerror="this.style.display='none'">
            <h1>Lust Store - <span>Painel Administrativo</span></h1>
            <button class="btn-sair" onclick="sair()">Sair 🔒</button>
        </div>
        
        <div class="dashboard">
            <div class="card-dash"><h3>Valor em Estoque</h3><p id="dash-venda">...</p></div>
            <div class="card-dash"><h3>Lucro Previsto</h3><p id="dash-lucro-est">...</p></div>
            <div class="card-dash"><h3>Total Vendas</h3><p id="dash-total-vendas">...</p></div>
        </div>

        <div>
            <button onclick="baixarPDF('vendas')" class="btn-pdf">📄 Relatório Vendas</button>
            <button onclick="baixarPDF('inventario')" class="btn-pdf">📦 Relatório Inventário</button>
        </div>

        <div class="card-cadastro">
            <div class="area-foto" onclick="document.getElementById('img-input').click()">
                <img id="preview-img" style="display:none">
                <span id="aviso-foto" style="font-size:10px; color:#64748b; text-align:center">+ FOTO</span>
                <input type="file" id="img-input" accept="image/*" hidden onchange="lerImagem(this)">
            </div>
            <div class="campos-texto">
                <input type="text" id="nome" placeholder="Nome do Produto">
                <div style="display:flex; gap:10px">
                    <input type="number" id="preco" placeholder="Preço Venda (€)">
                    <input type="number" id="custo" placeholder="Custo (€)">
                    <input type="number" id="estoque" placeholder="Qtd Estoque">
                </div>
                <input type="hidden" id="edit-id">
                <button onclick="salvarProduto()" class="btn-salvar" id="btn-salvar">Salvar Produto</button>
            </div>
        </div>

        <h3 style="color:var(--gold); text-transform:uppercase; font-size:12px; margin-top:40px">Inventário</h3>
        <div id="lista-inventario"></div>

        <h3 style="color:var(--gold); text-transform:uppercase; font-size:12px; margin-top:40px">Últimas Vendas</h3>
        <div style="overflow-x:auto">
            <table>
                <thead><tr><th>Data</th><th>ID</th><th>Cliente</th><th>Total</th><th>Ação</th></tr></thead>
                <tbody id="lista-vendas"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://projeto-loja-dzqv.onrender.com";
        let produtosCache = [], vendasCache = [], imagemBase64 = "";

        async function iniciar() {
            try {
                const [resP, resV] = await Promise.all([fetch(`${API_URL}/produtos`), fetch(`${API_URL}/vendas`)]);
                produtosCache = await resP.json(); vendasCache = await resV.json();
                atualizarDash(); renderizarInv(); renderizarVendas();
            } catch (e) { console.error(e); }
        }

        function atualizarDash() {
            let valVenda = 0, custo = 0, fatura = 0;
            produtosCache.forEach(p => { valVenda += p.preco * p.estoque; custo += (p.preco_entrada||0) * p.estoque; });
            vendasCache.forEach(v => fatura += v.total_venda);
            document.getElementById('dash-venda').innerText = `€${valVenda.toFixed(2)}`;
            document.getElementById('dash-lucro-est').innerText = `€${(valVenda - custo).toFixed(2)}`;
            document.getElementById('dash-total-vendas').innerText = `€${fatura.toFixed(2)}`;
        }

        function renderizarInv() {
            const div = document.getElementById('lista-inventario'); div.innerHTML = '';
            produtosCache.forEach(p => {
                let badge = p.estoque <= 0 ? '<span style="color:#ef4444; font-weight:bold">ESGOTADO</span>' : `Qtd: ${p.estoque}`;
                div.innerHTML += `
                    <div class="produto-item">
                        <img src="${p.imagem}" class="img-lista" onerror="this.src='https://placehold.co/50?text=Ls'">
                        <div style="flex:1"><b>${p.nome}</b> <small style="color:#94a3b8">| €${p.preco}</small></div>
                        <div style="font-size:12px">${badge}</div>
                        <button onclick="editar(${p.id})" style="background:#3b82f6; border:none; color:white; padding:5px 8px; border-radius:4px; cursor:pointer">✎</button>
                        <button onclick="apagar(${p.id})" style="background:#ef4444; border:none; color:white; padding:5px 8px; border-radius:4px; cursor:pointer">✕</button>
                    </div>`;
            });
        }

        function renderizarVendas() {
            const tb = document.getElementById('lista-vendas'); tb.innerHTML = '';
            vendasCache.forEach(v => {
                tb.innerHTML += `<tr>
                    <td>${new Date(v.data_venda).toLocaleDateString()}</td>
                    <td style="color:#cca43b">#${v.codigo_pedido}</td>
                    <td>${v.cliente_nome}</td>
                    <td>€${v.total_venda.toFixed(2)}</td>
                    <td><button onclick="reenviar('${v.id}')" style="background:#10b981; border:none; color:white; padding:4px 8px; border-radius:4px; cursor:pointer">📧</button></td>
                </tr>`;
            });
        }

        async function reenviar(id) {
            if(confirm("Reenviar email?")) { await fetch(`${API_URL}/reenviar-email/${id}`, {method:'POST'}); alert("Enviado!"); }
        }

        function lerImagem(input) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = function(e) { imagemBase64 = e.target.result; document.getElementById('preview-img').src = imagemBase64; document.getElementById('preview-img').style.display = 'block'; }
                r.readAsDataURL(input.files[0]);
            }
        }

        async function salvarProduto() {
            const p = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                preco_entrada: parseFloat(document.getElementById('custo').value),
                estoque: parseInt(document.getElementById('estoque').value),
                imagem: imagemBase64
            };
            const id = document.getElementById('edit-id').value;
            const url = id ? `${API_URL}/produtos/${id}` : `${API_URL}/produtos`;
            await fetch(url, { method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) });
            location.reload();
        }

        function editar(id) {
            const p = produtosCache.find(x => x.id === id);
            document.getElementById('nome').value = p.nome; document.getElementById('preco').value = p.preco;
            document.getElementById('custo').value = p.preco_entrada; document.getElementById('estoque').value = p.estoque;
            document.getElementById('edit-id').value = p.id; imagemBase64 = p.imagem;
            if(p.imagem) { document.getElementById('preview-img').src = p.imagem; document.getElementById('preview-img').style.display='block'; }
            document.getElementById('btn-salvar').innerText = "Atualizar"; window.scrollTo(0,0);
        }

        async function apagar(id) { if(confirm("Apagar?")) { await fetch(`${API_URL}/produtos/${id}`, {method:'DELETE'}); iniciar(); } }

        function baixarPDF(tipo) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(204, 164, 59); doc.setFontSize(20); doc.text("LUST STORE", 14, 18);
            
            let head, body;
            if(tipo==='vendas') {
                doc.text("Relatório Vendas", 14, 40);
                head = [['Data', 'Cliente', 'Total']];
                body = vendasCache.map(v => [new Date(v.data_venda).toLocaleDateString(), v.cliente_nome, `€${v.total_venda.toFixed(2)}`]);
            } else {
                doc.text("Relatório Estoque", 14, 40);
                head = [['Produto', 'Qtd', 'Valor Venda']];
                body = produtosCache.map(p => [p.nome, p.estoque, `€${p.preco.toFixed(2)}`]);
            }
            doc.autoTable({ head: head, body: body, startY: 45, headStyles: { fillColor: [15, 23, 42] } });
            doc.save(`LustStore_${tipo}.pdf`);
        }

        function sair() { localStorage.removeItem('token_gerente'); window.location.href = 'login-adm.html'; }
        iniciar();
    </script>
</body>
</html>
