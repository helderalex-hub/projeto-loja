<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo | Beleza & Cia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --rosa: #d63384; --rosa-claro: #fda4af; --texto: #f8fafc; --borda: #334155; --label: #cbd5e1; --verde: #22c55e; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark); color: var(--texto); padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card-dash { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--borda); text-align: center; }
        .card-dash h3 { margin: 0; font-size: 13px; color: var(--label); text-transform: uppercase; }
        .card-dash p { margin: 10px 0 0 0; font-size: 20px; font-weight: bold; color: var(--rosa-claro); }

        .card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--borda); margin-bottom: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        /* Área da Foto no Formulário */
        .foto-container { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 10px; }
        .preview-box { width: 120px; height: 120px; background: #0f172a; border: 2px dashed var(--borda); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .foto-inputs { flex-grow: 1; }

        .grid-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 15px; color: var(--label); margin-bottom: 8px; margin-top: 12px; font-weight: 500; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--borda); color: white; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: var(--rosa); outline: none; }
        
        .btn-principal { background: var(--rosa); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; transition: 0.3s; font-size: 16px; }
        .btn-principal:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .produto-item { background: var(--card); padding: 18px; margin-bottom: 12px; border-radius: 12px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.05); gap: 15px; }
        .img-lista { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; background: #0f172a; border: 1px solid var(--borda); }
        .info-principal { flex: 1; }
        .nome-produto { font-size: 18px; color: var(--rosa-claro); font-weight: bold; }
        .tag-validade { font-size: 11px; background: #334155; padding: 2px 8px; border-radius: 4px; color: #cbd5e1; display: inline-block; margin-top: 5px; }
        .btn-acao { width: auto; padding: 8px 16px; margin-left: 8px; border-radius: 8px; border: none; color: white; cursor: pointer; font-size: 13px; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center; letter-spacing: -1px;">💎 Painel <span style="color:var(--rosa)">Administrativo</span></h1>
        
        <div class="dashboard">
            <div class="card-dash"><h3>Total Venda (PVP)</h3><p id="dash-venda">€ 0.00</p></div>
            <div class="card-dash"><h3>Total Custo</h3><p id="dash-custo">€ 0.00</p></div>
            <div class="card-dash"><h3>Lucro Previsto</h3><p id="dash-lucro" style="color:var(--verde)">€ 0.00</p></div>
        </div>

        <div class="card">
            <input type="hidden" id="edit-id">
            
            <div class="foto-container">
                <div class="preview-box">
                    <img id="img-preview" src="" style="display:none">
                    <span id="img-placeholder" style="color:var(--borda); font-size: 30px;">📷</span>
                </div>
                <div class="foto-inputs">
                    <label>URL DA FOTO</label>
                    <input type="text" id="imagem" placeholder="Cole o link da imagem aqui" oninput="atualizarPreview()">
                </div>
            </div>

            <label>NOME DO PRODUTO</label>
            <input type="text" id="nome" placeholder="Ex: Batom Matte Rosa">
            
            <div class="grid-campos">
                <div>
                    <label>PREÇO CUSTO (€)</label>
                    <input type="number" id="preco_entrada" step="0.01" placeholder="0.00">
                </div>
                <div>
                    <label>PREÇO VENDA (€)</label>
                    <input type="number" id="preco" step="0.01" placeholder="0.00">
                </div>
            </div>

            <div class="grid-campos">
                <div>
                    <label>ESTOQUE ATUAL</label>
                    <input type="number" id="estoque" placeholder="0">
                </div>
                <div>
                    <label>VALIDADE</label>
                    <input type="date" id="validade">
                </div>
            </div>

            <button class="btn-principal" id="btnSalvar" onclick="salvar()">GRAVAR NO INVENTÁRIO</button>
        </div>

        <div id="lista">A carregar inventário...</div>
    </div>

    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com/produtos';

        function atualizarPreview() {
            const url = document.getElementById('imagem').value;
            const preview = document.getElementById('img-preview');
            const placeholder = document.getElementById('img-placeholder');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                preview.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }

        async function carregar() {
            const div = document.getElementById('lista');
            try {
                const res = await fetch(API);
                const dados = await res.json();
                div.innerHTML = '';
                let totalVenda = 0, totalCusto = 0;

                dados.forEach(p => {
                    const precoV = parseFloat(p.preco || 0);
                    const precoC = parseFloat(p.preco_entrada || 0);
                    const qtd = parseInt(p.estoque || 0);
                    totalVenda += (precoV * qtd);
                    totalCusto += (precoC * qtd);

                    const dataVal = p.validade ? new Date(p.validade).toLocaleDateString('pt-PT') : 'N/A';
                    const fotoUrl = p.imagem || 'https://via.placeholder.com/70?text=S/F';

                    div.innerHTML += `
                        <div class="produto-item">
                            <img src="${fotoUrl}" class="img-lista" onerror="this.src='https://via.placeholder.com/70?text=Erro'">
                            <div class="info-principal">
                                <span class="nome-produto">${p.nome}</span><br>
                                <span style="color:var(--rosa); font-weight: 500;">€ ${precoV.toFixed(2)}</span> 
                                <small style="color:#64748b; margin-left:10px">Custo: € ${precoC.toFixed(2)}</small><br>
                                <small>Estoque: <b>${qtd}</b></small><br>
                                <span class="tag-validade">📅 Validade: ${dataVal}</span>
                            </div>
                            <div style="display:flex">
                                <button class="btn-acao" style="background:#3b82f6" onclick='prepararEdicao(${JSON.stringify(p)})'>Editar</button>
                                <button class="btn-acao" style="background:#ef4444" onclick="deletar('${p.id}')">Apagar</button>
                            </div>
                        </div>`;
                });

                document.getElementById('dash-venda').innerText = `€ ${totalVenda.toFixed(2)}`;
                document.getElementById('dash-custo').innerText = `€ ${totalCusto.toFixed(2)}`;
                document.getElementById('dash-lucro').innerText = `€ ${(totalVenda - totalCusto).toFixed(2)}`;

            } catch (e) { div.innerHTML = "Erro ao carregar lista."; }
        }

        async function salvar() {
            const id = document.getElementById('edit-id').value;
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "A PROCESSAR..."; btn.disabled = true;

            const produto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value) || 0,
                preco_entrada: parseFloat(document.getElementById('preco_entrada').value) || 0,
                estoque: parseInt(document.getElementById('estoque').value) || 0,
                validade: document.getElementById('validade').value || null,
                imagem: document.getElementById('imagem').value
            };

            try {
                await fetch(id ? `${API}/${id}` : API, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto)
                });
                resetForm();
                carregar();
            } catch (e) { alert("Erro ao guardar!"); }
            btn.innerText = "GRAVAR NO INVENTÁRIO"; btn.disabled = false;
        }

        function prepararEdicao(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('preco_entrada').value = p.preco_entrada || '';
            document.getElementById('estoque').value = p.estoque;
            document.getElementById('validade').value = p.validade || '';
            document.getElementById('imagem').value = p.imagem || '';
            atualizarPreview();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            ['nome', 'preco', 'preco_entrada', 'estoque', 'validade', 'imagem'].forEach(c => document.getElementById(c).value = '');
            atualizarPreview();
        }

        async function deletar(id) {
            if (confirm("Deseja apagar este produto?")) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                carregar();
            }
        }

        window.onload = carregar;
    </script>
</body>
</html>
