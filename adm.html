<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Lust Store | Painel Administrativo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (localStorage.getItem('token_gerente') !== 'logado_sucesso_servidor') window.location.href = 'login-adm.html';</script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --dark: #0f172a; --card: #1e293b; --gold: #cca43b; --texto: #f8fafc; --borda: #334155; 
            --verde: #10b981; --erro: #ef4444; 
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 20px; }
        .container { max-width: 1250px; margin: 0 auto; padding-bottom: 60px; }
        
        .header-top { text-align: center; margin-bottom: 25px; }
        .logo-adm { height: 55px; margin-bottom: 10px; }
        h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 24px; color: white; text-transform: uppercase; }
        h1 span { color: var(--gold); }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid var(--borda); }
        .tab-btn { background: none; border: none; color: #94a3b8; padding: 15px 35px; cursor: pointer; text-transform: uppercase; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); border-bottom: 4px solid var(--gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-dash { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--borda); text-align: center; border-bottom: 4px solid var(--gold); }
        .card-dash h3 { margin: 0; font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .card-dash p { margin: 10px 0 0; font-size: 20px; font-weight: 700; color: white; }

        /* FORMULÁRIO */
        .card-form { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 30px; display: flex; gap: 25px; }
        .area-upload { flex: 0 0 140px; height: 140px; border: 2px dashed var(--gold); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }
        .area-upload img { width: 100%; height: 100%; object-fit: contain; background: white; }
        
        .campos-container { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .full-width { grid-column: span 3; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--borda); color: white; border-radius: 6px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        /* TABELA LIVE EDIT (ESTILO GARANTIDO) */
        .tabela-container { background: var(--card); border-radius: 12px; border: 1px solid var(--borda); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { text-align: left; padding: 15px; color: var(--gold); border-bottom: 2px solid var(--borda); text-transform: uppercase; font-size: 10px; }
        td { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* CAMPOS BRANCOS PUROS - FORÇA BRUTA CSS */
        .input-live { 
            background-color: #ffffff !important; 
            border: 2px solid #cbd5e1 !important; 
            padding: 8px !important; 
            color: #000000 !important; 
            width: 100%; 
            font-size: 14px !important; 
            font-weight: 700 !important;
            border-radius: 4px; 
            text-align: center;
            appearance: none;
            -moz-appearance: textfield;
        }
        /* REMOVE SETAS EM TODOS OS NAVEGADORES */
        .input-live::-webkit-outer-spin-button, 
        .input-live::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .img-table { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 6px; cursor: pointer; border: 1px solid var(--borda); transition: 0.2s; }
        .img-table:hover { transform: scale(1.1); border-color: var(--gold); }
        
        .btn-mini { background: none; border: none; color: var(--erro); cursor: pointer; font-size: 18px; }
        .btn-salvar { background: var(--gold); color: #0f172a; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; grid-column: span 3; margin-top: 5px; }

        .grafico-box { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--borda); height: 320px; margin-bottom: 30px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <img src="logo.png" class="logo-adm" onerror="this.style.display='none'">
        <h1>Lust Store - <span>Painel Administrativo</span></h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('financeiro')">📈 Financeiro</button>
        <button class="tab-btn" onclick="openTab('inventario')">📦 Inventário</button>
    </div>

    <div id="financeiro" class="tab-content active">
        <div class="dashboard">
            <div class="card-dash"><h3>Custo Estoque</h3><p id="dash-custo">€ 0.00</p></div>
            <div class="card-dash"><h3>Valor Venda</h3><p id="dash-valor">€ 0.00</p></div>
            <div class="card-dash"><h3>Lucro Previsto</h3><p id="dash-lucro-est">€ 0.00</p></div>
            <div class="card-dash"><h3>Vendas Mês</h3><p id="dash-vendas-mes">€ 0.00</p></div>
            <div class="card-dash"><h3>Lucro Mês</h3><p id="dash-lucro-mes" style="color:var(--verde)">€ 0.00</p></div>
        </div>
        <div class="grafico-box"><canvas id="graficoVendas"></canvas></div>
        <div class="tabela-container">
            <table>
                <thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Total</th><th>Ações</th></tr></thead>
                <tbody id="lista-vendas"></tbody>
            </table>
        </div>
    </div>

    <div id="inventario" class="tab-content">
        <div class="card-form">
            <div class="area-upload" onclick="document.getElementById('file-input').click()">
                <img id="preview-img" style="display:none">
                <span id="label-upload">📸 FOTO</span>
                <input type="file" id="file-input" hidden onchange="processarFoto(this)">
            </div>
            <div class="campos-container">
                <div class="full-width"><input type="text" id="p-nome" placeholder="Nome do Produto"></div>
                <input type="number" id="p-custo" placeholder="Custo €" step="0.01">
                <input type="number" id="p-venda" placeholder="Venda €" step="0.01">
                <input type="number" id="p-stock" placeholder="Stock">
                <div class="full-width"><input type="text" id="p-validade" placeholder="Validade (DD MM YYYY)"></div>
                <button class="btn-salvar" onclick="salvarProduto()">+ Adicionar Produto</button>
            </div>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th width="80">Foto</th>
                        <th>Produto</th>
                        <th width="130">Custo (€)</th>
                        <th width="130">Venda (€)</th>
                        <th width="100">Stock</th>
                        <th width="180">Validade (DD MM YYYY)</th>
                        <th width="50"></th>
                    </tr>
                </thead>
                <tbody id="lista-inventario-tabela"></tbody>
            </table>
        </div>
    </div>
</div>

<input type="file" id="table-file-input" hidden onchange="processarFotoTabela(this)">

<script>
    const API = "https://projeto-loja-dzqv.onrender.com";
    let produtos = [], vendas = [], fotoBase = "", idEditTabela = null;

    async function carregar() {
        const [resP, resV] = await Promise.all([fetch(`${API}/produtos`), fetch(`${API}/vendas`)]);
        produtos = await resP.json(); vendas = await resV.json();
        atualizarDash(); renderizarTabela(); renderizarVendas(); renderizarGrafico();
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function atualizarDash() {
        let cE = 0, vE = 0;
        produtos.forEach(p => { cE += (parseFloat(p.preco_entrada)||0) * p.estoque; vE += p.preco * p.estoque; });
        document.getElementById('dash-custo').innerText = `€ ${cE.toFixed(2)}`;
        document.getElementById('dash-valor').innerText = `€ ${vE.toFixed(2)}`;
        document.getElementById('dash-lucro-est').innerText = `€ ${(vE - cE).toFixed(2)}`;
    }

    function renderizarTabela() {
        const tb = document.getElementById('lista-inventario-tabela'); tb.innerHTML = '';
        produtos.forEach(p => {
            // Lógica de Data DD MM YYYY
            let dExibicao = "";
            if(p.validade && p.validade.includes("-")) {
                const pts = p.validade.split("-"); dExibicao = `${pts[2]} ${pts[1]} ${pts[0]}`;
            } else { dExibicao = p.validade || ""; }

            tb.innerHTML += `
                <tr>
                    <td align="center"><img src="${p.imagem}" class="img-table" onclick="trocarFotoTabela(${p.id})"></td>
                    <td><input type="text" class="input-live" value="${p.nome}" onchange="updateItem(${p.id}, 'nome', this.value)"></td>
                    <td><input type="text" class="input-live" value="${parseFloat(p.preco_entrada||0).toFixed(2)}" onchange="updateItem(${p.id}, 'preco_entrada', this.value)"></td>
                    <td><input type="text" class="input-live" value="${parseFloat(p.preco||0).toFixed(2)}" onchange="updateItem(${p.id}, 'preco', this.value)"></td>
                    <td><input type="text" class="input-live" value="${p.estoque}" onchange="updateItem(${p.id}, 'estoque', this.value)"></td>
                    <td><input type="text" class="input-live" value="${dExibicao}" onchange="updateItemData(${p.id}, this.value)"></td>
                    <td><button onclick="apagarProduto(${p.id})" class="btn-mini">✕</button></td>
                </tr>`;
        });
    }

    async function updateItem(id, campo, valor) {
        const p = produtos.find(x => x.id === id); p[campo] = valor;
        await fetch(`${API}/produtos/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) });
        atualizarDash();
    }

    async function updateItemData(id, valorTexto) {
        const pts = valorTexto.trim().split(" ");
        if (pts.length === 3) {
            const dataISO = `${pts[2]}-${pts[1]}-${pts[0]}`; // Converte DD MM YYYY -> YYYY-MM-DD
            await updateItem(id, 'validade', dataISO);
        } else { alert("Use formato: DD MM YYYY (Ex: 05 12 2026)"); }
    }

    function processarFoto(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { fotoBase = e.target.result; document.getElementById('preview-img').src = fotoBase; document.getElementById('preview-img').style.display='block'; document.getElementById('label-upload').style.display='none'; }; r.readAsDataURL(input.files[0]); } }
    
    function trocarFotoTabela(id) { idEditTabela = id; document.getElementById('table-file-input').click(); }
    function processarFotoTabela(input) { if(input.files[0]) { const r = new FileReader(); r.onload = async (e) => { const p = produtos.find(x => x.id === idEditTabela); p.imagem = e.target.result; await fetch(`${API}/produtos/${idEditTabela}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) }); carregar(); }; r.readAsDataURL(input.files[0]); } }

    async function salvarProduto() {
        let val = document.getElementById('p-validade').value;
        if(val.includes(" ")) { const pts = val.split(" "); val = `${pts[2]}-${pts[1]}-${pts[0]}`; }
        const p = { nome: document.getElementById('p-nome').value, validade: val, preco_entrada: parseFloat(document.getElementById('p-custo').value)||0, preco: parseFloat(document.getElementById('p-venda').value)||0, estoque: parseInt(document.getElementById('p-stock').value)||0, imagem: fotoBase || 'https://placehold.co/300x300?text=Ls' };
        await fetch(`${API}/produtos`, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p) });
        location.reload();
    }

    function renderizarVendas() {
        const tb = document.getElementById('lista-vendas'); tb.innerHTML = '';
        vendas.forEach(v => {
            tb.innerHTML += `<tr><td>${new Date(v.data_venda).toLocaleDateString()}</td><td style="color:var(--gold)">#${v.codigo_pedido}</td><td>${v.cliente_nome}</td><td>€ ${v.total_venda.toFixed(2)}</td><td><button onclick="carregar()">🔄</button></td></tr>`;
        });
    }

    function renderizarGrafico() {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        const dados = new Array(31).fill(0);
        vendas.forEach(v => { const d = new Date(v.data_venda); if(d.getMonth() === new Date().getMonth()) dados[d.getDate()-1] += v.total_venda; });
        new Chart(ctx, { type: 'bar', data: { labels: Array.from({length:31},(_,i)=>i+1), datasets:[{label:'Vendas €', data:dados, backgroundColor:'#cca43b'}]}, options:{responsive:true, maintainAspectRatio:false} });
    }

    async function apagarProduto(id) { if(confirm("Apagar?")) { await fetch(`${API}/produtos/${id}`, {method:'DELETE'}); carregar(); } }
    
    carregar();
</script>
</body>
</html>
