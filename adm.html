<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>ADM | Beleza & Cia</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --rosa: #d63384; --texto: #f8fafc; }
        body { font-family: sans-serif; background: var(--dark); color: var(--texto); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; box-sizing: border-box; }
        button { background: var(--rosa); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .prod-item { background: var(--card); padding: 15px; margin-top: 10px; border-radius: 8px; display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #0f172a; }
        .img-item { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel Administrativo</h1>
        
        <div class="card">
            <input type="hidden" id="edit-id">
            <input type="text" id="nome" placeholder="Nome do Produto">
            <div style="display:flex; gap:10px">
                <input type="number" id="preco_entrada" placeholder="Custo €">
                <input type="number" id="preco" placeholder="Venda €">
            </div>
            <input type="number" id="estoque" placeholder="Stock">
            <input type="text" id="imagem" placeholder="URL da Imagem">
            <button id="btnSalvar" onclick="salvar()">GRAVAR PRODUTO</button>
        </div>

        <div id="lista">A carregar...</div>
    </div>

    <script>
        const API = 'https://projeto-loja-beleza-cia.onrender.com/produtos';

        async function carregar() {
            try {
                const res = await fetch(API);
                const dados = await res.json();
                const div = document.getElementById('lista');
                div.innerHTML = '';
                dados.forEach(p => {
                    div.innerHTML += `
                        <div class="prod-item">
                            <img src="${p.imagem}" class="img-item" onerror="this.src='https://via.placeholder.com/50'">
                            <div style="flex:1"><b>${p.nome}</b><br>Stock: ${p.estoque} | PVP: €${p.preco}</div>
                            <button style="width:auto; margin-right:5px" onclick='preparar(${JSON.stringify(p)})'>✏️</button>
                            <button style="width:auto; background:red" onclick="deletar('${p.id}')">🗑️</button>
                        </div>`;
                });
            } catch (e) { document.getElementById('lista').innerHTML = "Erro de conexão com servidor."; }
        }

        async function salvar() {
            const id = document.getElementById('edit-id').value;
            const p = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                preco_entrada: parseFloat(document.getElementById('preco_entrada').value),
                estoque: parseInt(document.getElementById('estoque').value),
                imagem: document.getElementById('imagem').value
            };
            await fetch(id ? `${API}/${id}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(p)
            });
            location.reload();
        }

        function preparar(p) {
            document.getElementById('edit-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('preco_entrada').value = p.preco_entrada;
            document.getElementById('estoque').value = p.estoque;
            document.getElementById('imagem').value = p.imagem;
            window.scrollTo(0,0);
        }

        async function deletar(id) { if(confirm("Apagar?")) { await fetch(`${API}/${id}`, {method:'DELETE'}); carregar(); } }

        window.onload = carregar;
    </script>
</body>
</html>
