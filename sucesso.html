<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Pedido Confirmado | Lust Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; color: #333; padding: 30px; border-radius: 8px; border-top: 5px solid #cca43b; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .check { font-size: 50px; color: #cca43b; display: block; margin-bottom: 10px; }
        h1 { color: #0f172a; font-family: 'Playfair Display', serif; margin: 0; font-size: 24px; line-height: 1.2; }
        .msg-nice { color: #64748b; margin-top: 5px; font-size: 14px; }
        
        .info-cliente { background: #f1f5f9; padding: 15px; border-radius: 6px; margin-top: 20px; text-align: left; border-left: 3px solid #cca43b; }
        .info-cliente p { margin: 3px 0; font-size: 12px; color: #475569; }
        .info-cliente strong { color: #0f172a; }

        .prazo-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 15px; border-radius: 6px; margin: 15px 0; display: flex; align-items: center; gap: 10px; text-align: left; }
        .prazo-icon { font-size: 24px; }
        
        .resumo-box { border: 1px solid #e2e8f0; padding: 15px; margin: 15px 0; text-align: left; border-radius: 4px; }
        .linha-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; font-size: 12px; }
        .item-info { display: flex; flex-direction: column; }
        .item-meta { font-size: 10px; color: #94a3b8; }
        
        .linha-total { display: flex; justify-content: space-between; margin-top: 10px; font-weight: bold; font-size: 16px; color: #0f172a; padding-top: 10px; border-top: 1px dashed #cbd5e1; }
        
        .btn { display: inline-block; padding: 12px 25px; background: #0f172a; color: white; text-decoration: none; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 12px; margin: 5px 0; cursor: pointer; border: none; width: 100%; box-sizing: border-box; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
        .btn-gold { background: #cca43b; color: #0f172a; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loading" style="padding: 40px; color: #64748b;">
            <div class="check" style="font-size:30px">⏳</div>
            <p>A confirmar pagamento...</p>
        </div>
        
        <div id="conteudo-sucesso" style="display:none;">
            <div class="check">✔</div>
            <h1 id="titulo-sucesso">Pedido Confirmado!</h1>
            <p class="msg-nice">Recebemos a sua encomenda.</p>
            
            <div class="info-cliente">
                <p><strong>PEDIDO:</strong> <span id="display-codigo">...</span></p>
                <p><strong>NOME:</strong> <span id="display-nome">...</span></p>
                <p><strong>EMAIL:</strong> <span id="display-email">...</span></p>
                <p><strong>NIF:</strong> <span id="display-nif">...</span></p>
            </div>

            <div class="prazo-box">
                <span class="prazo-icon">🚚</span>
                <div>
                    <strong style="display:block; font-size:11px; text-transform:uppercase;">Estimativa de Entrega</strong>
                    <span id="prazo-texto" style="font-size:12px;">...</span>
                </div>
            </div>
            
            <div class="resumo-box">
                <div id="lista-itens"></div>
                <div class="linha-total"><span>TOTAL PAGO</span><span id="txt-total" style="color:#cca43b"></span></div>
            </div>
            
            <button onclick="baixarRecibo()" class="btn btn-gold">📄 Baixar Recibo (PDF)</button>
            <a href="loja.html" class="btn btn-outline">Voltar à Loja</a>
        </div>
    </div>

    <script>
        // ⚠️ SUBSTITUA PELO SEU LINK DO RENDER
        const API_URL = "https://projeto-loja-dzqv.onrender.com"; 
        
        const params = new URLSearchParams(window.location.search);
        const codigo = params.get('pedido');
        let dadosVenda = null;
        let tentativas = 0;
        const maxTentativas = 8; // Tenta durante ~16 segundos

        if(codigo) {
            buscarPedido();
        } else { 
            document.getElementById('loading').innerText = "Código inválido."; 
        }

        function buscarPedido() {
            fetch(`${API_URL}/pedido/${codigo}`)
                .then(r => r.json())
                .then(data => {
                    if(data && !data.erro && data.codigo_pedido) {
                        dadosVenda = data;
                        renderizarPagina(data);
                    } else {
                        // Retry Logic (Espera e tenta de novo)
                        tentativas++;
                        if(tentativas < maxTentativas) {
                            setTimeout(buscarPedido, 2000); 
                        } else {
                            document.getElementById('loading').innerHTML = "<span style='color:red'>Erro: O pedido demorou a ser processado.<br>Aguarde 1 min e atualize a página.</span>";
                        }
                    }
                })
                .catch(err => { console.error(err); setTimeout(buscarPedido, 2000); });
        }

        function renderizarPagina(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('conteudo-sucesso').style.display = 'block';
            
            // 1. Preencher Cabeçalho e Cliente
            const primeiroNome = data.cliente_nome.split(' ')[0];
            document.getElementById('titulo-sucesso').innerText = `Obrigado, ${primeiroNome}!`;
            document.getElementById('display-codigo').innerText = `#${data.codigo_pedido}`;
            document.getElementById('display-nome').innerText = data.cliente_nome;
            document.getElementById('display-email').innerText = data.cliente_email;
            document.getElementById('display-nif').innerText = data.nif_cliente || "N/A";

            // 2. Preencher Prazo e Total
            const dias = data.total_frete > 7 ? "1-2 dias úteis" : "2-5 dias úteis";
            document.getElementById('prazo-texto').innerText = `${dias} (${data.pais_destino})`;
            document.getElementById('txt-total').innerText = `€${parseFloat(data.total_venda).toFixed(2)}`;

            // 3. Listar Itens (Simples)
            const divItens = document.getElementById('lista-itens');
            divItens.innerHTML = '';
            
            // Agrupar itens iguais para visualização mais limpa
            const itensAgrupados = {};
            data.itens.forEach(i => {
                const k = i.nome;
                if(!itensAgrupados[k]) itensAgrupados[k] = {qtd:0, preco: i.preco, sku: i.sku};
                itensAgrupados[k].qtd++;
            });

            Object.values(itensAgrupados).forEach(item => {
                // Preço total da linha com IVA
                const taxa = data.taxa_iva_aplicada || 23;
                const totalItem = (item.preco * (1 + taxa/100)) * item.qtd;
                
                divItens.innerHTML += `
                    <div class="linha-item">
                        <div class="item-info">
                            <strong>${item.qtd}x ${item.sku ? '['+item.sku+'] ' : ''}${item.nome}</strong>
                        </div>
                        <span style="font-weight:600">€${totalItem.toFixed(2)}</span>
                    </div>`;
            });
        }

        function baixarRecibo() {
            if(!dadosVenda) return;
            const { jsPDF } = window.jspdf; 
            const doc = new jsPDF(); 
            const v = dadosVenda;
            const taxa = v.taxa_iva_aplicada || 23;

            doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(204, 164, 59); doc.setFontSize(22); doc.text("LUST STORE", 14, 20);
            doc.setTextColor(255, 255, 255); doc.setFontSize(10); doc.text("RECIBO PROVISÓRIO", 14, 28);
            
            doc.setTextColor(0, 0, 0); doc.setFontSize(10);
            doc.text(`Pedido: #${codigo}`, 14, 55); 
            doc.text(`Data: ${new Date().toLocaleDateString()}`, 14, 60);
            
            doc.setFont("helvetica", "bold"); doc.text("DADOS DO CLIENTE:", 14, 70);
            doc.setFont("helvetica", "normal");
            doc.text(`Nome: ${v.cliente_nome}`, 14, 75);
            doc.text(`NIF: ${v.nif_cliente || 'Consumidor Final'}`, 14, 80);
            doc.text(`Tel: ${v.telefone_contato || 'N/A'}`, 14, 85);
            doc.text(`Morada: ${v.cliente_morada || 'N/A'}`, 14, 90);
            
            const body = v.itens.map(i => {
                const base = parseFloat(i.preco);
                const total = base * (1 + taxa/100);
                return [`[${i.sku || '?'}] ${i.nome}`, `€${base.toFixed(2)}`, `${taxa}%`, `€${total.toFixed(2)}`];
            });

            const frete = parseFloat(v.total_frete);
            const freteBase = frete / (1 + taxa/100);
            body.push(['Envio', `€${freteBase.toFixed(2)}`, `${taxa}%`, `€${frete.toFixed(2)}`]);
            body.push([{content: 'TOTAL PAGO', colSpan: 3, styles: {fontStyle: 'bold', halign: 'right'}}, `€${parseFloat(v.total_venda).toFixed(2)}`]);

            doc.autoTable({ 
                startY: 100, 
                head: [['Descrição', 'Base Líquida', 'Taxa', 'Total']], 
                body: body, 
                headStyles: { fillColor: [15, 23, 42], textColor: [204, 164, 59] }, 
                theme: 'grid'
            });

            doc.save(`Recibo_Lust_${codigo}.pdf`);
        }
    </script>
</body>
</html>
