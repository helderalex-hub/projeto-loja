<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Pedido Confirmado | Lust Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; color: #333; padding: 40px; border-radius: 8px; border-top: 5px solid #cca43b; max-width: 400px; width: 90%; }
        h1 { color: #0f172a; margin: 10px 0; }
        .check { font-size: 50px; color: #cca43b; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #0f172a; color: #cca43b; text-decoration: none; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .info { background: #f8fafc; padding: 15px; margin: 20px 0; border-radius: 4px; text-align: left; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✔</div>
        <h1>Lust Store</h1>
        <p style="color:#666; text-transform:uppercase; font-size:12px; letter-spacing:1px">Pedido Confirmado</p>
        
        <div id="loading">A carregar detalhes...</div>

        <div id="detalhes" style="display:none;">
            <div class="info">
                <p><strong>Pedido:</strong> <span id="id-pedido" style="color:#cca43b; font-weight:bold">...</span></p>
                <p><strong>Total:</strong> <span id="total-pedido">...</span></p>
                <p><strong>Cliente:</strong> <span id="nome-cliente">...</span></p>
            </div>
            <small style="color: #94a3b8;">Enviámos um email de confirmação.</small>
        </div>
        
        <br>
        <a href="loja.html" class="btn">Voltar à Loja</a>
    </div>

    <script>
        const API_URL = "https://projeto-loja-dzqv.onrender.com"; 
        const params = new URLSearchParams(window.location.search);
        const codigo = params.get('pedido');

        if(codigo) {
            fetch(`${API_URL}/pedido/${codigo}`)
                .then(r => r.json())
                .then(data => {
                    if(!data.erro) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('detalhes').style.display = 'block';
                        document.getElementById('id-pedido').innerText = `#${codigo}`;
                        document.getElementById('total-pedido').innerText = `€${data.total_venda.toFixed(2)}`;
                        document.getElementById('nome-cliente').innerText = data.cliente_nome;
                    }
                })
                .catch(() => document.getElementById('loading').innerText = "Sucesso! Verifique o seu email.");
        }
    </script>
</body>
</html>
