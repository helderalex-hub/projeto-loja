<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Lust Store | Vitrine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Lust Store | Luxo & Exclusividade">
    <meta property="og:description" content="Descubra a coleção exclusiva de calçado e cosmética premium.">
    <meta property="og:image" content="https://helderalex-hub.github.io/projeto-loja/social-share.jpg">
    <meta property="og:url" content="https://projeto-loja-dzqv.onrender.com">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --dark: #0f172a; 
            --gold: #cca43b; 
            --gold-light: #fcd34d; 
            --texto: #334155; 
            --bg-page: #f8fafc; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-page); 
            color: var(--texto); 
            margin: 0; 
            padding: 0; 
        }
        
        /* BARRA DE PORTES */
        .frete-bar { 
            background: #000; 
            color: var(--gold-light); 
            font-size: 11px; 
            text-align: center; 
            padding: 8px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }
        
        /* CABEÇALHO */
        header { 
            background: var(--dark); 
            padding: 25px; 
            text-align: center; 
            border-bottom: 4px solid var(--gold); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
        }
        
        .header-content { display: flex; flex-direction: column; align-items: center; }
        .logo-img { height: 50px; margin-bottom: 10px; display: block; }
        
        header h1 { 
            margin: 0; 
            font-family: 'Playfair Display', serif; 
            color: white; 
            font-size: 22px; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            font-weight: 400; 
        }
        header h1 span { color: var(--gold); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 15px; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        
        /* CARTÃO DE PRODUTO */
        .produto-card { 
            background: white; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid transparent; 
            position: relative; 
        }
        .produto-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--gold); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
        }
        
        .img-container { 
            width: 100%; 
            height: 280px; 
            background: #f1f5f9; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .img-container img { 
            width: 90%; 
            height: 90%; 
            object-fit: contain; 
            transition: transform 0.5s ease; 
            mix-blend-mode: multiply; 
        }
        .produto-card:hover img { transform: scale(1.08); }
        
        /* ESTADOS ESGOTADO */
        .produto-card.esgotado { opacity: 0.6; pointer-events: none; }
        .produto-card.esgotado img { filter: grayscale(100%); }
        .overlay-esgotado { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.8); 
            color: white; padding: 8px 15px; 
            font-weight: bold; font-size: 12px; 
            border: 1px solid white; display: none; 
        }
        .produto-card.esgotado .overlay-esgotado { display: block; }

        /* INFO PRODUTO */
        .info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .info h3 { margin: 5px 0; font-family: 'Playfair Display', serif; font-size: 17px; color: var(--dark); }
        .marca { font-size: 10px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; font-weight: bold; }
        
        /* CÓDIGO SKU VISÍVEL */
        .sku-display {
            font-size: 10px;
            color: #64748b;
            margin-bottom: 5px;
            font-family: monospace;
            background: #f1f5f9;
            padding: 2px 5px;
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
        }

        .preco { font-size: 19px; color: var(--gold); font-weight: bold; margin: 8px 0; }
        .alerta-estoque { color: #ef4444; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 12px; min-height: 15px; }
        
        /* CONTROLES DE COMPRA */
        .compra-row { display: flex; gap: 10px; margin-top: auto; }
        .qtd-seletor { display: flex; align-items: center; background: #f1f5f9; border-radius: 4px; border: 1px solid #e2e8f0; }
        .qtd-btn { background: transparent; color: var(--dark); border: none; padding: 5px 12px; cursor: pointer; font-weight: bold; height: 100%; }
        .qtd-btn:hover { color: var(--gold); background: var(--dark); }
        
        .btn-comprar { 
            background: var(--dark); color: white; border: none; padding: 12px; 
            border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; 
            text-transform: uppercase; font-size: 11px; letter-spacing: 1px; transition: 0.3s; 
        }
        .btn-comprar:hover { background: var(--gold); color: var(--dark); }
        .btn-comprar:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        
        /* ELEMENTOS FLUTUANTES */
        .floating-container { 
            position: fixed; bottom: 30px; right: 30px; 
            display: flex; flex-direction: column; gap: 15px; 
            z-index: 1000; align-items: flex-end; 
        }
        
        #btn-carrinho { 
            background: var(--gold); color: var(--dark); padding: 15px 30px; 
            border-radius: 50px; font-weight: bold; cursor: pointer; border: none; 
            box-shadow: 0 10px 25px rgba(204, 164, 59, 0.5); 
            text-transform: uppercase; letter-spacing: 1px; display: none; 
        }
        
        .btn-share { 
            width: 50px; height: 50px; border-radius: 50%; 
            background: #25D366; color: white; border: none; 
            cursor: pointer; font-size: 24px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            display: flex; align-items: center; justify-content: center; 
            transition: transform 0.3s; 
        }
        .btn-share:hover { transform: scale(1.1); }
        
        .loading { text-align: center; width: 100%; padding: 50px; color: #94a3b8; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>
    
    <div class="frete-bar">PORTES GRÁTIS: PT > 60€ | ES > 85€ | EUROPA > 125€</div>
    
    <header>
        <div class="header-content">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>Lust Store - <span>Vitrine</span></h1>
        </div>
    </header>

    <div class="container">
        <div id="vitrine" class="vitrine">
            <div class="loading">A CARREGAR COLEÇÃO EXCLUSIVA...</div>
        </div>
    </div>
    
    <div class="floating-container">
        <button class="btn-share" onclick="partilharLoja()" title="Partilhar no WhatsApp">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.017-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
        </button>
        <button id="btn-carrinho" onclick="finalizarCompra()">
            🛒 Finalizar <span id="cart-count">0</span>
        </button>
    </div>
    
    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com';
        let todosProdutos = [];
        let carrinho = [];
        
        async function carregarProdutos() {
            try {
                const res = await fetch(`${API}/produtos`);
                todosProdutos = await res.json();
                renderizarProdutos(todosProdutos);
            } catch(e) { 
                document.getElementById('vitrine').innerHTML = "<p style='text-align:center; width:100%; color:#ef4444'>Erro ao conectar ao servidor.</p>"; 
            }
        }

        function renderizarProdutos(lista) {
            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = '';
            
            if (lista.length === 0) { 
                vitrine.innerHTML = "<p style='text-align:center; width:100%'>Sem produtos disponíveis.</p>"; 
                return; 
            }

            lista.forEach(p => {
                const stock = parseInt(p.estoque) || 0;
                const esgotado = stock <= 0;
                
                let marca = p.marca ? p.marca : "Exclusive";
                let sku = p.sku ? `REF: ${p.sku}` : '';

                let alertaHTML = esgotado ? '<span style="color:#94a3b8">Indisponível</span>' : (stock < 5 ? `⚠️ Restam apenas ${stock} un!` : '');
                
                vitrine.innerHTML += `
                    <div class="produto-card ${esgotado ? 'esgotado' : ''}">
                        <div class="img-container">
                            <img src="${p.imagem || ''}" onerror="this.src='https://placehold.co/300x300?text=Lust'">
                            <div class="overlay-esgotado">ESGOTADO</div>
                        </div>
                        <div class="info">
                            <span class="marca">${marca}</span>
                            <h3>${p.nome}</h3>
                            ${sku ? `<div class="sku-display">${sku}</div>` : ''}
                            <div class="preco">€${parseFloat(p.preco).toFixed(2)}</div>
                            <div class="alerta-estoque">${alertaHTML}</div>
                            <div class="compra-row">
                                <div class="qtd-seletor">
                                    <button class="qtd-btn" onclick="mudarQtd('${p.id}', -1)">−</button>
                                    <span id="qtd-${p.id}" style="width:20px; text-align:center; font-size:12px;">1</span>
                                    <button class="qtd-btn" onclick="mudarQtd('${p.id}', 1, ${stock})">+</button>
                                </div>
                                <button class="btn-comprar" ${esgotado ? 'disabled' : ''} onclick="addCarrinho('${p.id}', '${p.nome}', ${p.preco})">${esgotado ? 'Esgotado' : 'Comprar'}</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function mudarQtd(id, delta, max) { 
            let el = document.getElementById(`qtd-${id}`);
            let novo = parseInt(el.innerText) + delta; 
            if (novo >= 1 && (max === undefined || novo <= max)) el.innerText = novo; 
        }

        function addCarrinho(id, nome, preco) { 
            const qtd = parseInt(document.getElementById(`qtd-${id}`).innerText); 
            for(let i=0; i<qtd; i++) carrinho.push({id, nome, preco}); 
            
            document.getElementById('cart-count').innerText = carrinho.length;
            document.getElementById('btn-carrinho').style.display = 'block';

            const btn = event.target; 
            const textoOriginal = btn.innerText;
            btn.innerText = "Adicionado!"; 
            btn.style.background = "#cca43b"; btn.style.color = "#000";
            
            setTimeout(() => { 
                btn.innerText = textoOriginal; 
                btn.style.background = ""; 
                btn.style.color = ""; 
                document.getElementById(`qtd-${id}`).innerText = 1; 
            }, 1000); 
        }

        async function finalizarCompra() { 
            if (!carrinho.length) return alert("Carrinho vazio!"); 
            const btn = document.getElementById('btn-carrinho'); 
            const txtOriginal = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = "A PROCESSAR...";
            
            try {
                const res = await fetch(`${API}/checkout`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify(carrinho) 
                }); 
                const d = await res.json(); 
                if(d.url) window.location.href = d.url; 
                else throw new Error("Sem URL");
            } catch(e) { 
                alert("Erro ao conectar."); 
                btn.disabled = false; 
                btn.innerHTML = txtOriginal; 
            }
        }

        function partilharLoja() {
            const texto = "Confira as novidades exclusivas da Lust Store! 💎";
            const url = encodeURIComponent(window.location.href);
            window.open(`https://wa.me/?text=${texto} ${url}`, '_blank');
        }
        
        window.onload = carregarProdutos;
    </script>
</body>
</html>
