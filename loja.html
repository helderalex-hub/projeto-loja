<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Lust Store | Sistema de Gestão</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if (localStorage.getItem('token_gerente') !== 'logado_sucesso_servidor') window.location.href = 'login-adm.html';</script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --dark: #0f172a; --card: #1e293b; --gold: #cca43b; --texto: #f8fafc; --borda: #334155; 
            --verde: #10b981; --erro: #ef4444; 
            --campo-branco: #ffffff; /* Fundo totalmente branco para edição */
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding-bottom: 50px; }
        
        .header-top { text-align: center; margin-bottom: 20px; }
        .logo-adm { height: 50px; margin-bottom: 10px; }
        h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 22px; color: white; text-transform: uppercase; }
        h1 span { color: var(--gold); }
        
        .tabs { display: flex; justify-content: center; gap: 5px; margin-bottom: 30px; border-bottom: 1px solid var(--borda); }
        .tab-btn { background: none; border: none; color: #94a3b8; padding: 15px 30px; cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); border-bottom: 3px solid var(--gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        /* DASHBOARD */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-dash { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--borda); text-align: center; border-bottom: 3px solid var(--gold); }
        .card-dash h3 { margin: 0; font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .card-dash p { margin: 8px 0 0; font-size: 18px; font-weight: bold; }

        /* CAMPOS EDITÁVEIS NA TABELA (BRANCOS E SEM SETAS) */
        .input-live { 
            background: var(--campo-branco) !important; 
            border: 2px solid #cbd5e1 !important; 
            padding: 8px !important; 
            color: #000000 !important; /* Texto preto para ler bem no branco */
            width: 100%; 
            font-size: 14px !important; 
            font-weight: bold !important;
            border-radius: 4px; 
            box-sizing: border-box;
            text-align: center;
        }
        .input-live:focus { border-color: var(--gold) !important; outline: none; background: #fff !important; }

        /* REMOVER SETAS DE INPUT NUMBER */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .tabela-container { background: var(--card); border-radius: 8px; border: 1px solid var(--borda); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { text-align: left; padding: 12px; color: var(--gold); border-bottom: 1px solid var(--borda); text-transform: uppercase; font-size: 10px; }
        td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .img-table { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 4px; cursor: pointer; border: 1px solid var(--borda); }

        .btn-mini { background: none; border: 1px solid var(--borda); color: #94a3b8; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .grafico-box { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--borda); height: 300px; margin-bottom: 30px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <img src="logo.png" class="logo-adm" onerror="this.style.display='none'">
        <h1>Lust Store - <span>Gestão Lust</span></h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('financeiro')">📈 Financeiro</button>
        <button class="tab-btn" onclick="openTab('inventario')">📦 Inventário</button>
    </div>

    <div id="financeiro" class="tab-content active">
        <div class="dashboard">
            <div class="card-dash"><h3>Custo Estoque</h3><p id="dash-custo">€0.00</p></div>
            <div class="card-dash"><h3>Valor Estimado</h3><p id="dash-valor">€0.00</p></div>
            <div class="card-dash"><h3>Lucro Estimado</h3><p id="dash-lucro-est">€0.00</p></div>
            <div class="card-dash"><h3>Vendas Mês</h3><p id="dash-vendas-mes">€0.00</p></div>
            <div class="card-dash"><h3>Lucro Mês</h3><p id="dash-lucro-mes" style="color:var(--verde)">€0.00</p></div>
        </div>
        <div class="grafico-box"><canvas id="graficoVendas"></canvas></div>
        <div class="tabela-container">
            <table>
                <thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Total</th><th>Ações</th></tr></thead>
                <tbody id="lista-vendas"></tbody>
            </table>
        </div>
    </div>

    <div id="inventario" class="tab-content">
        <div style="background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--borda); display: flex; gap: 20px;">
             <div onclick="document.getElementById('file-input').click()" style="width: 100px; height: 100px; border: 1px dashed var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <img id="preview-img" style="max-width: 100%; max-height: 100%; display: none;">
                <span id="label-up" style="font-size: 10px; color: var(--gold);">+ FOTO</span>
                <input type="file" id="file-input" hidden onchange="processarFoto(this)">
             </div>
             <div style="flex: 1; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px;">
                <input type="text" id="p-nome" placeholder="Nome do Produto">
                <input type="number" id="p-custo" placeholder="Custo €">
                <input type="number" id="p-venda" placeholder="Venda €">
                <input type="number" id="p-stock" placeholder="Stock">
                <button onclick="salvarProduto()" style="grid-column: span 4; background: var(--gold); border: none; padding: 10px; font-weight: bold; cursor: pointer;">CADASTRAR NOVO PRODUTO</button>
             </div>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th width="80">Foto</th>
                        <th>Nome</th>
                        <th width="130">Custo (€)</th>
                        <th width="130">Venda (€)</th>
                        <th width="100">Stock</th>
                        <th width="160">Validade</th>
                        <th width="50"></th>
                    </tr>
                </thead>
                <tbody id="lista-inventario-tabela"></tbody>
            </table>
        </div>
    </div>
</div>

<input type="file" id="table-file-input" hidden onchange="processarFotoTabela(this)">

<script>
    const API = "https://projeto-loja-dzqv.onrender.com";
    let produtos = [], vendas = [], fotoBase64 = "", itemSendoEditado = null;

    async function iniciar() {
        const [resP, resV] = await Promise.all([fetch(`${API}/produtos`), fetch(`${API}/vendas`)]);
        produtos = await resP.json(); vendas = await resV.json();
        atualizarDash(); renderizarVendas(); renderizarInventario(); renderizarGrafico();
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function fmtEur(v) { return `€${parseFloat(v || 0).toFixed(2)}`; }

    function atualizarDash() {
        let custo = 0, valor = 0;
        produtos.forEach(p => { custo += (parseFloat(p.preco_entrada) || 0) * p.estoque; valor += p.preco * p.estoque; });
        const hoje = new Date();
        let vMes = 0, lMes = 0;
        vendas.forEach(v => {
            const dv = new Date(v.data_venda);
            if(dv.getMonth() === hoje.getMonth()) { vMes += v.total_venda; lMes += v.lucro; }
        });
        document.getElementById('dash-custo').innerText = fmtEur(custo);
        document.getElementById('dash-valor').innerText = fmtEur(valor);
        document.getElementById('dash-lucro-est').innerText = fmtEur(valor - custo);
        document.getElementById('dash-vendas-mes').innerText = fmtEur(vMes);
        document.getElementById('dash-lucro-mes').innerText = fmtEur(lMes);
    }

    function renderizarInventario() {
        const tbody = document.getElementById('lista-inventario-tabela');
        tbody.innerHTML = '';
        produtos.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td align="center"><img src="${p.imagem}" class="img-table" onclick="trocarFotoTabela(${p.id})"></td>
                    <td><input type="text" class="input-live" value="${p.nome}" onchange="updateItem(${p.id}, 'nome', this.value)"></td>
                    <td><input type="number" class="input-live" step="0.01" value="${parseFloat(p.preco_entrada).toFixed(2)}" onchange="updateItem(${p.id}, 'preco_entrada', this.value)"></td>
                    <td><input type="number" class="input-live" step="0.01" value="${parseFloat(p.preco).toFixed(2)}" onchange="updateItem(${p.id}, 'preco', this.value)"></td>
                    <td><input type="number" class="input-live" value="${p.estoque}" onchange="updateItem(${p.id}, 'estoque', this.value)"></td>
                    <td><input type="date" class="input-live" value="${p.validade || ''}" onchange="updateItem(${p.id}, 'validade', this.value)"></td>
                    <td><button onclick="apagarProduto(${p.id})" class="btn-mini" style="border:none">✕</button></td>
                </tr>`;
        });
    }

    async function updateItem(id, campo, valor) {
        const p = produtos.find(x => x.id === id);
        p[campo] = valor;
        await fetch(`${API}/produtos/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
        atualizarDash();
    }

    function trocarFotoTabela(id) { itemSendoEditado = id; document.getElementById('table-file-input').click(); }
    function processarFotoTabela(input) {
        if(input.files && input.files[0]) {
            const r = new FileReader();
            r.onload = async (e) => {
                const p = produtos.find(x => x.id === itemSendoEditado);
                p.imagem = e.target.result;
                await fetch(`${API}/produtos/${itemSendoEditado}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
                renderizarInventario();
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    function processarFoto(input) {
        if(input.files && input.files[0]) {
            const r = new FileReader();
            r.onload = e => { fotoBase64 = e.target.result; document.getElementById('preview-img').src = fotoBase64; document.getElementById('preview-img').style.display='block'; document.getElementById('label-up').style.display='none'; };
            r.readAsDataURL(input.files[0]);
        }
    }

    async function salvarProduto() {
        const p = { nome: document.getElementById('p-nome').value, preco_entrada: parseFloat(document.getElementById('p-custo').value) || 0, preco: parseFloat(document.getElementById('p-venda').value) || 0, estoque: parseInt(document.getElementById('p-stock').value) || 0, imagem: fotoBase64 || 'https://placehold.co/300x300?text=Lust' };
        await fetch(`${API}/produtos`, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p) });
        location.reload();
    }

    function renderizarVendas() {
        const tb = document.getElementById('lista-vendas'); tb.innerHTML = '';
        vendas.forEach(v => {
            tb.innerHTML += `<tr>
                <td>${new Date(v.data_venda).toLocaleDateString()}</td>
                <td style="color:var(--gold)">#${v.codigo_pedido}</td>
                <td>${v.cliente_nome}</td>
                <td>${fmtEur(v.total_venda)}</td>
                <td><button onclick="gerarEtiqueta('${v.codigo_pedido}')" style="border:none; background:none; cursor:pointer">📦</button></td>
            </tr>`;
        });
    }

    function renderizarGrafico() {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        const hoje = new Date();
        const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
        const dados = new Array(diasNoMes).fill(0);
        vendas.forEach(v => {
            const d = new Date(v.data_venda);
            if(d.getMonth() === hoje.getMonth()) dados[d.getDate()-1] += v.total_venda;
        });
        new Chart(ctx, { type: 'bar', data: { labels: Array.from({length: diasNoMes}, (_, i) => i + 1), datasets:[{ label:'Vendas €', data:dados, backgroundColor:'#cca43b' }] }, options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#334155'}, ticks:{color:'#94a3b8'}}, x:{ticks:{color:'#94a3b8'}} } } });
    }

    async function apagarProduto(id) { if(confirm("Apagar?")) { await fetch(`${API}/produtos/${id}`, {method:'DELETE'}); iniciar(); } }

    function gerarEtiqueta(cod) {
        const v = vendas.find(x => x.codigo_pedido === cod);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ format:[100, 150], unit:'mm' });
        doc.text("DESTINATÁRIO:", 5, 45);
        doc.text(v.cliente_nome, 5, 53);
        doc.text(doc.splitTextToSize(v.cliente_morada, 90), 5, 62);
        doc.save(`Etiqueta_${cod}.pdf`);
    }

    iniciar();
</script>
</body>
</html>
