<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Lust Store | Vitrine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #0f172a; --gold: #cca43b; --gold-light: #fcd34d; --texto: #334155; --bg-page: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-page); color: var(--texto); margin: 0; }
        .frete-bar { background: #000; color: var(--gold-light); font-size: 11px; text-align: center; padding: 8px; font-weight: bold; letter-spacing: 1px; }
        header { background: var(--dark); padding: 20px 30px; border-bottom: 4px solid var(--gold); position: sticky; top:0; z-index:100; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-family: 'Playfair Display', serif; color: white; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; }
        .cart-trigger { position: relative; cursor: pointer; color: white; }
        .cart-badge { position: absolute; top: -5px; right: -8px; background: var(--gold); color: var(--dark); font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        /* SIDE CART */
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 998; opacity: 0; visibility: hidden; transition: 0.3s; }
        .cart-overlay.open { opacity: 1; visibility: visible; }
        .side-cart { position: fixed; top: 0; right: 0; width: 100%; max-width: 400px; height: 100vh; background: white; z-index: 999; transform: translateX(100%); transition: 0.3s; display: flex; flex-direction: column; }
        .side-cart.open { transform: translateX(0); }
        .cart-header { background: var(--dark); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); }
        .cart-body { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-footer { padding: 20px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
        
        .input-end { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; margin-top: 5px; box-sizing: border-box; }
        .country-select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; background: white; font-weight: bold; color: var(--dark); }
        
        .cart-row { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; margin-bottom: 5px; }
        .cart-row.total { font-size: 18px; font-weight: bold; color: var(--dark); margin-top: 10px; padding-top: 10px; border-top: 1px dashed #cbd5e1; }
        .btn-checkout { width: 100%; padding: 15px; background: var(--dark); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-checkout:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* PRODUTOS */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 15px; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        .produto-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: 0.3s; border: 1px solid transparent; }
        .produto-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .img-container { width: 100%; height: 280px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 90%; height: 90%; object-fit: contain; mix-blend-mode: multiply; }
        .info { padding: 20px; }
        .btn-comprar { background: var(--dark); color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .floating-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 1000; align-items: flex-end; }
        #btn-carrinho-float { background: var(--gold); color: var(--dark); padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; box-shadow: 0 10px 25px rgba(204, 164, 59, 0.5); }
    </style>
</head>
<body>
    <div id="frete-bar" class="frete-bar">A CARREGAR OFERTAS...</div>
    <header>
        <div class="header-content"><h1>Lust Store</h1></div>
        <div class="cart-trigger" onclick="toggleCart()">
            🛒 <div class="cart-badge" id="header-cart-count">0</div>
        </div>
    </header>

    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="side-cart" id="side-cart">
        <div class="cart-header"><h2>Seu Carrinho</h2><button class="close-cart" onclick="toggleCart()">×</button></div>
        <div class="cart-body" id="cart-items"><p class="empty-msg" style="text-align:center; margin-top:50px; color:#999;">O seu carrinho está vazio.</p></div>
        <div class="cart-footer">
            <div style="background: #f8fafc; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #e2e8f0;">
                <label style="font-size: 10px; text-transform: uppercase; font-weight: bold; color: #64748b;">📍 Dados de Envio</label>
                
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <select id="pais-destino" class="country-select" style="margin:0; flex: 1;" onchange="validarEAtualizarFrete()">
                        <option value="PT">🇵🇹 Portugal</option>
                        <option value="ES">🇪🇸 Espanha</option>
                        <optgroup label="🇪🇺 Europa">
                            <option value="FR">🇫🇷 França</option>
                            <option value="DE">🇩🇪 Alemanha</option>
                            <option value="IT">🇮🇹 Itália</option>
                            <option value="NL">🇳🇱 Holanda</option>
                        </optgroup>
                    </select>
                    <input type="text" id="cp-destino" placeholder="CP (ex: 1000)" class="input-end" style="width: 80px; margin:0;" onkeyup="validarEAtualizarFrete()">
                </div>
                
                <input type="text" id="cidade-destino" placeholder="Cidade" class="input-end" onkeyup="validarEAtualizarFrete()">
                <input type="text" id="rua-destino" placeholder="Morada (Rua, Nº, Andar)" class="input-end" onkeyup="validarEAtualizarFrete()">
                <input type="tel" id="tel-destino" placeholder="Telefone (Obrigatório)" class="input-end" onkeyup="validarEAtualizarFrete()">
                <input type="text" id="nif-destino" placeholder="NIF (Opcional)" class="input-end">
            </div>

            <div id="opcoes-frete-container" style="display:none; margin-bottom: 15px;">
                <label style="font-size: 10px; text-transform: uppercase; font-weight: bold; color: #64748b;">🚚 Método de Envio</label>
                <div id="lista-radios-frete" style="margin-top: 5px; display: flex; flex-direction: column; gap: 8px;"></div>
            </div>

            <div class="cart-row"><span>Subtotal (Base)</span><span id="cart-subtotal">€0.00</span></div>
            <div class="cart-row"><span id="cart-tax-label">IVA (23%)</span><span id="cart-tax-val">€0.00</span></div>
            <div class="cart-row"><span style="color:#cca43b">Frete</span><span id="cart-shipping-val" style="color:#cca43b">Calculando...</span></div>
            <div class="cart-row total"><span>Total Final</span><span id="cart-total-val">€0.00</span></div>
            <button class="btn-checkout" onclick="finalizarCompra()" id="btn-checkout" disabled>Preencha os Dados</button>
        </div>
    </div>

    <div class="container"><div id="vitrine" class="vitrine"><div class="loading">A CARREGAR...</div></div></div>
    
    <div class="floating-container">
        <button id="btn-carrinho-float" onclick="toggleCart()">🛒 Ver Carrinho <span id="cart-count">0</span></button>
    </div>
    
    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com';
        let todosProdutos = [], carrinho = [], taxasPorPais = [], configFrete = {};
        let freteSelecionado = { valor: 0, tier: 'std' };

        async function carregarProdutos() {
            try {
                const [resP, resC, resT] = await Promise.all([fetch(`${API}/produtos`), fetch(`${API}/config`), fetch(`${API}/taxas`)]);
                todosProdutos = await resP.json();
                configFrete = await resC.json();
                taxasPorPais = await resT.json();
                if(!taxasPorPais.length) taxasPorPais = [{pais_iso: 'PT', taxa_percentual: 23}, {pais_iso: 'ES', taxa_percentual: 21}, {pais_iso: 'FR', taxa_percentual: 20}];
                if(configFrete.pt_free) document.getElementById('frete-bar').innerText = `PORTES GRÁTIS: PT > €${configFrete.pt_free} | ES > €${configFrete.es_free} | EUROPA > €${configFrete.eu_free}`;
                renderizarProdutos(todosProdutos); 
            } catch(e) { document.getElementById('vitrine').innerHTML = "<p style='text-align:center; width:100%; color:#ef4444'>Erro API.</p>"; }
        }

        function renderizarProdutos(lista) {
            const vitrine = document.getElementById('vitrine'); vitrine.innerHTML = '';
            lista.forEach(p => {
                const stock = parseInt(p.estoque) || 0; 
                if (stock <= 0) return; // Não mostra esgotados
                vitrine.innerHTML += `
                    <div class="produto-card">
                        <div class="img-container"><img src="${p.imagem || 'https://placehold.co/300x300'}" onerror="this.src='https://placehold.co/300x300'"></div>
                        <div class="info">
                            <span style="font-size:10px; color:#999">${p.marca || 'Lust'}</span>
                            <h3>${p.nome}</h3>
                            <div class="preco">€${parseFloat(p.preco).toFixed(2)} <span style="font-size:10px; color:#999;">+ IVA</span></div>
                            <button class="btn-comprar" onclick="addCarrinho('${p.id}', '${p.nome}', ${p.preco}, '${p.sku}', '${p.imagem}', ${stock})">Comprar</button>
                        </div>
                    </div>`;
            });
        }

        function toggleCart() { 
            const s = document.getElementById('side-cart'); 
            const o = document.getElementById('cart-overlay'); 
            const f = document.querySelector('.floating-container');
            s.classList.toggle('open'); o.classList.toggle('open');
            f.style.display = s.classList.contains('open') ? 'none' : 'flex'; // Esconde botão flutuante
        }

        function addCarrinho(id, nome, preco, sku, img, stockMax) { 
            const item = carrinho.find(i => i.id == id);
            if (item) { if(item.qtd < stockMax) item.qtd++; else alert("Stock Max."); } 
            else carrinho.push({id, nome, preco: parseFloat(preco), sku, imagem: img, qtd: 1, max: stockMax});
            validarEAtualizarFrete(); toggleCart();
        }

        function validarEAtualizarFrete() {
            if (carrinho.length === 0) { atualizarCarrinhoUI(); return; }

            const pais = document.getElementById('pais-destino').value;
            const cp = document.getElementById('cp-destino').value.trim();
            const cidade = document.getElementById('cidade-destino').value.trim();
            const rua = document.getElementById('rua-destino').value.trim();
            const tel = document.getElementById('tel-destino').value.trim();
            
            const containerOpcoes = document.getElementById('opcoes-frete-container');
            const listaRadios = document.getElementById('lista-radios-frete');
            const btn = document.getElementById('btn-checkout');

            // Validação Completa
            let cpValido = (pais === 'PT') ? /^\d{4}/.test(cp) : cp.length >= 3;
            const tudoPreenchido = cpValido && cidade.length > 2 && rua.length > 5 && tel.length > 6;

            if (!tudoPreenchido) {
                containerOpcoes.style.display = 'none';
                btn.disabled = true;
                btn.innerText = "Preencha Dados + Tel";
                atualizarCarrinhoUI();
                return;
            }

            // Calcular Total Produtos (Com IVA)
            const taxaObj = taxasPorPais.find(t => t.pais_iso === pais);
            const taxa = taxaObj ? taxaObj.taxa_percentual : 23;
            let totalProdComImposto = 0;
            carrinho.forEach(i => { totalProdComImposto += (i.preco * (1 + taxa/100)) * i.qtd; });

            // Custos
            let custoStd = 0, custoExp = 0, limitFree = 999;
            let labelStd = "Normal", labelExp = "Expresso";

            if (pais === 'PT') {
                limitFree = configFrete.pt_free || 60;
                if (cp.startsWith('9')) { // Ilhas
                    custoStd = (configFrete.pt_std || 4.5) + 2; custoExp = (configFrete.pt_exp || 8) + 4;
                    labelStd = "Ilhas (Marítimo)"; labelExp = "Ilhas (Aéreo)";
                } else { // Continente
                    custoStd = configFrete.pt_std || 4.5; custoExp = configFrete.pt_exp || 8;
                    labelStd = "Continente (CTT)"; labelExp = "Urgente (24h)";
                }
            } else if (pais === 'ES') {
                limitFree = configFrete.es_free || 85; custoStd = configFrete.es_std || 6; custoExp = configFrete.es_exp || 10;
            } else {
                limitFree = configFrete.eu_free || 125; custoStd = configFrete.eu_std || 12; custoExp = configFrete.eu_exp || 25;
            }

            if (totalProdComImposto >= limitFree) custoStd = 0;

            // Render Opções
            containerOpcoes.style.display = 'block';
            const radios = document.getElementsByName('frete_option');
            let selectedTier = 'std';
            for(let r of radios) if(r.checked) selectedTier = r.value;

            listaRadios.innerHTML = `
                <label style="display:flex; justify-content:space-between; padding:10px; border:1px solid #e2e8f0; border-radius:4px; margin-bottom:5px;">
                    <div><input type="radio" name="frete_option" value="std" ${selectedTier==='std'?'checked':''} onchange="validarEAtualizarFrete()"> <b>${labelStd}</b></div>
                    <span style="color:${custoStd===0 ? '#166534' : '#0f172a'}">${custoStd===0 ? 'GRÁTIS' : '€'+custoStd.toFixed(2)}</span>
                </label>
                <label style="display:flex; justify-content:space-between; padding:10px; border:1px solid #e2e8f0; border-radius:4px;">
                    <div><input type="radio" name="frete_option" value="exp" ${selectedTier==='exp'?'checked':''} onchange="validarEAtualizarFrete()"> <b>${labelExp}</b></div>
                    <span>€${custoExp.toFixed(2)}</span>
                </label>`;

            freteSelecionado = { tier: selectedTier, valor: selectedTier === 'std' ? custoStd : custoExp };
            btn.disabled = false;
            btn.innerText = "FINALIZAR COMPRA";
            
            atualizarCarrinhoUI(taxa, totalProdComImposto, freteSelecionado.valor);
        }

        function atualizarCarrinhoUI(taxa, totalComImposto, valorFrete) {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('header-cart-count');
            const floatCount = document.getElementById('cart-count'); // Corrigido erro de referencia
            
            if (!carrinho.length) {
                container.innerHTML = '<p class="empty-msg" style="text-align:center; margin-top:50px;">Vazio</p>';
                document.getElementById('opcoes-frete-container').style.display='none';
                document.getElementById('cart-total-val').innerText = '€0.00';
                return;
            }

            container.innerHTML = '';
            let totalCount = 0;
            carrinho.forEach(item => {
                totalCount += item.qtd;
                container.innerHTML += `<div class="cart-item" style="display:flex; gap:10px; margin-bottom:10px;"><img src="${item.imagem}" style="width:50px;"><div class="item-details"><span class="item-name" style="font-weight:bold">${item.nome}</span><br><span class="item-price">€${item.preco.toFixed(2)}</span> x ${item.qtd}</div></div>`;
            });
            
            badge.innerText = totalCount;
            if(floatCount) floatCount.innerText = totalCount;

            if (taxa === undefined) return;

            const totalBase = totalComImposto / (1 + taxa/100);
            const totalIVA = totalComImposto - totalBase;
            const totalFinal = totalComImposto + valorFrete;

            document.getElementById('cart-subtotal').innerText = `€${totalBase.toFixed(2)}`;
            document.getElementById('cart-tax-label').innerText = `IVA (${taxa}%)`;
            document.getElementById('cart-tax-val').innerText = `€${totalIVA.toFixed(2)}`;
            document.getElementById('cart-shipping-val').innerText = `€${valorFrete.toFixed(2)}`;
            document.getElementById('cart-total-val').innerText = `€${totalFinal.toFixed(2)}`;
        }

        async function finalizarCompra() { 
            const btn = document.getElementById('btn-checkout'); 
            const pais = document.getElementById('pais-destino').value;
            const cp = document.getElementById('cp-destino').value;
            const cidade = document.getElementById('cidade-destino').value;
            const rua = document.getElementById('rua-destino').value;
            const tel = document.getElementById('tel-destino').value;
            const nif = document.getElementById('nif-destino').value;
            const moradaCompleta = `${rua}, ${cidade}`;

            btn.disabled = true; btn.innerText = "A PROCESSAR...";
            
            let itensParaBackend = [];
            carrinho.forEach(item => { for(let k=0; k<item.qtd; k++) itensParaBackend.push({ id: item.id, nome: item.nome, preco: item.preco, sku: item.sku }); });

            try { 
                const res = await fetch(`${API}/checkout`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ 
                        itens: itensParaBackend, 
                        pais: pais, 
                        zip: cp, 
                        tier: freteSelecionado.tier,
                        address: moradaCompleta,
                        city: cidade,
                        phone: tel,
                        nif: nif 
                    }) 
                }); 
                const d = await res.json(); 
                if(d.url) window.location.href = d.url; else throw new Error("Sem URL"); 
            } catch(e) { alert("Erro ao conectar."); btn.disabled = false; btn.innerText = "FINALIZAR COMPRA"; } 
        }

        window.onload = carregarProdutos;
    </script>
</body>
</html>
