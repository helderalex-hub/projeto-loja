<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lust Store | Luxo & Exclusividade</title>
    
    <meta name="description" content="Lust Store - Cosméticos e Calçado de Luxo.">
    <meta property="og:title" content="Lust Store | Luxo & Exclusividade">
    <meta property="og:image" content="https://helderalex-hub.github.io/projeto-loja/social-share.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #cca43b;
            --dark: #0f172a;
            --text: #334155;
            --bg-page: #f8fafc;
            --danger: #ef4444; /* Vermelho para avisos */
        }

        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-page); margin: 0; color: var(--text); }
        
        /* HEADER */
        header { background-color: var(--dark); padding: 25px 20px; text-align: center; border-bottom: 4px solid var(--gold); }
        .logo-img { height: 60px; display: block; margin: 0 auto 10px; }
        .slogan { color: #94a3b8; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }

        /* FILTROS */
        .filtros { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .btn-filtro { padding: 8px 20px; border: 1px solid #e2e8f0; background: white; cursor: pointer; border-radius: 30px; font-size: 13px; text-transform: uppercase; transition: 0.3s; }
        .btn-filtro:hover, .btn-filtro.ativo { background-color: var(--dark); color: var(--gold); border-color: var(--dark); }

        /* GRID */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        
        /* PRODUTO CARD */
        .produto { 
            background: #fff; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); 
            transition: transform 0.3s; border: 1px solid transparent;
            display: flex; flex-direction: column; position: relative;
        }
        .produto:hover { transform: translateY(-5px); border-color: var(--gold); }
        
        .img-container { width: 100%; height: 280px; overflow: hidden; background: #f1f5f9; position: relative; }
        .produto img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        
        /* ESTADO ESGOTADO (PRETO E BRANCO) */
        .produto.esgotado { opacity: 0.8; }
        .produto.esgotado img { filter: grayscale(100%); }
        .produto.esgotado .img-container::after {
            content: "ESGOTADO";
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            font-weight: bold; letter-spacing: 2px; border: 1px solid white;
        }

        .info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .produto h3 { font-family: 'Playfair Display', serif; font-size: 18px; margin: 0 0 5px; color: var(--dark); }
        .marca { font-size: 10px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }
        
        .preco-box { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .preco { font-size: 18px; font-weight: bold; color: var(--gold); }
        
        /* AVISOS DE STOCK */
        .aviso-stock { font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .poucas-unidades { color: var(--danger); animation: pulsar 1.5s infinite; }
        @keyframes pulsar { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* BOTÕES */
        .btn-comprar { 
            background-color: var(--dark); color: white; border: none; padding: 12px; width: 100%; 
            cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: bold; 
            margin-top: 15px; border-radius: 4px; transition: 0.3s; 
        }
        .btn-comprar:hover { background-color: var(--gold); color: var(--dark); }
        .btn-comprar:disabled { background-color: #cbd5e1; cursor: not-allowed; color: #64748b; }

        /* CARRINHO */
        #carrinho-flutuante { 
            position: fixed; bottom: 30px; right: 30px; background: var(--gold); color: var(--dark); 
            padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(204, 164, 59, 0.5); display: none; z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="LUST STORE" class="logo-img" onerror="this.style.display='none'">
        <span class="slogan">Premium Beauty & Care</span>
    </header>

    <div class="filtros">
        <button class="btn-filtro ativo" onclick="filtrar('todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrar('Nike')">Nike</button>
        <button class="btn-filtro" onclick="filtrar('Adidas')">Adidas</button>
        <button class="btn-filtro" onclick="filtrar('Puma')">Puma</button>
        <button class="btn-filtro" onclick="filtrar('NB')">New Balance</button>
    </div>

    <div class="container">
        <div id="lista-produtos" class="grid">
            <p style="text-align:center; width:100%; color:#94a3b8">A carregar coleção...</p>
        </div>
    </div>

    <div id="carrinho-flutuante" onclick="checkout()">
        🛒 Finalizar (<span id="contagem">0</span>)
    </div>

    <script>
        // --- SEU BACKEND ---
        const API_URL = "https://lust-store-backend.onrender.com"; 
        
        let todosProdutos = [];
        let carrinho = [];

        async function carregarProdutos() {
            try {
                const res = await fetch(`${API_URL}/produtos`);
                todosProdutos = await res.json();
                renderizarProdutos(todosProdutos);
            } catch (e) {
                document.getElementById('lista-produtos').innerHTML = '<p style="text-align:center">Erro de conexão.</p>';
            }
        }

        function renderizarProdutos(lista) {
            const div = document.getElementById('lista-produtos');
            div.innerHTML = '';

            if (lista.length === 0) {
                div.innerHTML = '<p style="text-align:center; width:100%">Nenhum item encontrado.</p>';
                return;
            }

            lista.forEach(p => {
                // LÓGICA DE STOCK INTELIGENTE
                const semStock = p.estoque <= 0;
                const poucoStock = p.estoque > 0 && p.estoque < 4; // Menos de 4 unidades avisa
                
                // Classes CSS dinâmicas
                const classeCard = semStock ? 'produto esgotado' : 'produto';
                const textoBotao = semStock ? 'Indisponível' : 'Adicionar ao Carrinho';
                const estadoBotao = semStock ? 'disabled' : '';
                
                // Mensagem de Aviso
                let htmlAviso = '';
                if (semStock) htmlAviso = '<span class="aviso-stock" style="color:#64748b">Esgotado</span>';
                else if (poucoStock) htmlAviso = '<span class="aviso-stock poucas-unidades">⚡ Últimas Unidades!</span>';
                else htmlAviso = `<span class="aviso-stock" style="color:#10b981">Disponível (${p.estoque})</span>`;

                // Detectar Marca
                let marca = "Exclusive";
                if(p.nome.toLowerCase().includes('nike')) marca = "Nike";
                if(p.nome.toLowerCase().includes('adidas')) marca = "Adidas";

                div.innerHTML += `
                    <div class="${classeCard}">
                        <div class="img-container">
                            <img src="${p.imagem}" alt="${p.nome}" onerror="this.src='https://placehold.co/300x300?text=Lust'">
                        </div>
                        <div class="info">
                            <div>
                                <span class="marca">${marca}</span>
                                <h3>${p.nome}</h3>
                                ${htmlAviso}
                            </div>
                            <div>
                                <div class="preco-box">
                                    <span class="preco">€${p.preco.toFixed(2)}</span>
                                </div>
                                <button class="btn-comprar" ${estadoBotao} onclick="adicionar(${p.id}, '${p.nome}', ${p.preco})">
                                    ${textoBotao}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrar(categoria) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');
            if (categoria === 'todos') renderizarProdutos(todosProdutos);
            else renderizarProdutos(todosProdutos.filter(p => p.nome.toLowerCase().includes(categoria.toLowerCase())));
        }

        function adicionar(id, nome, preco) {
            carrinho.push({ id, nome, preco });
            atualizarCarrinho();
            const btn = event.target;
            const original = btn.innerText;
            btn.innerText = "Adicionado ✔";
            btn.style.background = "#cca43b";
            setTimeout(() => { btn.innerText = original; btn.style.background = ""; }, 1000);
        }

        function atualizarCarrinho() {
            const qtd = carrinho.length;
            document.getElementById('contagem').innerText = qtd;
            document.getElementById('carrinho-flutuante').style.display = qtd > 0 ? 'block' : 'none';
        }

        async function checkout() {
            if (carrinho.length === 0) return;
            const btn = document.getElementById('carrinho-flutuante');
            btn.innerHTML = "A processar...";
            try {
                const res = await fetch(`${API_URL}/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(carrinho)
                });
                const data = await res.json();
                if (data.url) window.location.href = data.url;
            } catch (error) {
                alert("Erro ao conectar.");
                btn.innerHTML = "Tentar Novamente";
            }
        }

        carregarProdutos();
    </script>
</body>
</html>
