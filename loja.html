<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Loja | Beleza & Companhia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dark: #0a0a0a; --card: #161616; --rosa: #d63384; --rosa-claro: #ffb6c1; --texto: #f5f5f5; --alerta: #f39c12; --verde: #22c55e; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 0; }
        
        /* BARRA DE PORTES GRÁTIS */
        .frete-bar { background: #1e1e1e; color: var(--rosa-claro); font-size: 11px; text-align: center; padding: 8px; font-weight: bold; border-bottom: 1px solid #333; letter-spacing: 0.5px; }
        .frete-bar span { color: var(--verde); }

        header { background: #000; padding: 25px; text-align: center; border-bottom: 1px solid #222; position: sticky; top:0; z-index:100; }
        header h1 { margin: 0; color: var(--rosa); text-transform: uppercase; letter-spacing: 4px; font-size: 20px; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }
        
        /* 4 Colunas */
        .vitrine { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        @media (max-width: 1024px) { .vitrine { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .vitrine { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .vitrine { grid-template-columns: 1fr; } }
        
        .produto-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #222; transition: 0.3s; display: flex; flex-direction: column; position: relative; }
        .produto-card:hover { transform: translateY(-5px); border-color: var(--rosa); }
        
        .img-container { width: 100%; height: 260px; background: #000; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; padding: 10px; box-sizing: border-box; }
        
        .info { padding: 15px; text-align: center; flex: 1; display: flex; flex-direction: column; }
        .info h3 { margin: 0 0 10px; font-size: 14px; color: #fff; }
        .preco { font-size: 20px; color: var(--rosa-claro); font-weight: bold; margin-bottom: 5px; }
        .alerta-estoque { color: var(--alerta); font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; min-height: 14px; }
        
        .compra-row { display: flex; gap: 8px; margin-top: auto; }
        .qtd-seletor { display: flex; align-items: center; background: #222; border-radius: 8px; border: 1px solid #333; }
        .qtd-btn { background: transparent; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-comprar { background: var(--rosa); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; text-transform: uppercase; font-size: 11px; }
        
        #btn-carrinho { position: fixed; bottom: 20px; right: 20px; background: var(--rosa); color: white; padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; z-index:1000; }
        .cart-dot { background: white; color: black; border-radius: 50%; padding: 2px 7px; font-size: 10px; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="frete-bar">
        PORTES GRÁTIS: PT <span>> 60€</span> | ES <span>> 85€</span> | EUROPA <span>> 125€</span>
    </div>
    <header><h1>💎 Beleza & Companhia</h1></header>
    <div class="container"><div id="vitrine" class="vitrine">A carregar...</div></div>
    
    <button id="btn-carrinho" onclick="finalizarCompra()">
        🛒 FINALIZAR COMPRA <span id="cart-count" class="cart-dot">0</span>
    </button>
    
    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com';
        let carrinho = [];
        
        async function carregarProdutos() {
            const vitrine = document.getElementById('vitrine');
            try {
                const res = await fetch(`${API}/produtos`);
                const produtos = await res.json();
                vitrine.innerHTML = '';
                const hoje = new Date().setHours(0,0,0,0);

                produtos.forEach(p => {
                    const stock = parseInt(p.estoque) || 0;
                    const vencido = p.validade && new Date(p.validade) < hoje;
                    if (stock <= 0 || vencido) return; // Não mostra se estiver offline

                    const alertaBaixo = stock < 5 ? `⚠️ Restam apenas ${stock} un!` : '';

                    vitrine.innerHTML += `
                        <div class="produto-card">
                            <div class="img-container">
                                <img src="${p.imagem || ''}" onerror="this.src='https://via.placeholder.com/300?text=Sem+Foto'">
                            </div>
                            <div class="info">
                                <h3>${p.nome}</h3>
                                <div class="preco">€${parseFloat(p.preco).toFixed(2)}</div>
                                <div class="alerta-estoque">${alertaBaixo}</div>
                                <div class="compra-row">
                                    <div class="qtd-seletor">
                                        <button class="qtd-btn" onclick="mudarQtd('${p.id}', -1)">−</button>
                                        <span id="qtd-${p.id}" style="width:25px">1</span>
                                        <button class="qtd-btn" onclick="mudarQtd('${p.id}', 1, ${stock})">+</button>
                                    </div>
                                    <button class="btn-comprar" onclick="addCarrinho('${p.id}', '${p.nome}', ${p.preco})">Comprar</button>
                                </div>
                            </div>
                        </div>`;
                });
            } catch(e) { vitrine.innerHTML = "Erro ao carregar."; }
        }

        function mudarQtd(id, d, m) { 
            let el = document.getElementById(`qtd-${id}`);
            let n = parseInt(el.innerText) + d; 
            if (n >= 1 && (m === undefined || n <= m)) el.innerText = n; 
        }

        function addCarrinho(id, nome, preco) { 
            const q = parseInt(document.getElementById(`qtd-${id}`).innerText); 
            for(let i=0; i<q; i++) carrinho.push({id, nome, preco}); 
            document.getElementById('cart-count').innerText = carrinho.length; 
            const btn = event.target; 
            btn.innerText = "ADICIONADO!"; 
            setTimeout(() => { btn.innerText = "COMPRAR"; document.getElementById(`qtd-${id}`).innerText = 1; }, 800); 
        }

        async function finalizarCompra() { 
            if (!carrinho.length) return alert("O seu carrinho está vazio!"); 
            const btn = document.getElementById('btn-carrinho'); 
            btn.disabled = true;
            btn.innerText = "A PROCESSAR...";
            try {
                const res = await fetch(`${API}/checkout`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify(carrinho) 
                }); 
                const d = await res.json(); 
                if(d.url) window.location.href = d.url; 
            } catch(e) { 
                alert("Erro ao conectar ao servidor."); 
                btn.disabled = false;
                btn.innerText = "🛒 FINALIZAR COMPRA";
            }
        }
        
        window.onload = carregarProdutos;
    </script>
</body>
</html>
