<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Loja | Beleza & Companhia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dark: #0a0a0a; --card: #161616; --rosa: #d63384; --rosa-claro: #ffb6c1; --texto: #f5f5f5; --alerta: #f39c12; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 0; }
        
        header { background: #000; padding: 30px 20px; text-align: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; color: var(--rosa); text-transform: uppercase; letter-spacing: 5px; font-size: 26px; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        
        .produto-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #222; transition: 0.4s; position: relative; display: flex; flex-direction: column; }
        .produto-card:hover { transform: translateY(-5px); border-color: var(--rosa); }
        
        .produto-card.sem-estoque { opacity: 0.6; pointer-events: none; }
        .produto-card.sem-estoque img { filter: grayscale(100%); }
        
        .img-container { width: 100%; height: 320px; background: #000; position: relative; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .produto-card:hover .img-container img { transform: scale(1.05); }
        
        .overlay-indisponivel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; text-transform: uppercase; display: none; z-index: 5; border: 1px solid #555; }
        .sem-estoque .overlay-indisponivel { display: block; }
        
        .info { padding: 25px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { margin: 0 0 10px; font-size: 18px; color: var(--rosa-claro); }
        .preco { font-size: 24px; color: #fff; font-weight: 700; margin-bottom: 5px; }
        
        .alerta-stock { color: var(--alerta); font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        .msg-indisponivel { color: #666; font-size: 14px; margin-bottom: 20px; font-style: italic; }
        
        .compra-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .qtd-seletor { display: flex; align-items: center; background: #222; border-radius: 8px; border: 1px solid #333; overflow: hidden; }
        .qtd-btn { background: transparent; color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.2s; user-select: none; }
        .qtd-btn:hover { background: #333; color: var(--rosa); }
        .qtd-num { width: 30px; text-align: center; font-weight: bold; font-size: 14px; }
        
        .btn-comprar { background: var(--rosa); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; flex: 1; transition: 0.3s; }
        .btn-comprar:hover { filter: brightness(1.2); }
        
        #btn-carrinho { position: fixed; bottom: 30px; right: 30px; background: var(--rosa); color: white; padding: 18px 28px; border-radius: 50px; font-weight: bold; cursor: pointer; z-index: 1000; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        #btn-carrinho:hover { transform: scale(1.05); }
        #btn-carrinho:disabled { background: #555; cursor: wait; }
    </style>
</head>
<body>
    <header><h1>💎 Beleza & Companhia</h1></header>
    
    <div class="container">
        <div id="vitrine" class="vitrine">A carregar produtos...</div>
    </div>
    
    <button id="btn-carrinho" onclick="finalizarCompra()">
        🛒 Finalizar Compra (<span id="cart-count">0</span>)
    </button>

    <script>
        // URL da sua API no Render
        const API = 'https://projeto-loja-dzqv.onrender.com';
        let carrinho = [];

        async function carregarProdutos() {
            const vitrine = document.getElementById('vitrine');
            try {
                const res = await fetch(`${API}/produtos`);
                if (!res.ok) throw new Error("Erro ao ligar ao servidor");
                
                const produtos = await res.json();
                vitrine.innerHTML = '';
                
                if(produtos.length === 0) {
                    vitrine.innerHTML = "<p style='text-align:center; width:100%'>Nenhum produto disponível.</p>";
                    return;
                }

                produtos.forEach(p => {
                    const stock = parseInt(p.estoque) || 0;
                    const emStock = stock > 0;
                    const stockBaixo = emStock && stock <= 5;
                    const precoFormatado = parseFloat(p.preco || 0).toFixed(2);
                    const imagem = p.imagem || 'https://via.placeholder.com/400x500?text=Sem+Foto';

                    vitrine.innerHTML += `
                        <div class="produto-card ${!emStock ? 'sem-estoque' : ''}">
                            <div class="img-container">
                                <div class="overlay-indisponivel">Esgotado</div>
                                <img src="${imagem}" onerror="this.src='https://via.placeholder.com/400x500?text=Erro+Foto'">
                            </div>
                            <div class="info">
                                <h3>${p.nome}</h3>
                                ${emStock ? `
                                    <div class="preco">€${precoFormatado}</div>
                                    ${stockBaixo ? `<div class="alerta-stock">⚠️ Restam apenas ${stock} un!</div>` : '<div style="height:29px"></div>'}
                                    
                                    <div class="compra-row">
                                        <div class="qtd-seletor">
                                            <button class="qtd-btn" onclick="mudarQtd('${p.id}', -1)">−</button>
                                            <span class="qtd-num" id="qtd-${p.id}">1</span>
                                            <button class="qtd-btn" onclick="mudarQtd('${p.id}', 1, ${stock})">+</button>
                                        </div>
                                        <button class="btn-comprar" onclick="addCarrinho('${p.id}', '${p.nome}', ${p.preco}, '${imagem}')">Comprar</button>
                                    </div>
                                ` : `<div class="msg-indisponivel">Produto indisponível</div>`}
                            </div>
                        </div>`;
                });
            } catch (e) { 
                console.error(e);
                vitrine.innerHTML = "<p style='text-align:center'>Erro ao carregar a loja. Tente novamente.</p>";
            }
        }

        function mudarQtd(id, delta, max) {
            const el = document.getElementById(`qtd-${id}`);
            let atual = parseInt(el.innerText);
            let novo = atual + delta;
            
            if (novo >= 1 && (max === undefined || novo <= max)) {
                el.innerText = novo;
            }
        }

        function addCarrinho(id, nome, preco, imagem) {
            const qtd = parseInt(document.getElementById(`qtd-${id}`).innerText);
            
            // Adiciona a quantidade escolhida ao carrinho
            for(let i = 0; i < qtd; i++) {
                carrinho.push({ id, nome, preco: parseFloat(preco), imagem });
            }
            
            document.getElementById('cart-count').innerText = carrinho.length;
            
            // Efeito visual no botão
            const btn = event.target;
            const textoOriginal = btn.innerText;
            btn.innerText = "ADICIONADO!";
            btn.style.background = "#22c55e"; // Verde
            setTimeout(() => {
                btn.innerText = textoOriginal;
                btn.style.background = "";
                document.getElementById(`qtd-${id}`).innerText = 1; // Reseta qtd para 1
            }, 1000);
        }

        async function finalizarCompra() {
            if (carrinho.length === 0) return alert("O seu carrinho está vazio!");
            
            const btn = document.getElementById('btn-carrinho');
            const textoOriginal = btn.innerHTML;
            
            btn.innerHTML = "⏳ A ligar ao Stripe...";
            btn.disabled = true;

            try {
                // CORREÇÃO CRÍTICA: Enviar o array 'carrinho' diretamente
                const res = await fetch(`${API}/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(carrinho) 
                });

                if (!res.ok) {
                    const erro = await res.json();
                    throw new Error(erro.error || "Erro no servidor");
                }

                const data = await res.json();
                
                if (data.url) {
                    window.location.href = data.url; // Vai para o Stripe
                } else {
                    throw new Error("URL de pagamento não gerada");
                }

            } catch (e) {
                alert("Erro ao iniciar pagamento: " + e.message);
                btn.disabled = false;
                btn.innerHTML = textoOriginal;
            }
        }

        window.onload = carregarProdutos;
    </script>
</body>
</html>
