<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Loja | Beleza & Companhia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dark: #0a0a0a; --card: #161616; --rosa: #d63384; --rosa-claro: #ffb6c1; --texto: #f5f5f5; --alerta: #f39c12; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 0; }
        
        header { background: #000; padding: 25px; text-align: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; color: var(--rosa); text-transform: uppercase; letter-spacing: 4px; font-size: 22px; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 15px; min-height: 60vh; }
        
        .vitrine { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 25px; 
            padding-bottom: 100px;
        }

        @media (max-width: 1024px) { .vitrine { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .vitrine { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .vitrine { grid-template-columns: 1fr; } }
        
        .produto-card { 
            background: var(--card); 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid #222; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .produto-card:hover { transform: translateY(-8px); border-color: var(--rosa); box-shadow: 0 15px 30px rgba(214, 51, 132, 0.2); }
        
        .produto-card.indisponivel { opacity: 0.4; pointer-events: none; filter: grayscale(0.8); }
        
        .img-container { 
            width: 100%; 
            height: 280px; 
            background: radial-gradient(circle, #1e1e1e 0%, #0a0a0a 100%); 
            position: relative; 
            overflow: hidden;
            border-bottom: 1px solid #222;
        }
        .img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Foto inteira sem cortes */
            padding: 10px;
            box-sizing: border-box;
            transition: 0.5s; 
        }
        .produto-card:hover .img-container img { transform: scale(1.08); }
        
        .overlay-indisponivel { 
            position: absolute; 
            top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.85); 
            color: #f39c12; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 12px; 
            z-index: 5; 
            border: 1px solid #f39c12;
        }
        
        .info { padding: 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; }
        .info h3 { margin: 0 0 10px; font-size: 16px; color: #fff; font-weight: 600; }
        .preco { font-size: 22px; color: var(--rosa-claro); font-weight: 800; margin-bottom: 5px; }
        
        .alerta-stock { color: var(--alerta); font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; min-height: 14px; }
        
        .compra-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: auto; }
        .qtd-seletor { display: flex; align-items: center; background: #222; border-radius: 10px; border: 1px solid #333; }
        .qtd-btn { background: transparent; color: white; border: none; padding: 6px 12px; cursor: pointer; font-size: 18px; }
        .qtd-num { width: 30px; text-align: center; font-size: 14px; font-weight: bold; }
        
        .btn-comprar { 
            background: linear-gradient(45deg, var(--rosa), #a01a5b); 
            color: white; border: none; padding: 12px; 
            border-radius: 10px; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; 
            font-size: 11px; flex: 1; 
            transition: 0.3s;
        }
        .btn-comprar:hover { filter: brightness(1.3); box-shadow: 0 0 15px var(--rosa); }
        
        #btn-carrinho { 
            position: fixed; bottom: 30px; right: 30px; 
            background: var(--rosa); color: white; padding: 18px 30px; 
            border-radius: 50px; font-weight: 900; cursor: pointer; 
            z-index: 1000; border: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            font-size: 15px; 
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <header><h1>💎 Beleza & Companhia</h1></header>
    <div class="container"><div id="vitrine" class="vitrine"></div></div>
    <button id="btn-carrinho" onclick="finalizarCompra()">🛒 Finalizar (<span id="cart-count">0</span>)</button>

    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com';
        let carrinho = [];

        async function carregarProdutos() {
            const vitrine = document.getElementById('vitrine');
            try {
                const res = await fetch(`${API}/produtos`);
                const produtos = await res.json();
                vitrine.innerHTML = '';
                const hoje = new Date().setHours(0,0,0,0);

                produtos.forEach(p => {
                    const dataVal = p.validade ? new Date(p.validade).setHours(0,0,0,0) : null;
                    const vencido = dataVal && dataVal < hoje;
                    const stock = parseInt(p.estoque) || 0;
                    const disponivel = (stock > 0) && !vencido;
                    const stockBaixo = disponivel && stock <= 5;

                    vitrine.innerHTML += `
                        <div class="produto-card ${!disponivel ? 'indisponivel' : ''}">
                            <div class="img-container">
                                ${!disponivel ? '<div class="overlay-indisponivel">Indisponível</div>' : ''}
                                <img src="${p.imagem || 'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'">
                            </div>
                            <div class="info">
                                <h3>${p.nome}</h3>
                                ${disponivel ? `
                                    <div class="preco">€${parseFloat(p.preco).toFixed(2)}</div>
                                    <div class="alerta-stock">${stockBaixo ? `⚠️ Restam apenas ${stock} un!` : ''}</div>
                                    <div class="compra-row">
                                        <div class="qtd-seletor">
                                            <button class="qtd-btn" onclick="mudarQtd('${p.id}', -1)">−</button>
                                            <span class="qtd-num" id="qtd-${p.id}">1</span>
                                            <button class="qtd-btn" onclick="mudarQtd('${p.id}', 1, ${stock})">+</button>
                                        </div>
                                        <button class="btn-comprar" onclick="addCarrinho('${p.id}', '${p.nome}', ${p.preco}, '${p.imagem}')">Comprar</button>
                                    </div>
                                ` : `<div style="color:#666; font-size:13px; margin-top:20px; font-style: italic;">Produto indisponível</div>`}
                            </div>
                        </div>`;
                });
            } catch (e) { vitrine.innerHTML = "Erro ao carregar."; }
        }

        function mudarQtd(id, d, m) {
            const el = document.getElementById(`qtd-${id}`);
            let n = parseInt(el.innerText) + d;
            if (n >= 1 && (m === undefined || n <= m)) el.innerText = n;
        }

        function addCarrinho(id, nome, preco, imagem) {
            const qtd = parseInt(document.getElementById(`qtd-${id}`).innerText);
            for(let i=0; i<qtd; i++) carrinho.push({id, nome, preco, imagem});
            document.getElementById('cart-count').innerText = carrinho.length;
            const btn = event.target; btn.innerText = "OK!";
            setTimeout(() => { btn.innerText = "Comprar"; document.getElementById(`qtd-${id}`).innerText = 1; }, 800);
        }

        async function finalizarCompra() {
            if (carrinho.length === 0) return alert("Carrinho vazio!");
            const btn = document.getElementById('btn-carrinho'); btn.disabled = true;
            try {
                const res = await fetch(`${API}/checkout`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(carrinho) 
                });
                const d = await res.json(); if (d.url) window.location.href = d.url;
            } catch (e) { alert("Erro."); btn.disabled = false; }
        }
        window.onload = carregarProdutos;
    </script>
</body>
</html>
