<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Loja | Beleza & Companhia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dark: #0a0a0a; --card: #161616; --rosa: #d63384; --rosa-claro: #ffb6c1; --texto: #f5f5f5; --alerta: #f39c12; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--dark); color: var(--texto); margin: 0; padding: 0; }
        
        header { background: #000; padding: 20px; text-align: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; color: var(--rosa); text-transform: uppercase; letter-spacing: 3px; font-size: 22px; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; min-height: 60vh; }
        
        /* Grid de 4 colunas */
        .vitrine { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
            padding-bottom: 100px;
        }

        @media (max-width: 1024px) { .vitrine { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .vitrine { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .vitrine { grid-template-columns: 1fr; } }
        
        .produto-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #222; transition: 0.3s; position: relative; display: flex; flex-direction: column; }
        
        /* Estado Indisponível */
        .produto-card.indisponivel { opacity: 0.5; pointer-events: none; }
        .produto-card.indisponivel img { filter: grayscale(100%); }
        
        .img-container { width: 100%; height: 250px; background: #000; position: relative; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Faixa com texto Amarelo */
        .overlay-indisponivel { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.85); 
            color: #f39c12; /* AMARELO */
            padding: 10px 20px; 
            border-radius: 5px; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 13px; 
            z-index: 5; 
            border: 1px solid #f39c12; 
            display: none; 
            white-space: nowrap;
        }
        .indisponivel .overlay-indisponivel { display: block; }
        
        .info { padding: 15px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { margin: 0 0 8px; font-size: 15px; color: var(--rosa-claro); }
        .preco { font-size: 20px; color: #fff; font-weight: 700; margin-bottom: 5px; }
        
        .compra-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; }
        .qtd-seletor { display: flex; align-items: center; background: #222; border-radius: 6px; border: 1px solid #333; }
        .qtd-btn { background: transparent; color: white; border: none; padding: 5px 10px; cursor: pointer; font-size: 16px; }
        .qtd-num { width: 25px; text-align: center; font-size: 13px; font-weight: bold; }
        
        .btn-comprar { background: var(--rosa); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; flex: 1; }
        
        #btn-carrinho { position: fixed; bottom: 20px; right: 20px; background: var(--rosa); color: white; padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; z-index: 1000; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; }
    </style>
</head>
<body>
    <header><h1>💎 Beleza & Companhia</h1></header>
    
    <div class="container">
        <div id="vitrine" class="vitrine">A carregar...</div>
    </div>
    
    <button id="btn-carrinho" onclick="finalizarCompra()">
        🛒 Finalizar (<span id="cart-count">0</span>)
    </button>

    <script>
        const API = 'https://projeto-loja-dzqv.onrender.com';
        let carrinho = [];

        async function carregarProdutos() {
            const vitrine = document.getElementById('vitrine');
            try {
                const res = await fetch(`${API}/produtos`);
                const produtos = await res.json();
                vitrine.innerHTML = '';
                
                const hoje = new Date();
                hoje.setHours(0,0,0,0);

                produtos.forEach(p => {
                    const dataVal = p.validade ? new Date(p.validade) : null;
                    const vencido = dataVal && dataVal < hoje;
                    const stock = parseInt(p.estoque) || 0;
                    
                    // Lógica corrigida: Disponível APENAS se tiver estoque E não estiver vencido
                    const disponivel = (stock > 0) && !vencido;

                    const precoFormatado = parseFloat(p.preco || 0).toFixed(2);
                    const imagem = p.imagem || 'https://via.placeholder.com/300x350?text=Sem+Foto';

                    vitrine.innerHTML += `
                        <div class="produto-card ${!disponivel ? 'indisponivel' : ''}">
                            <div class="img-container">
                                <div class="overlay-indisponivel">Indisponível</div>
                                <img src="${imagem}" onerror="this.src='https://via.placeholder.com/300x350?text=Erro+Foto'">
                            </div>
                            <div class="info">
                                <h3>${p.nome}</h3>
                                ${disponivel ? `
                                    <div class="preco">€${precoFormatado}</div>
                                    <div class="compra-row">
                                        <div class="qtd-seletor">
                                            <button class="qtd-btn" onclick="mudarQtd('${p.id}', -1)">−</button>
                                            <span class="qtd-num" id="qtd-${p.id}">1</span>
                                            <button class="qtd-btn" onclick="mudarQtd('${p.id}', 1, ${stock})">+</button>
                                        </div>
                                        <button class="btn-comprar" onclick="addCarrinho('${p.id}', '${p.nome}', ${p.preco}, '${imagem}')">Comprar</button>
                                    </div>
                                ` : `<div style="color:#666; font-size:13px; margin: 10px 0; font-style: italic;">Produto indisponível</div>`}
                            </div>
                        </div>`;
                });
            } catch (e) { vitrine.innerHTML = "Erro ao carregar loja."; }
        }

        function mudarQtd(id, delta, max) {
            const el = document.getElementById(`qtd-${id}`);
            if(!el) return;
            let novo = parseInt(el.innerText) + delta;
            if (novo >= 1 && (max === undefined || novo <= max)) el.innerText = novo;
        }

        function addCarrinho(id, nome, preco, imagem) {
            const qtd = parseInt(document.getElementById(`qtd-${id}`).innerText);
            for(let i = 0; i < qtd; i++) {
                carrinho.push({ id, nome, preco: parseFloat(preco), imagem });
            }
            document.getElementById('cart-count').innerText = carrinho.length;
            const btn = event.target;
            const textoOriginal = btn.innerText;
            btn.innerText = "OK!";
            setTimeout(() => { btn.innerText = textoOriginal; document.getElementById(`qtd-${id}`).innerText = 1; }, 800);
        }

        async function finalizarCompra() {
            if (carrinho.length === 0) return alert("Carrinho vazio!");
            const btn = document.getElementById('btn-carrinho');
            btn.disabled = true;
            try {
                const res = await fetch(`${API}/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(carrinho) 
                });
                const data = await res.json();
                if (data.url) window.location.href = data.url;
            } catch (e) { alert("Erro ao finalizar."); btn.disabled = false; }
        }

        window.onload = carregarProdutos;
    </script>
</body>
</html>
