<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Acesso Admin | Lust Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 8px; border: 1px solid #334155; text-align: center; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-top: 4px solid #cca43b; }
        .logo { height: 50px; margin-bottom: 10px; }
        h2 { color: #cca43b; margin: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
        p { color: #94a3b8; font-size: 12px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 12px; background: #cca43b; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; color: #0f172a; }
        button:hover { background: #eab308; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="logo.png" alt="Lust" class="logo" onerror="this.style.display='none'">
        <h2>Lust Store</h2>
        <p>Acesso Restrito</p>
        <input type="password" id="senha" placeholder="Senha de Acesso">
        <button onclick="entrar()" id="btn-entrar">ENTRAR</button>
        <p id="msg" style="color:#ef4444; display:none; margin-top:15px; font-size:11px;">Senha Incorreta</p>
    </div>

    <script>
        // URL CORRETA
        const API_URL = 'https://projeto-loja-dzqv.onrender.com/login-admin';

        async function entrar() {
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-entrar');
            const msg = document.getElementById('msg');

            btn.disabled = true; btn.innerText = "..."; msg.style.display = 'none';

            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha }) });
                const data = await res.json();
                if (data.sucesso) { localStorage.setItem('token_gerente', data.token); window.location.href = 'adm.html'; } 
                else { throw new Error(); }
            } catch (e) {
                msg.style.display = 'block'; btn.disabled = false; btn.innerText = "ENTRAR";
            }
        }
    </script>
</body>
</html>
