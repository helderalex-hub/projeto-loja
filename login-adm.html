<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito | Beleza & Cia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #334155;
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { color: #d63384; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; font-size: 20px; }
        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { filter: brightness(1.1); }
        .erro { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 Acesso Gerente</h2>
        <input type="password" id="senha" placeholder="Digite a senha de acesso">
        <button onclick="entrar()">ENTRAR</button>
        <p id="msg-erro" class="erro">Senha incorreta!</p>
    </div>

    <script>
        function entrar() {
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('msg-erro');
            
            // --- DEFINA A SUA SENHA AQUI ---
            // Por enquanto é uma senha fixa para não complicar o servidor
            const SENHA_SECRETA = "admin2026"; 

            if (senha === SENHA_SECRETA) {
                // Cria uma "chave" no navegador a dizer que estás logado
                localStorage.setItem('token_gerente', 'logado_sucesso');
                // Redireciona para o painel
                window.location.href = 'adm.html';
            } else {
                msg.style.display = 'block';
            }
        }
        
        // Permite apertar ENTER para entrar
        document.getElementById('senha').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') entrar();
        });
    </script>
</body>
</html>
