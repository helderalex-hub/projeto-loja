<script>
    const API_URL = 'https://projeto-loja-dzqv.onrender.com/login-admin';

    async function entrar() {
        const senha = document.getElementById('senha').value;
        const msg = document.getElementById('msg-erro');
        const btn = document.querySelector('button');

        btn.innerText = "VERIFICANDO...";
        btn.disabled = true;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senha: senha })
            });

            const data = await res.json();

            if (data.sucesso) {
                // Guarda o token e entra
                localStorage.setItem('token_gerente', data.token);
                window.location.href = 'adm.html';
            } else {
                msg.innerText = "Senha incorreta!";
                msg.style.display = 'block';
                btn.innerText = "ENTRAR";
                btn.disabled = false;
            }
        } catch (error) {
            msg.innerText = "Erro ao ligar ao servidor.";
            msg.style.display = 'block';
            btn.innerText = "ENTRAR";
            btn.disabled = false;
        }
    }

    document.getElementById('senha').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') entrar();
    });
</script>
