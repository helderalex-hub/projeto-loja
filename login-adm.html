<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito | Beleza & Cia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #334155;
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { color: #d63384; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-size: 20px; }
        p.subtitulo { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        
        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
        }
        input:focus { border-color: #d63384; outline: none; }
        
        button {
            width: 100%;
            padding: 12px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }
        button:hover { filter: brightness(1.1); }
        button:disabled { opacity: 0.7; cursor: wait; background: #64748b; }
        
        .erro { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 Área Gerente</h2>
        <p class="subtitulo">Acesso restrito à administração</p>
        
        <input type="password" id="senha" placeholder="Senha de Acesso">
        
        <button id="btnEntrar" onclick="entrar()">ENTRAR NO PAINEL</button>
        
        <p id="msg-erro" class="erro">Senha incorreta!</p>
    </div>

    <script>
        const API_URL = 'https://projeto-loja-dzqv.onrender.com/login-admin';

        async function entrar() {
            const campoSenha = document.getElementById('senha');
            const msg = document.getElementById('msg-erro');
            const btn = document.getElementById('btnEntrar');

            // Proteção extra: se não achar o campo, para tudo
            if (!campoSenha) return;

            const valorSenha = campoSenha.value;
            if (!valorSenha) return; 

            btn.innerText = "A VERIFICAR...";
            btn.disabled = true;
            msg.style.display = 'none';

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha: valorSenha })
                });

                const data = await res.json();

                if (data.sucesso) {
                    localStorage.setItem('token_gerente', data.token);
                    window.location.href = 'adm.html';
                } else {
                    msg.innerText = "Senha incorreta!";
                    msg.style.display = 'block';
                    btn.innerText = "ENTRAR NO PAINEL";
                    btn.disabled = false;
                    campoSenha.value = '';
                    campoSenha.focus();
                }
            } catch (error) {
                console.error(error);
                msg.innerText = "Erro ao ligar ao servidor.";
                msg.style.display = 'block';
                btn.innerText = "ENTRAR NO PAINEL";
                btn.disabled = false;
            }
        }

        // --- A CORREÇÃO PRINCIPAL ESTÁ AQUI ---
        // window.onload garante que o HTML existe antes de tentar buscar o ID 'senha'
        window.onload = function() {
            const campoSenha = document.getElementById('senha');
            
            if (campoSenha) {
                // Foca no campo assim que abre a página
                campoSenha.focus();

                // Adiciona o evento de tecla Enter
                campoSenha.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        entrar();
                    }
                });
            } else {
                console.error("Erro Crítico: Campo de senha não encontrado no HTML.");
            }
        };
    </script>
</body>
</html>
